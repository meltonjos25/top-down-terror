  'Band Curl to Press Blue': 'Muscles Targeted: biceps brachii, anterior deltoid, and triceps brachii. Movement Benefit: develops strength and coordination across the entire arm from elbow flexion through overhead extension. Sport Application: Basketball — strengthens the motion of catching a pass low and immediately shooting overhead in traffic.',
  'Band Donkey Kick Fast Tan': 'Muscles Targeted: gluteus maximus, gluteus medius, and hamstrings. Movement Benefit: develops hip extension rate of force development in a quadruped position, loading the glutes through full extension. Sport Application: Soccer — powers the hip extension required to drive a ball with the heel in a bicycle kick.',
  'Band External Rotation': 'Muscles Targeted: infraspinatus, teres minor, and posterior deltoid. Movement Benefit: strengthens the external rotators of the rotator cuff to balance the dominant internal rotators and protect the shoulder during overhead activity. Sport Application: Baseball — builds the deceleration strength that prevents posterior shoulder injuries after a pitch release.',
  'Band Face Pull': 'Muscles Targeted: posterior deltoid, infraspinatus, teres minor, and middle trapezius. Movement Benefit: develops shoulder external rotation and horizontal abduction strength to counteract forward rounding from pressing and daily posture. Sport Application: Swimming — strengthens the hand-exit phase of backstroke where the shoulder must externally rotate under load.',
  'Band Face Pull Fast Green': 'Muscles Targeted: posterior deltoid, rear deltoid, and infraspinatus. Movement Benefit: trains the posterior shoulder with speed to develop reactive stability during fast-moving overhead activities. Sport Application: Volleyball — builds the shoulder control needed to execute a quick-set dig and transition to an attack position.',
  'Band Face Pull Green': 'Muscles Targeted: posterior deltoid, middle trapezius, and external rotators. Movement Benefit: reinforces scapular retraction and shoulder external rotation with moderate resistance for balanced shoulder health. Sport Application: Tennis — protects the serving shoulder by strengthening the muscles that decelerate the arm after ball impact.',
  'Band Front Raise Fast Tan': 'Muscles Targeted: anterior deltoid, clavicular pectoralis, and serratus anterior. Movement Benefit: develops anterior shoulder speed and endurance through rapid front raises against light accommodating resistance. Sport Application: Cycling — strengthens the shoulder muscles that stabilize handlebars during out-of-saddle climbing sprints.',
  'Band Front Raise Single Arm': 'Muscles Targeted: anterior deltoid and clavicular head of pectoralis major. Movement Benefit: develops unilateral anterior shoulder strength and trains rotational core stabilization against the asymmetric load. Sport Application: Kayaking — builds the arm-reach strength for the catch phase of a forward paddle stroke.',
  'Band Glute Bridge': 'Muscles Targeted: gluteus maximus, hamstrings, and posterior core. Movement Benefit: trains hip extension in a supine position with the band adding resistance at the top where glutes are fully contracted. Sport Application: Sprinting — develops the hip extension power that drives force into the ground during the push-off phase.',
  'Band Glute Bridge Blue': 'Muscles Targeted: gluteus maximus, hamstrings, and hip external rotators. Movement Benefit: strengthens hip extension against heavy band resistance while training abduction control to prevent knee cave. Sport Application: Sprinting — builds the glute power required to generate maximal propulsive force at toe-off.',
  'Band Glute Bridge Fast Blue': 'Muscles Targeted: gluteus maximus and hamstrings. Movement Benefit: trains explosive hip extension rate of force development in a supine position for power-focused glute activation. Sport Application: Football — develops the hip thrust power needed to drive through a block during a run play.',
  'Band Glute Bridge Slow Blue': 'Muscles Targeted: gluteus maximus, hamstrings, and erector spinae. Movement Benefit: builds hip extension endurance with slow tempo under heavy resistance to develop sustained glute strength. Sport Application: Cycling — strengthens the glutes to maintain powerful pedal strokes through long climbs without fading.',
  'Band Hammer Curl': 'Muscles Targeted: brachioradialis, brachialis, and biceps brachii. Movement Benefit: develops neutral-grip elbow flexion strength that transfers to all pulling movements where the wrist is in a hammer position. Sport Application: Rock climbing — builds forearm and elbow strength for gripping and pulling through a sidepull hold.',
  'Band High Row': 'Muscles Targeted: upper trapezius, posterior deltoid, and rhomboids. Movement Benefit: trains scapular elevation and retraction simultaneously in a high pulling pattern that strengthens the upper back complex. Sport Application: Wrestling — builds the pulling strength used to control an opponent\'s head and neck in a Greco-Roman clinch.',
  'Band Kickback Fast Tan': 'Muscles Targeted: triceps brachii, posterior deltoid, and latissimus dorsi. Movement Benefit: develops elbow extension speed with a fast tempo to train the triceps\' contribution to explosive pushing movements. Sport Application: Boxing — strengthens the arm extension component of a jab\'s final punch-through motion.',
  'Band Lateral Raise': 'Muscles Targeted: middle deltoid and supraspinatus. Movement Benefit: isolates the lateral deltoid to build shoulder width and improve glenohumeral stability during abduction movements. Sport Application: Swimming — strengthens the arm recovery phase of butterfly stroke where the deltoid lifts the arm above the waterline.',
  'Band Lateral Walk Green': 'Muscles Targeted: gluteus medius, gluteus minimus, and tensor fasciae latae. Movement Benefit: trains hip abductors under continuous tension in a standing functional position to develop lateral movement strength. Sport Application: Basketball — builds the hip strength needed to maintain a defensive shuffling stance against a dribbler.',
  'Band Overhead Press': 'Muscles Targeted: anterior deltoid, medial deltoid, triceps brachii, and upper trapezius. Movement Benefit: develops overhead pushing strength with band resistance that accommodates the shoulder\'s stronger lock-out position. Sport Application: Volleyball — builds the arm drive needed for a powerful spike arm swing from a setter\'s high ball.',
  'Band Overhead Press Blue': 'Muscles Targeted: anterior deltoid, triceps brachii, and upper trapezius. Movement Benefit: strengthens the full overhead pressing pattern with heavy resistance to build functional shoulder strength. Sport Application: Basketball — develops the arm strength to shoot off the dribble from distance over an outstretched defender.',
  'Band Overhead Press Green': 'Muscles Targeted: anterior deltoid, medial deltoid, and triceps brachii. Movement Benefit: builds overhead pressing strength with moderate resistance while training scapular elevation and upward rotation. Sport Application: Gymnastics — develops the shoulder strength needed to press into a handstand from a pike position.',
  'Band Overhead Press Seated': 'Muscles Targeted: anterior deltoid, triceps brachii, and upper trapezius. Movement Benefit: removes lower-body momentum to isolate the shoulder pressers and develop strict overhead strength. Sport Application: Weightlifting — builds the pressing strength and stability needed for a jerk recovery in the overhead position.',
  'Band Overhead Tricep Ext': 'Muscles Targeted: triceps brachii long head and medial head. Movement Benefit: trains elbow extension from a stretched overhead position to maximize long-head tricep recruitment and build pushing endurance. Sport Application: Swimming — strengthens the underwater pull-through phase of freestyle where the tricep extends the arm behind the hip.',
  'Band Overhead Tricep Extension': 'Muscles Targeted: triceps brachii long head, medial head, and lateral head. Movement Benefit: develops tricep strength through a long muscle length by pressing from full stretch overhead to full elbow extension. Sport Application: Tennis — builds the arm-straightening power needed to drive through a topspin serve at ball contact.',
  'Band Pallof Press': 'Muscles Targeted: internal oblique, external oblique, transverse abdominis, and gluteus medius. Movement Benefit: trains anti-rotation core stability by resisting a lateral band pull while pressing forward in a controlled pattern. Sport Application: Golf — builds the rotational bracing strength that protects the spine during a high-speed swing through impact.',
  'Band Pallof Press Blue': 'Muscles Targeted: obliques, transverse abdominis, and gluteus medius. Movement Benefit: develops anti-rotation core strength under heavy resistance to build robust lateral spine stability. Sport Application: Baseball — reinforces the trunk stiffness needed to transfer rotational power from the hips to the bat during a swing.',
  'Band Pallof Press Tan': 'Muscles Targeted: internal oblique, external oblique, and transverse abdominis. Movement Benefit: introduces anti-rotation training at light resistance to develop core stability mechanics with precise technique. Sport Application: Tennis — teaches the trunk control that prevents energy leakage between hip rotation and racket contact.',
  'Band Pull-Apart': 'Muscles Targeted: posterior deltoid, rhomboids, and middle trapezius. Movement Benefit: develops horizontal abduction strength and scapular retraction to counteract the forward-rounded posture from daily life. Sport Application: Archery — builds the scapular retraction strength needed to draw a bowstring to full anchor position.',
  'Band Pull-Apart Blue': 'Muscles Targeted: posterior deltoid, rhomboids, and infraspinatus. Movement Benefit: strengthens scapular retraction and shoulder external rotation under heavy band resistance for robust posterior shoulder health. Sport Application: Baseball — develops the arm deceleration musculature that protects the posterior shoulder after a throw release.',
  'Band Pull-Apart Green': 'Muscles Targeted: posterior deltoid, middle trapezius, and rhomboids. Movement Benefit: builds horizontal shoulder abduction strength with moderate resistance to improve scapular positioning and posture. Sport Application: Swimming — strengthens the hand-exit and recovery phase of backstroke where the shoulder must control external rotation.',
  'Band Pull-Apart Tan': 'Muscles Targeted: posterior deltoid and middle trapezius. Movement Benefit: activates the posterior shoulder muscles with light resistance to establish scapular retraction patterns before heavier pulling work. Sport Application: Rowing — primes the scapular muscles for the finish position of a rowing stroke where the handles pull to the lower chest.',
  'Band Pull-Down': 'Muscles Targeted: latissimus dorsi, teres major, and biceps brachii. Movement Benefit: trains the vertical pulling pattern against accommodating resistance to develop lat strength and scapular depression. Sport Application: Gymnastics — builds the lat pulling strength needed to transition from a hang to a support position on the rings.',
  'Band Rear Delt Fly': 'Muscles Targeted: posterior deltoid, infraspinatus, and rhomboids. Movement Benefit: isolates the posterior deltoid through horizontal abduction to correct the front-to-back shoulder strength imbalance from pressing work. Sport Application: Swimming — strengthens the shoulder muscles that decelerate the arm entry during the catch phase of freestyle.',
  'Band Resisted Bird Dog Tan': 'Muscles Targeted: erector spinae, gluteus maximus, and contralateral multifidus. Movement Benefit: adds anti-rotation demand to the standard bird dog by resisting lateral pulling forces during opposite arm-leg extension. Sport Application: Soccer — develops the spinal stability needed to strike a ball powerfully without collapsing the supporting leg.',
  'Band Resisted Crunch Blue': 'Muscles Targeted: rectus abdominis and internal oblique. Movement Benefit: develops trunk flexion strength against heavy band resistance to build the abs\' force-generating capacity through full range. Sport Application: Rowing — builds the trunk compression strength needed to explosively pull through the drive phase of each stroke.',
  'Band Resisted Hollow Body Blue': 'Muscles Targeted: transverse abdominis, rectus abdominis, and hip flexors. Movement Benefit: trains the entire anterior core under band-loaded tension while the hollow position challenges the body to maintain isometric stiffness. Sport Application: Gymnastics — develops the body tension required to hold a connected hollow position on the bars or beam.',
  'Band Reverse Fly': 'Muscles Targeted: posterior deltoid, rhomboids, and middle trapezius. Movement Benefit: strengthens the upper back pulling muscles through horizontal abduction to improve posture and scapular stability. Sport Application: Tennis — builds the backhand drive strength by developing the muscles that pull the racket through the hitting zone.',
  'Band Reverse Fly Fast Tan': 'Muscles Targeted: posterior deltoid and rhomboids. Movement Benefit: trains posterior shoulder endurance and speed with light resistance to improve reactive shoulder stability. Sport Application: Badminton — develops the rear deltoid speed needed for quick overhead smashes and rapid net-play recovery.',
  'Band Reverse Fly Tan': 'Muscles Targeted: posterior deltoid and middle trapezius. Movement Benefit: activates the posterior shoulder complex with light resistance to warm up the pulling muscles before heavier rowing movements. Sport Application: Kayaking — primes the shoulder for the sweep stroke phase where the blade exits the water behind the paddler.',
  'Band Row': 'Muscles Targeted: latissimus dorsi, rhomboids, and biceps brachii. Movement Benefit: develops horizontal pulling strength with accommodating resistance for balanced shoulder and upper back development. Sport Application: Rowing — builds the arm and back strength needed to drive each stroke through the finish position.',
  'Band Row Fast Green': 'Muscles Targeted: latissimus dorsi, rhomboids, and rear deltoid. Movement Benefit: trains explosive horizontal pulling speed against moderate resistance for reactive upper-back strength. Sport Application: Wrestling — develops the speed of pulling an opponent\'s arm to initiate a single-leg takedown setup.',
  'Band Row Green': 'Muscles Targeted: latissimus dorsi, rhomboids, and biceps brachii. Movement Benefit: builds horizontal pulling strength with moderate band resistance while training scapular retraction and depression mechanics. Sport Application: Rock climbing — strengthens the pulling pattern for a lock-off move on a steep wall.',
  'Band Row Slow Green': 'Muscles Targeted: latissimus dorsi, rhomboids, middle trapezius, and rear deltoid. Movement Benefit: maximizes time under tension in the horizontal pulling muscles with a controlled eccentric phase for strength and endurance. Sport Application: Paddling — develops the sustained back pulling power needed to maintain stroke efficiency across a long course.',
  'Band Romanian Deadlift Green': 'Muscles Targeted: hamstrings, gluteus maximus, and erector spinae. Movement Benefit: develops hip hinge mechanics with eccentric hamstring loading to build posterior chain strength and flexibility simultaneously. Sport Application: Sprinting — strengthens the hamstrings in their stretched position to improve stride length and reduce injury risk.',
  'Band Squat': 'Muscles Targeted: quadriceps, gluteus maximus, and hamstrings. Movement Benefit: develops lower body pushing strength with band resistance that accommodates the joint\'s mechanical advantage at the top of the movement. Sport Application: Basketball — builds the leg strength needed for a vertical jump at the end of an explosive cut.',
  'Band Squat Blue': 'Muscles Targeted: quadriceps, gluteus maximus, and hamstrings. Movement Benefit: strengthens the squat pattern under heavy accommodating resistance to build maximal lower-body strength. Sport Application: Volleyball — develops the powerful leg drive needed to jump high on a quick set attack.',
  'Band Squat Fast Green': 'Muscles Targeted: quadriceps, gluteus maximus, and hip abductors. Movement Benefit: trains explosive lower-body rate of force development against moderate resistance for jump and sprint power. Sport Application: Soccer — builds the reactive leg strength to jump and win a header contest against a taller opponent.',
  'Band Squat Green': 'Muscles Targeted: quadriceps, gluteus maximus, and hamstrings. Movement Benefit: builds squat strength with moderate accommodating resistance while maintaining good knee tracking and hip mobility. Sport Application: Skiing — develops the quad endurance needed to absorb moguls and variable terrain in a tuck position.',
  'Band Squat Jump Small Green': 'Muscles Targeted: quadriceps, gluteus maximus, and calf complex. Movement Benefit: trains the stretch-shortening cycle with a small jump amplitude to develop reactive leg stiffness and landing mechanics. Sport Application: Basketball — improves the quick-reaction jump needed to get off the ground fast on a put-back rebound.',
  'Band Squat Slow Blue': 'Muscles Targeted: quadriceps, gluteus maximus, and hamstrings. Movement Benefit: maximizes time under tension in the squat pattern with heavy band resistance and a controlled tempo for strength and hypertrophy. Sport Application: Cycling — builds the sustained quad and glute strength needed to maintain power output on extended climbs.',
  'Band Side Step Fast Tan': 'Muscles Targeted: gluteus medius, tensor fasciae latae, and hip external rotators. Movement Benefit: develops lateral hip strength and speed to improve change-of-direction quickness and defensive shuffling capability. Sport Application: Tennis — builds the lateral step speed needed to reach wide balls on either side of the court.',
  'Band Sumo Squat Green': 'Muscles Targeted: adductors, gluteus maximus, and quadriceps. Movement Benefit: targets the inner thigh and hip external rotators with a wide stance squat pattern for balanced lower body strength. Sport Application: Martial arts — develops the hip strength needed to execute a wide-based throw or hip toss from a low entry.',
  'Band Tricep Kickback': 'Muscles Targeted: triceps brachii lateral and long heads. Movement Benefit: trains elbow extension in a hinged position where gravity and band tension combine to isolate the tricep through full contraction. Sport Application: Boxing — strengthens the arm extension that delivers power through the final few inches of a cross punch.',
  'Band Tricep Overhead Ext': 'Muscles Targeted: triceps brachii long head. Movement Benefit: stretches and strengthens the long head of the tricep from a fully lengthened position overhead to develop maximum elbow extension power. Sport Application: Tennis — builds the tricep power needed to snap the racket head through the ball on a flat serve.',
  'Band Tricep Pushdown': 'Muscles Targeted: triceps brachii lateral head, medial head, and long head. Movement Benefit: develops elbow extension strength through a full downward range of motion to build pushing endurance and arm lockout strength. Sport Application: Swimming — strengthens the underwater push-through of a butterfly pull where the hand drives past the hip.',
  'Band Tricep Pushdown Blue': 'Muscles Targeted: triceps brachii lateral and medial heads. Movement Benefit: builds elbow extension strength under heavy resistance to develop the pressing power needed for pushing movements. Sport Application: Football — strengthens the arm extension used to disengage a lineman\'s block in a pass-rush move.',
  'Band Upright Row': 'Muscles Targeted: middle deltoid, upper trapezius, and brachialis. Movement Benefit: develops shoulder abduction and elbow flexion in a combined lifting pattern that strengthens the entire shoulder girdle. Sport Application: Swimming — builds the shoulder elevation strength needed for the hand-exit and recovery arc of backstroke.',
  'Band Upright Row Green': 'Muscles Targeted: middle deltoid, upper trapezius, and rhomboids. Movement Benefit: strengthens the upward pull pattern with moderate resistance to develop shoulder abduction and scapular elevation. Sport Application: Weightlifting — develops the high pull pattern used during the transition from a hang clean into the catch position.',
  'Bear Crawl In Place': 'Muscles Targeted: anterior deltoid, triceps brachii, transverse abdominis, and quadriceps. Movement Benefit: develops shoulder stability and cross-body core coordination by maintaining a hover position with weight shifting between contralateral limbs. Sport Application: Wrestling — builds the shoulder and hip stability used to defend the turtle position during a scramble.',
  'Bear Hold': 'Muscles Targeted: anterior deltoid, serratus anterior, transverse abdominis, and quadriceps. Movement Benefit: develops full-body tension and shoulder stability by holding a quadruped hover position where the knees hover just above the floor. Sport Application: Gymnastics — builds the full-body tension required to maintain a tight body shape during a floor tumbling pass.',
  'Bench Dip Negative': 'Muscles Targeted: triceps brachii, anterior deltoid, and pectoralis major. Movement Benefit: builds eccentric tricep and anterior shoulder strength to develop the lowering strength needed for full dips. Sport Application: Basketball — develops the arm strength to control the descent when catching an above-the-rim alley-oop.',
  'Bicep Wall Stretch': 'Muscles Targeted: biceps brachii and anterior shoulder capsule. Movement Benefit: restores elbow extension and shoulder extension range of motion lost from chronic elbow flexor tightness. Sport Application: Swimming — improves the hand entry angle for freestyle by allowing full shoulder extension at the catch.',
  'Bird Dog': 'Muscles Targeted: erector spinae, gluteus maximus, and contralateral multifidus. Movement Benefit: trains spinal stability and anti-rotation control by extending opposite arm and leg simultaneously without pelvic rotation. Sport Application: Golf — develops the diagonal body control that transfers rotational power from the back hip to the lead shoulder in a swing.',
  'Breathing Wall Sit': 'Muscles Targeted: quadriceps, hip external rotators, and diaphragm. Movement Benefit: combines isometric lower body loading with controlled breathing to train respiratory mechanics under physical stress. Sport Application: Cycling — develops the ability to breathe diaphragmatically during sustained quad-intensive efforts on a climb.',
  'Burpee to Hollow Body': 'Muscles Targeted: pectoralis major, triceps brachii, rectus abdominis, and quadriceps. Movement Benefit: combines an explosive full-body push-up with a demanding core hold to build power and midline endurance in a single movement. Sport Application: Gymnastics — develops the body tension needed to land from a jump and immediately transition to a connected hollow shape.',
  'Cat-Camel': 'Muscles Targeted: erector spinae, multifidus, and rectus abdominis. Movement Benefit: promotes spinal segmental mobility by alternating flexion and extension to lubricate the facet joints and decompress the disc space. Sport Application: Swimming — improves the undulating body wave mechanics required for butterfly stroke efficiency.',
  'Cat-Camel Stretch': 'Muscles Targeted: erector spinae, multifidus, and thoracic extensors. Movement Benefit: restores full spinal range of motion and activates the deep stabilizing muscles before loaded movement. Sport Application: Gymnastics — prepares the spine for the arched and rounded positions demanded by back walkovers and front walkovers.',
  'Cat-Cow': 'Muscles Targeted: erector spinae, multifidus, and rectus abdominis. Movement Benefit: increases lumbar and thoracic spine mobility and activates the deep paraspinal muscles through full sagittal-plane spinal movement. Sport Application: Yoga — builds the spinal awareness and range of motion for smooth sun salutation transitions.',
  'Chest Opener': 'Muscles Targeted: pectoralis minor, anterior deltoid, and subscapularis. Movement Benefit: stretches the anterior shoulder and chest to improve thoracic extension and shoulder external rotation for overhead work. Sport Application: Volleyball — opens the chest before a spike approach to allow full arm-swing amplitude.',
  'Clap Push-Up': 'Muscles Targeted: pectoralis major, triceps brachii, and anterior deltoid. Movement Benefit: develops explosive horizontal pressing power by maximizing concentric acceleration to generate enough force for an airborne hand clap. Sport Application: Football — builds the punch power needed to create instant separation from a defensive lineman at the snap.',
  'Close-Grip Push-Up': 'Muscles Targeted: triceps brachii, anterior deltoid, and pectoralis major sternal head. Movement Benefit: shifts emphasis from the chest to the triceps by narrowing hand placement, building elbow extension strength for pushing movements. Sport Application: Tennis — develops the arm extension power needed to drive through a topspin forehand follow-through.',
  'Cobra Stretch': 'Muscles Targeted: rectus abdominis, hip flexors, and anterior intercostals. Movement Benefit: decompresses lumbar discs and stretches the anterior chain to counteract the flexion-dominant posture of sitting and exercise. Sport Application: Swimming — opens the anterior chain for the arched body position required in butterfly stroke kick.',
  'Cobra to Upward Dog': 'Muscles Targeted: rectus abdominis, hip flexors, and pectoralis major. Movement Benefit: dynamically stretches the entire anterior chain from the hip flexors through the chest while actively extending the spine. Sport Application: Yoga — builds the spinal extension awareness and anterior flexibility needed for a deep upward-facing dog pose.',
  'Copenhagen Plank': 'Muscles Targeted: adductors, obliques, and gluteus medius. Movement Benefit: develops lateral core and inner thigh strength simultaneously in a demanding side-plank variation that addresses a frequently weak hip complex. Sport Application: Hockey — builds the adductor and lateral core strength needed to push off hard on wide skating strides.',
  'Copenhagen Plank Full': 'Muscles Targeted: adductors, internal oblique, and hip abductors. Movement Benefit: trains the full adductor chain and lateral core under maximum load by using the elevated foot position without knee support. Sport Application: Soccer — develops the groin strength to prevent adductor strains during explosive kicking and change-of-direction.',
  'Copenhagen Plank Knee Down': 'Muscles Targeted: adductors and obliques. Movement Benefit: introduces the Copenhagen plank pattern with a modified base for developing adductor and lateral core strength with reduced loading. Sport Application: Running — builds groin stability to resist the lateral forces on the hip during a hard outside-lane corner.',
  'Copenhagen Plank Knees Down': 'Muscles Targeted: adductors, internal oblique, and hip external rotators. Movement Benefit: builds adductor and lateral trunk strength in a scaled position to progress toward the full Copenhagen plank. Sport Application: Soccer — develops groin strength to reduce adductor strain risk during rapid kicking motions.',
  'Cossack Squat': 'Muscles Targeted: adductors, quadriceps, and hip external rotators. Movement Benefit: develops lateral lunge mechanics and adductor flexibility in a deep one-sided squat position that improves hip range of motion. Sport Application: Martial arts — builds the groin mobility and hip strength needed to drop into a low takedown entry.',
  'Cross-Body Bicep Stretch': 'Muscles Targeted: biceps brachii and brachialis. Movement Benefit: lengthens the elbow flexors and anterior shoulder capsule to restore full elbow extension and shoulder mobility. Sport Application: Gymnastics — improves the elbow lockout needed for pressing into a handstand after repeated bent-arm swings.',
  'Cross-Body Shoulder Stretch': 'Muscles Targeted: posterior deltoid, teres minor, and rhomboids. Movement Benefit: stretches the posterior shoulder capsule to restore horizontal adduction range of motion and reduce impingement risk. Sport Application: Baseball — maintains posterior shoulder mobility for pitchers who develop capsular tightness from throwing.',
  'Culmination Flow': 'Muscles Targeted: pectoralis major, latissimus dorsi, erector spinae, and quadriceps. Movement Benefit: integrates multiple movement patterns in a flowing sequence to build full-body coordination and neuromuscular efficiency. Sport Application: CrossFit — develops the movement-to-movement transition quality needed to perform well in a complex workout.',
  'Culmination Gauntlet': 'Muscles Targeted: deltoids, pectorals, abdominals, glutes, and quadriceps. Movement Benefit: tests and develops total-body strength endurance by chaining demanding exercises with minimal rest. Sport Application: Military fitness — builds the sustained full-body capacity required to complete a physically demanding obstacle course.',
  'Culmination Triset': 'Muscles Targeted: multiple joint complexes across push, pull, and hip patterns. Movement Benefit: develops muscular endurance and metabolic conditioning by pairing three complementary exercises without rest between sets. Sport Application: CrossFit — builds the work capacity needed to cycle through a complex triplet under fatigue.',
  'Dead Bug Arms Only': 'Muscles Targeted: serratus anterior, transverse abdominis, and rectus abdominis. Movement Benefit: teaches arm movement dissociation from the spine in the dead bug position, building shoulder stability while protecting lumbar position. Sport Application: Swimming — develops the arm independence needed to reach overhead without letting the lower back arch.',
  'Dead Bug Full': 'Muscles Targeted: transverse abdominis, rectus abdominis, hip flexors, and contralateral erector spinae. Movement Benefit: builds anti-extension core stability through opposite arm-leg lowering that demands precise spinal position maintenance. Sport Application: Baseball — develops the trunk stiffness that links lower body rotation with upper body power during a swing.',
  'Dead Bug Legs Only': 'Muscles Targeted: transverse abdominis, hip flexors, and rectus abdominis. Movement Benefit: isolates lower body dissociation from the spine to build anti-extension strength and deep core activation patterns. Sport Application: Soccer — builds the core control that allows powerful leg movements without compromising spine position.',
  'Dead Bug with Band Reach': 'Muscles Targeted: transverse abdominis, serratus anterior, and obliques. Movement Benefit: adds a band-resisted arm reach to the dead bug to challenge anti-rotation and anti-extension simultaneously. Sport Application: Tennis — develops the connected trunk stability that transfers shoulder force to the legs during a serve.',
  'Dead Bug with Band Tan': 'Muscles Targeted: transverse abdominis, rectus abdominis, and serratus anterior. Movement Benefit: adds light band resistance to the dead bug reach to increase serratus activation and challenge core anti-extension under load. Sport Application: Swimming — builds the shoulder-to-trunk connection for overhead catching that links arm entry to core tension.',

  'Diamond Push-Up': 'Muscles Targeted: triceps brachii, pectoralis major sternal head, and anterior deltoid. Movement Benefit: maximally loads the triceps in a push-up by placing the hands in a diamond position to emphasize elbow extension over chest pressing. Sport Application: Football — builds the tricep strength used to fully extend the arms when throwing a spiral.',
  'Diaphragmatic Breathing': 'Muscles Targeted: diaphragm, transverse abdominis, and pelvic floor. Movement Benefit: restores proper breathing mechanics to reinforce intra-abdominal pressure regulation and spinal stability from the inside out. Sport Application: Powerlifting — teaches the Valsalva brace that protects the spine during a maximal deadlift or squat.',
  'Doorway Chest Opener': 'Muscles Targeted: pectoralis major, pectoralis minor, and anterior deltoid. Movement Benefit: provides a deep passive stretch to the anterior chest and shoulder to restore posture and thoracic extension capacity. Sport Application: Tennis — opens the chest before a match to maximize arm-swing range during serve.',
  'Doorway Chest Stretch': 'Muscles Targeted: pectoralis major and anterior deltoid. Movement Benefit: lengthens the anterior shoulder and chest tissue to counteract forward shoulder rounding from extended bench pressing. Sport Application: Swimming — restores the shoulder external rotation needed for a high-elbow catch position in freestyle.',
  'Dragon Flag Negative': 'Muscles Targeted: rectus abdominis, hip flexors, and erector spinae. Movement Benefit: builds extreme anti-extension core and hip flexor strength through a full-body eccentric lowering pattern from a shoulder-supported position. Sport Application: Gymnastics — develops the body stiffness and hip flexor strength for a full L-sit to press handstand.',

  'Explosive Elevated Pike Push-Up': 'Muscles Targeted: anterior deltoid, triceps brachii, and upper trapezius. Movement Benefit: develops overhead pressing power by elevating the feet to increase the shoulder loading angle and add a plyometric demand. Sport Application: Gymnastics — builds the explosive pressing power needed to pop from a piked position into a handstand.',
  'Explosive Pike Push-Up': 'Muscles Targeted: anterior deltoid, triceps brachii, and serratus anterior. Movement Benefit: trains explosive vertical pressing power through a pike position to build functional overhead strength with a plyometric demand. Sport Application: Gymnastics — develops the shoulder power needed for a kipping handstand push-up in a gymnastic routine.',
  'Explosive Push-Up': 'Muscles Targeted: pectoralis major, triceps brachii, and anterior deltoid. Movement Benefit: maximizes concentric rate of force development in the horizontal press by driving the chest off the floor explosively. Sport Application: Boxing — develops the explosive chest and arm power that drives a short-range uppercut.',
