function checkAndNotifyNewBadges() {
  const todayStr = localDateStr(new Date());
  const existing = S.badges[S.user] || {};
  const total = S.loggedDates.size;
  const maxStreak = calcMaxStreak(S.user, S.loggedDates);
  const sessionPrs = Object.keys(S.prs).length;

  // Estimate historical PR count from already-earned badges
  let prCount = 0;
  if (existing.prs_50) prCount = 50;
  else if (existing.prs_25) prCount = 25;
  else if (existing.prs_10) prCount = 10;
  else if (existing.prs_5)  prCount = 5;
  else if (existing.first_pr) prCount = 1;
  prCount = Math.max(prCount, sessionPrs);

  const xp    = S.xp[S.user] || 0;
  const level = levelFromXP(xp);
  const now   = new Date();
  const curMD = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const timeStr = now.toTimeString().slice(0,5);
  const [tH, tM] = timeStr.split(':').map(Number);
  const todayMinutes = tH * 60 + tM;
  const durMinutes = S.workoutDuration ? S.workoutDuration / 60 : null;

  // Check if current month is now a perfect month (all scheduled days logged up through today)
  let currentMonthPerfect = false;
  {
    const year = now.getFullYear(), month = now.getMonth();
    const totalDays = new Date(year, month + 1, 0).getDate();
    let ok = true; let hasSched = false;
    // Check every scheduled day this month that has already passed (or is today)
    // AND verify no scheduled days remain unlogged before today
    for (let d = 1; d <= totalDays; d++) {
      const date = new Date(year, month, d);
      const dStr = localDateStr(date);
      if (dStr > todayStr) break;
      if (PLAN_SHEETS[S.user][dateDay(date)] !== null) {
        hasSched = true;
        if (!S.loggedDates.has(dStr)) { ok = false; break; }
      }
    }
    // Only award if today IS the last scheduled day of this month (month complete)
    let lastSchedDay = null;
    for (let d = totalDays; d >= 1; d--) {
      const date = new Date(year, month, d);
      if (PLAN_SHEETS[S.user][dateDay(date)] !== null) { lastSchedDay = localDateStr(date); break; }
    }
    currentMonthPerfect = ok && hasSched && lastSchedDay === todayStr;
  }

  const checks = [
    // Workout milestones
    { id: 'first_workout',  earned: total >= 1 },
    { id: 'workouts_10',    earned: total >= 10 },
    { id: 'workouts_25',    earned: total >= 25 },
    { id: 'workouts_50',    earned: total >= 50 },
    { id: 'workouts_100',   earned: total >= 100 },
    { id: 'workouts_200',   earned: total >= 200 },
    { id: 'workouts_365',   earned: total >= 365 },
    // Streaks
    { id: 'streak_7',       earned: maxStreak >= 7 },
    { id: 'streak_14',      earned: maxStreak >= 14 },
    { id: 'streak_30',      earned: maxStreak >= 30 },
    { id: 'streak_60',      earned: maxStreak >= 60 },
    { id: 'streak_100',     earned: maxStreak >= 100 },
    { id: 'streak_200',     earned: maxStreak >= 200 },
    { id: 'streak_365',     earned: maxStreak >= 365 },
    // PRs
    { id: 'first_pr',       earned: prCount >= 1 },
    { id: 'prs_5',          earned: prCount >= 5 },
    { id: 'prs_10',         earned: prCount >= 10 },
    { id: 'prs_25',         earned: prCount >= 25 },
    { id: 'prs_50',         earned: prCount >= 50 },
    // Levels
    { id: 'level_10',       earned: level >= 10 },
    { id: 'level_25',       earned: level >= 25 },
    { id: 'level_50',       earned: level >= 50 },
    { id: 'level_75',       earned: level >= 75 },
    { id: 'level_100',      earned: level >= 100 },
    // Special — immediate triggers
    { id: 'workout_under_20', earned: durMinutes !== null && durMinutes < 20 },
    { id: 'early_bird',       earned: todayMinutes < 420 },
    { id: 'holiday_hero',     earned: isUSHoliday(todayStr) },
    { id: 'birthday_gains',   earned: !!getBirthday(S.user) && curMD === getBirthday(S.user) },
    // Consistency — perfect month (only if today completes it)
    { id: 'perfect_month',    earned: currentMonthPerfect },
    // January challenge
    { id: 'january_12',       earned: now.getMonth() === 0 && [...S.loggedDates].filter(d => d.startsWith(String(now.getFullYear()) + '-01')).length >= 12 },
  ];

  const newBadgeDefs = [];
  for (const c of checks) {
    if (c.earned && !existing[c.id]) {
      const def = BADGE_DEFS.find(b => b.id === c.id);
      if (def) {
        if (!S.badges[S.user]) S.badges[S.user] = {};
        S.badges[S.user][c.id] = todayStr;
        newBadgeDefs.push(def);
      }
    }
  }
  if (newBadgeDefs.length) setTimeout(() => showBadgeNotification(newBadgeDefs), 800);
}

function renderNavBar() {
  const tabs = [
    {id:'calendar', label:'Calendar'},
    {id:'progress', label:'Progress'},
    {id:'workout',  label:'Workout'},
    {id:'records',  label:'Records'},
    {id:'messages', label:'Messages'},
  ];
  const unread = getUnreadCount();
  return `<nav class="nav-bar">${tabs.map(t => {
    const hasUnread = t.id === 'messages' && unread > 0;
    const badge = hasUnread ? `<span class="nav-badge">${unread > 9 ? '9+' : unread}</span>` : '';
    const icon = hasUnread ? `<span class="nav-heart-beat">${navIcon(t.id)}</span>` : navIcon(t.id);
    return `<button class="nav-item${S.navTab===t.id?' active':''}" onclick="navTo('${t.id}')"><span style="position:relative;display:inline-flex">${icon}${badge}</span><span class="nav-label">${t.label}</span></button>`;
  }).join('')}</nav>`;
}

function navTo(tab) {
  if (tab === 'messages') {
    // Always fetch fresh from the sheet — never use a cached copy
    S.messagesLoaded = false;
    S.messagesLoading = false;
  }
  S.navTab = tab;
  render();
}

}

function copyGasCode() {
  navigator.clipboard.writeText(GAS_CODE).catch(() => {});
  const btn = document.querySelector('.setup pre + button');
  if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 2000); }
}

function saveGasUrl() {
  const v = document.getElementById('gasurl').value.trim();
  if (!v || !v.startsWith('https://')) { S.error = 'Please enter a valid web app URL.'; render(); return; }
  S.gasUrl = v;
  localStorage.setItem('gasUrl', v);
  S.error = '';
  _exitSplash(() => goUserSelect());
}


function trySkip() {
  if (!S.gasUrl) { S.error = 'No URL saved yet. Complete the steps above.'; render(); return; }
  _exitSplash(() => goUserSelect());
}

function _exitSplash(cb) {
  const setup = document.querySelector('.setup');
  if (setup) {
    setup.classList.remove('splash-enter');
    setup.classList.add('splash-exit');
    setTimeout(cb, 260);
  } else { cb(); }
}

function checkBlockChange(user) {
  var today = localDateStr(new Date());
  var bi = getConjugateBlock(today);
  if (!bi) return;
  var phaseKey = 'lastBlock_' + user;
  var cycleKey = 'lastCycle_' + user;
  var lastPhase = localStorage.getItem(phaseKey);
  var lastCycle = localStorage.getItem(cycleKey);
  if (lastCycle && lastCycle !== String(bi.cycle)) {
    setTimeout(function() { showCycleCompleteNotif(bi); }, 800);
  } else if (lastPhase && lastPhase !== String(bi.num)) {
    setTimeout(function() { showNewBlockNotif(bi); }, 800);
  }
  localStorage.setItem(phaseKey, String(bi.num));
  localStorage.setItem(cycleKey, String(bi.cycle));
}

function showNewBlockNotif(bi) {
  var el = document.createElement('div');
  el.className = 'new-block-toast';
  el.style.background = bi.color;
  el.textContent = String.fromCodePoint(0x1F389) + ' New Phase Unlocked! Phase ' + bi.num + ': ' + bi.name;
  document.body.appendChild(el);
  setTimeout(function() {
    el.style.animation = 'fadeOut .3s ease forwards';
    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
  }, 5000);
}

function showCycleCompleteNotif(bi) {
  var el = document.createElement('div');
  el.className = 'new-block-toast';
  el.style.background = 'linear-gradient(135deg, #d4af37, #f97316)';
  el.textContent = String.fromCodePoint(0x1F3C6) + ' Cycle Complete! Starting Cycle ' + bi.cycle;
  document.body.appendChild(el);
  setTimeout(function() {
    el.style.animation = 'fadeOut .3s ease forwards';
    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
  }, 6000);
}

function renderWeekBody() {
  const dates = getWeekDates(S.weekOffset);
  const todayStr = localDateStr(new Date());
  const first = dates[0], last = dates[6];
  const weekLabel = first.getMonth() === last.getMonth()
    ? `${MONTHS[first.getMonth()]} ${first.getDate()}–${last.getDate()}, ${first.getFullYear()}`
    : `${MONTHS[first.getMonth()]} ${first.getDate()} – ${MONTHS[last.getMonth()]} ${last.getDate()}, ${first.getFullYear()}`;

  const TYPE_COLOR = { CORE: '#3fb950', ARMS: '#58a6ff', REST: '#d29922', BANDS: '#a371f7' };
  let rowsHTML = '';
  dates.forEach(date => {
    const dName = dateDay(date);
    const meta = PLAN_SHEETS[S.user][dName];
    const type = meta ? meta.type : 'REST';
    let workoutName = meta ? meta.name : 'Rest Day';
    const dBlockInfo = meta ? getConjugateBlock(localDateStr(date)) : null;
    const dUsesRotation = !(dBlockInfo && (dBlockInfo.num === 4 || dBlockInfo.num === 5));
    if (meta && S.user === 'husband' && dUsesRotation && HUSBAND_VARIANT_DAYS[meta.type]) {
      const vIdx = getHusbandVariantIndex(localDateStr(date));
      workoutName = `${meta.name} ${HUSBAND_VARIANT_LETTERS[vIdx]}`;
    }
    const color = TYPE_COLOR[type] || '#8b949e';
    const dStr = localDateStr(date);
    const isToday = dStr === todayStr;
    const isPast  = date < new Date() && !isToday;
    const rowClass = isToday ? ' is-today' : isPast ? ' is-past' : '';
    const dur = meta ? (S.weekDurations[dStr] || '') : '';
    rowsHTML += `
    <div class="week-day-row${rowClass}" onclick="selectDay(${date.getTime()})">
      <div class="week-day-info">
        <div class="week-day-name">${DAYS_SHORT[date.getDay()]} ${fmtDate(date)}</div>
        <div class="week-day-subname">${workoutName}</div>
      </div>
      <div class="week-day-right">
        ${isToday ? '<span class="today-pill">Today</span>' : ''}
        ${dur ? `<span class="week-dur">${dur}</span>` : ''}
        <span class="badge" style="border-color:${color}55;color:${color}">${type}</span>
        ${meta ? '<span class="week-arrow">›</span>' : ''}
      </div>
    </div>`;
  });
  var _wkBanner = blockBannerHTML(localDateStr(first));
  return `
  <div class="week-nav">
    <button class="week-nav-btn" onclick="S.weekOffset--;render()">‹</button>
    <button class="week-nav-link" onclick="navTo('calendar')" title="Open monthly calendar">${weekLabel} &nbsp;📅</button>
    <button class="week-nav-btn" onclick="S.weekOffset++;render()">›</button>
  </div>
  ${_wkBanner}
  ${rowsHTML}`;
}

// ---- MONTH CALENDAR ----
function renderCalendarBody() {
  if (S.calendarYear === null) {
    const now = new Date();
    S.calendarYear = now.getFullYear();
    S.calendarMonth = now.getMonth();
  }
  const year = S.calendarYear, month = S.calendarMonth;
  const todayStr = localDateStr(new Date());
  const monthLabel = `${MONTHS[month]} ${year}`;

  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // Mon-first
  const totalDays = new Date(year, month + 1, 0).getDate();
  const prevTotal = new Date(year, month, 0).getDate();

  const cells = [];
  for (let i = firstDow - 1; i >= 0; i--)
    cells.push({ day: prevTotal - i, cur: false });
  for (let d = 1; d <= totalDays; d++) {
    const date = new Date(year, month, d);
    const dStr = localDateStr(date);
    const dName = dateDay(date);
    const scheduled = PLAN_SHEETS[S.user][dName] !== null;
    cells.push({ day: d, cur: true, dStr, isToday: dStr === todayStr,
                 logged: S.loggedDates.has(dStr), scheduled });
  }
  const tail = (7 - cells.length % 7) % 7;
  for (let d = 1; d <= tail; d++)
    cells.push({ day: d, cur: false });

  // Group into week rows; detect gold weeks (all scheduled days logged)
  const weeksHTML = [];
  const AVG_DAY_ABBR = ['Mo','Tu','We','Th','Fr','Sa','Su'];
  const AVG_TARGET_MIN = 45;
  for (let i = 0; i < cells.length; i += 7) {
    const wk = cells.slice(i, i + 7);
    const scheduledDays = wk.filter(c => c.cur && c.scheduled);
    const isGold = scheduledDays.length > 0 && scheduledDays.every(c => c.logged);
    const wkCells = wk.map(c => {
      if (!c.cur) return `<div class="cal-day other-month"><span class="cal-day-num">${c.day}</span></div>`;
      const cls = `cal-day${c.isToday ? ' is-today' : ''}${c.logged ? ' logged' : ''}`;
      return `<div class="${cls}">
        <span class="cal-day-num">${c.day}</span>
        ${c.logged ? '<span class="cal-check">✓</span>' : ''}
      </div>`;
    }).join('');

    // Weekly avg duration bar — spans full Mon–Sun regardless of month boundary
    const wkMonday = new Date(year, month, 1 - firstDow + i);
    const durEntries = Array.from({length: 7}, (_, d) => {
      const day = new Date(wkMonday); day.setDate(wkMonday.getDate() + d);
      const dStr = localDateStr(day);
      const dur = S.weekDurations[dStr];
      if (!dur) return null;
      const min = parseDurMinutes(dur);
      return (min && min > 0) ? { dStr, dur, min, label: AVG_DAY_ABBR[d] } : null;
    }).filter(Boolean);

    let avgBarHTML = '';
    if (durEntries.length > 0) {
      const avgMin = Math.round(durEntries.reduce((s, e) => s + e.min, 0) / durEntries.length);
      const blk = getConjugateBlock(durEntries[0].dStr);
      const barColor = blk ? blk.color : 'var(--accent)';
      const pct = Math.min(avgMin / AVG_TARGET_MIN * 100, 115).toFixed(1);
      const breakdown = durEntries.map(e => `${e.label} ${e.dur}`).join(' · ');
      const tipText = `${breakdown} · Avg ${avgMin} min`;
      const tipId = `cavg${i}`;
      avgBarHTML = `<div class="cal-avg-wrap" onclick="calAvgToggle('${tipId}')" title="${tipText}">
        <div class="cal-avg-row">
          <div class="cal-avg-track"><div class="cal-avg-fill" style="width:${pct}%;background:${barColor}"></div></div>
          <span class="cal-avg-label" style="color:${barColor}">Avg ${avgMin} min</span>
        </div>
        <div class="cal-avg-tip" id="${tipId}">${tipText}</div>
      </div>`;
    }

    weeksHTML.push(`<div class="cal-week${isGold ? ' gold' : ''}">${wkCells}</div>${avgBarHTML}`);
  }

  const DOW = ['Mo','Tu','We','Th','Fr','Sa','Su'];
  var _wkBanner = blockBannerHTML(todayStr);
  return `
  <div class="week-nav">
    <button class="week-nav-btn" onclick="prevMonth()">‹</button>
    <div class="week-nav-title">${monthLabel}</div>
    <button class="week-nav-btn" onclick="nextMonth()">›</button>
  </div>
  <div class="cal-dow-row">${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}</div>
  <div class="cal-grid">${weeksHTML.join('')}</div>`;
}

function prevMonth() {
  if (S.calendarMonth === 0) { S.calendarMonth = 11; S.calendarYear--; }
  else S.calendarMonth--;
  render();
}
function nextMonth() {
  if (S.calendarMonth === 11) { S.calendarMonth = 0; S.calendarYear++; }
  else S.calendarMonth++;
  render();
}

async function selectDay(timestamp) {
  const date = new Date(timestamp);
  S.selectedDate = date;
  S.day = dateDay(date);
  S.workout = null;
  S.logs = {};
  S.prs = {};
  S.modal = null;
  S.error = '';
  S.workoutStartTime = null;
  S.workoutDuration = 0;
  S.workoutSubmitted = false;
  S.workoutEditing = false;
  // Immediately restore submitted flag before ANY async work or renders so the
  // workout screen never flashes as unsubmitted. Both the tiny flag and the full
  // progress blob are checked so either storage path is sufficient.
  try {
    const _sub = localStorage.getItem('wod_sub_' + S.user + '_' + localDateStr(date));
    if (_sub === '1') { S.workoutSubmitted = true; }
    else {
      const _raw = localStorage.getItem('wod_progress_' + S.user + '_' + localDateStr(date));
      if (_raw && JSON.parse(_raw).submitted) S.workoutSubmitted = true;
    }
  } catch(e) {}
  S.screen = 'loading';
  render();
  setWLProgress(5);
  try {
    S.workout = await fetchPlan(S.user, S.day);
    if (!S.workout) {
      S.workout = { name: 'Rest & Recovery', type: 'REST', duration: '—', exercises: [] };
    }
    setWLProgress(60);
    await loadHistory();
    setWLProgress(90);
    S.progression = calcProgression(S.workout.exercises, S.history);
    setWLProgress(100);
    S.screen = 'workout';
    S._wlSlideIn = true;
    loadProgress();
    if (!S.recordsLoaded && !S.recordsLoading) loadRecordsData();
    stopWLPhrases();
    const wlEl = document.getElementById('wl-screen');
    if (wlEl) {
      wlEl.classList.add('wl-exit');
      setTimeout(() => render(), 350);
    } else {
      render();
    }
  } catch(e) {
    stopWLPhrases();
    S.error = e.message;
    S.screen = 'week';
    render();
  }
}

// ---- WORKOUT ----
function renderWorkout() {
  const w = S.workout;
  if (!w) return;

  // Defensive last-resort check: if in-memory flag says not submitted, re-read
  // both the dedicated tiny flag and the full progress blob from localStorage.
  // Guards against any async re-render that fires before loadProgress() completes
  // or any other state loss between save and render.
  if (!S.workoutSubmitted && !S.workoutEditing && S.selectedDate && S.user) {
    try {
      const _dateStr = localDateStr(S.selectedDate);
      const _subFlag = localStorage.getItem('wod_sub_' + S.user + '_' + _dateStr) === '1';
      let _blobData = null;
      try { const _r = localStorage.getItem(progressKey()); if (_r) _blobData = JSON.parse(_r); } catch(e) {}
      if (_subFlag || (_blobData && _blobData.submitted)) {
        S.workoutSubmitted = true;
        if (_blobData) {
          if (_blobData.logs) { S.logs = {}; Object.entries(_blobData.logs).forEach(([k,v]) => { S.logs[parseInt(k)] = v; }); }
          if (_blobData.progression) S.progression = _blobData.progression;
          if (_blobData.prs) S.prs = _blobData.prs;
        }
      }
    } catch(e) {}
  }

  if (w.type === 'REST') {
    const dateLabel = S.selectedDate ? `${S.day}, ${fmtDate(S.selectedDate)}` : S.day;
    app.innerHTML = `
    <div class="header"><div class="header-title">${dateLabel}</div><div class="header-right">${themeBtn()}<button class="header-user" onclick="S.screen='week';render()">← Week</button></div></div>
    <div class="rest-day">
      <div class="icon">😴</div>
      <h2>${w.name}</h2>
      <p>${dateLabel} is a rest day. Recovery is part of the program — enjoy it.</p>
      <button class="btn btn-secondary" style="max-width:280px;margin-top:16px" onclick="S.screen='week';render()">← Back to week</button>
    </div>`;
    return;
  }

  const total = w.exercises.length;
  const done = Object.values(S.logs).filter(l => l.done).length;
  const isSubmitted = S.workoutSubmitted && !S.workoutEditing;
  const pct = isSubmitted ? 100 : (total ? Math.round(done/total*100) : 0);

  const blocks = {};
  w.exercises.forEach((ex, i) => {
    if (!blocks[ex.block]) blocks[ex.block] = [];
    blocks[ex.block].push({ex, i});
  });

  let blockHTML = '';
  for (const [block, items] of Object.entries(blocks)) {
    const blockColor = {
      'Warm-Up':'#d29922','Block 1':'#58a6ff','Block 2':'#a371f7',
      'Finisher':'#f85149','Cool-Down':'#3fb950'
    }[block] || '#8b949e';
    blockHTML += `<div class="block-section"><div class="block-label" style="color:${blockColor}">${block}</div>`;
    items.forEach(({ex, i}) => {
      const log = S.logs[i];
      const isDone = log?.done;
      const prog = S.progression[ex.name];
      const target = prog?.target || ex.target;
      const progressed = prog?.progressed;
      const pr = S.prs[ex.name];
      blockHTML += `
      <div class="exercise-row${isDone ? ' done' : ''}${pr ? ' pr-row' : ''}" onclick="openModal(${i})">
        <div class="exercise-check${isDone ? ' checked' : ''}">${isDone ? '✓' : ''}</div>
        <div class="exercise-info">
          <div class="exercise-name">${ex.name}</div>
          <div class="exercise-meta">
            <span>${ex.sets}×</span><span>${target}</span>
            ${progressed ? '<span class="prog-badge">↑ PROGRESSED</span>' : ''}
            ${pr ? '<span class="pr-badge">🏆 PR</span>' : ''}
          </div>
        </div>
        <div class="exercise-arrow">›</div>
      </div>`;
    });
    blockHTML += '</div>';
  }

  const dateLabel = S.selectedDate ? `${S.day}, ${fmtDate(S.selectedDate)}` : S.day;
  var _conjStrip = '';
  if (w.blockInfo) {
    var _bi = w.blockInfo;
    _conjStrip = '<div class="conj-strip" style="--bc:' + _bi.color + '">' +
      '<span class="conj-strip-name" style="color:' + _bi.color + '">Phase ' + _bi.num + ': ' + _bi.name + '</span>' +
      '<span class="conj-strip-meta">Wk ' + _bi.weekInBlock + '/3 &nbsp;&middot;&nbsp; ' + effectiveDaysLeft(_bi) + 'd left</span>' +
      '</div>';
  }
  const canSubmit = done > 0;
  const submittedBanner = isSubmitted ? `
    <div style="background:#238636;border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:20px">✅</span>
        <div>
          <div style="font-size:14px;font-weight:700;color:#fff">Workout Submitted</div>
          <div style="font-size:12px;color:rgba(255,255,255,.75)">${badgeDateLabel(localDateStr(S.selectedDate))}</div>
        </div>
      </div>
    </div>` : (S.workoutEditing ? `
    <div style="background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="font-size:16px">✎</span>
      <div style="font-size:13px;font-weight:600;color:var(--accent)">Editing — tap exercises to update values, then re-submit</div>
    </div>` : '');
  const bottomBar = isSubmitted
    ? `<button class="btn btn-secondary" onclick="startEditWorkout()">✎ Edit Workout</button>`
    : `<button class="btn btn-primary" onclick="S.screen='summary';render()" ${!canSubmit ? 'disabled style="opacity:.4"' : ''}>Review & Submit Workout →</button>`;
  app.innerHTML = `
  <div class="header">
    <div class="header-title">${dateLabel}</div>
    <div class="header-right">${themeBtn()}<button class="header-user" onclick="leaveWorkout()">← Week</button></div>
  </div>
  <div class="body screen-enter">
    <div class="day-header">
      <div class="day-label">${dateLabel}</div>
      <div class="day-workout">${w.name}</div>
      <div class="day-meta">
        <span class="badge ${w.type.toLowerCase()}">${w.type}</span>
        <span class="badge">${w.duration}</span>
        <span class="badge">${done}/${total} done</span>
        ${w.source === 'local'
          ? `<span class="badge" style="background:#5a1e1e;color:#ffb4b4" title="${(w.sourceDetail||'').replace(/"/g,'&quot;')}">⚠ Local fallback (Sheet unreachable)</span>`
          : `<span class="badge" style="background:#0d3320;color:#7ee8a4" title="Sheet tab: ${(w.sourceDetail||'').replace(/"/g,'&quot;')}">📗 Live from Sheet</span>`}
      </div>
    </div>
    ${_conjStrip}
    ${submittedBanner}
    <div class="progress-bar-wrap">
      <div class="progress-label">${pct}% complete</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>
    ${blockHTML}
  </div>
  <div class="bottom-bar">${bottomBar}</div>
  ${S.modal !== null ? renderModal() : ''}`;
}

// ---- MODAL ----
function openModal(i) {
  S.modal = i;
  clearInterval(S.timerInterval);
  S.timerRunning = false;
  const _ex = S.workout.exercises[i];
  const _parsed = parseTarget(S.progression[_ex.name]?.target || _ex.target);
  const _allTimers = parseAllTimers(S.progression[_ex.name]?.target || _ex.target);
  if (_parsed.unit === 'sec') {
    S.countdownTarget = _parsed.value;
  } else if (_allTimers.length > 0) {
    S.countdownTarget = _allTimers[0];
  } else {
    S.countdownTarget = null;
  }
  S.timerSec = S.countdownTarget !== null ? S.countdownTarget : 0;
  if (!S.logs[i]) {
    const ex = S.workout.exercises[i];
    const prog = S.progression[ex.name];
    const target = prog?.target || ex.target;
    const parsed = parseTarget(target);
    const prefill = parsed.value != null ? String(parsed.value) : '';
    S.logs[i] = { done: false, setsCompleted: 0, repsPerSet: Array(ex.sets).fill(prefill), notes: '', setsState: Array(ex.sets).fill(false) };
  }
  render();
  const _vp = document.getElementById('modal-slide-viewport');
  if (_vp) {
    _slideVW = _vp.offsetWidth;
    const _track = document.getElementById('modal-slide-track');
    if (_track) { _track.style.transition = 'none'; _track.style.transform = `translateX(${-_slideVW}px)`; }
  }
}

function closeModal() {
  const overlay = document.querySelector('.modal-overlay');
  function _doClose() { S.modal = null; clearInterval(S.timerInterval); S.timerRunning = false; S.countdownTarget = null; S.timerPhase = null; S.timerOrigTarget = null; render(); }
  if (overlay) {
    overlay.classList.remove('sheet-enter');
    overlay.classList.add('sheet-exit');
    setTimeout(_doClose, 230);
  } else { _doClose(); }
}

function ensureLog(i) {
  if (S.logs[i]) return;
  const ex = S.workout.exercises[i];
  const prog = S.progression[ex.name];
  const target = prog?.target || ex.target;
  const parsed = parseTarget(target);
  const prefill = parsed.value != null ? String(parsed.value) : '';
  S.logs[i] = { done: false, setsCompleted: 0, repsPerSet: Array(ex.sets).fill(prefill), notes: '', setsState: Array(ex.sets).fill(false) };
}

function _renderAllPanes() {
  const i = S.modal;
  const total = S.workout.exercises.length;
  ensureLog(i);
  if (i > 0) ensureLog(i - 1);
  if (i < total - 1) ensureLog(i + 1);
  const prev = document.getElementById('pane-prev');
  const curr = document.getElementById('pane-curr');
  const nxt  = document.getElementById('pane-next');
  if (prev) prev.innerHTML = i > 0 ? renderModalInner(i - 1) : '';
  if (curr) curr.innerHTML = renderModalInner(i);
  if (nxt)  nxt.innerHTML  = i < total - 1 ? renderModalInner(i + 1) : '';
}

function _commitNav(next, delta) {
  clearInterval(S.timerInterval);
  S.timerRunning = false;
  S.modal = next;
  const _ex = S.workout.exercises[next];
  const _parsed = parseTarget(S.progression[_ex.name]?.target || _ex.target);
  const _allTimers = parseAllTimers(S.progression[_ex.name]?.target || _ex.target);
  if (_parsed.unit === 'sec') {
    S.countdownTarget = _parsed.value;
  } else if (_allTimers.length > 0) {
    S.countdownTarget = _allTimers[0];
  } else {
    S.countdownTarget = null;
  }
  S.timerSec = S.countdownTarget !== null ? S.countdownTarget : 0;
  _renderAllPanes();
  const track = document.getElementById('modal-slide-track');
  if (track) {
    const vp = document.getElementById('modal-slide-viewport');
    if (vp && vp.offsetWidth > 0) _slideVW = vp.offsetWidth;
    track.style.transition = 'none';
    track.style.transform = `translateX(${-_slideVW}px)`;
  } else {
    render();
  }
}

function navigateModal(delta) {
  const total = S.workout.exercises.length;
  const next = S.modal + delta;
  if (next < 0 || next >= total) return;
  const track = document.getElementById('modal-slide-track');
  const targetX = delta > 0 ? -2 * _slideVW : 0;
  if (track) {
    track.style.transition = 'transform 0.22s ease-out';
    track.style.transform = `translateX(${targetX}px)`;
  }
  clearTimeout(_navTimeout);
  _navTimeout = setTimeout(() => _commitNav(next, delta), 220);
}

function modalTouchStart(e) {
  _touchStartX = e.touches[0].clientX;
  _touchStartY = e.touches[0].clientY;
  _swipeDir = null;
  _swipeActive = false;
  const vp = document.getElementById('modal-slide-viewport');
  if (vp && vp.offsetWidth > 0) _slideVW = vp.offsetWidth;
}

function modalTouchCancel() {
  _swipeActive = false;
  _swipeDir = null;
}

function modalTouchMove(e) {
  if (_swipeDir === 'v') return;
  const dx = e.touches[0].clientX - _touchStartX;
  const dy = e.touches[0].clientY - _touchStartY;
  if (_swipeDir === null) {
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    _swipeDir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    if (_swipeDir === 'h') _swipeActive = true;
  }
  if (_swipeDir !== 'h') return;
  e.preventDefault();
  const track = document.getElementById('modal-slide-track');
  if (!track) return;
  const total = S.workout.exercises.length;
  const atStart = S.modal <= 0 && dx > 0;
  const atEnd   = S.modal >= total - 1 && dx < 0;
  const resist  = (atStart || atEnd) ? 0.2 : 1;
  track.style.transition = 'none';
  track.style.transform = `translateX(${-_slideVW + dx * resist}px)`;
}

function modalTouchEnd(e) {
  if (!_swipeActive) return;
  _swipeActive = false;
  const dx = e.changedTouches[0].clientX - _touchStartX;
  const track = document.getElementById('modal-slide-track');
  const total = S.workout.exercises.length;
  const delta = dx < 0 ? 1 : -1;
  const next = S.modal + delta;
  if (Math.abs(dx) > 52 && next >= 0 && next < total) {
    const targetX = delta > 0 ? -2 * _slideVW : 0;
    if (track) {
      track.style.transition = 'transform 0.22s ease-out';
      track.style.transform = `translateX(${targetX}px)`;
    }
    clearTimeout(_navTimeout);
    _navTimeout = setTimeout(() => _commitNav(next, delta), 220);
  } else {
    if (track) {
      track.style.transition = 'transform 0.3s cubic-bezier(.22,1,.36,1)';
      track.style.transform = `translateX(${-_slideVW}px)`;
    }
  }
}

function renderModalInner(i) {
  const ex = S.workout.exercises[i];
  const log = S.logs[i];
  const prog = S.progression[ex.name];
  const target = prog?.target || ex.target;
  const parsed = parseTarget(target);
  const allTimers = parseAllTimers(target);
  const isTimedByName = /plank|hold/i.test(ex.name);
  const isTimedByTarget = /hold/i.test(ex.target);
  const isTimed = parsed.unit === 'sec' || ((isTimedByName || isTimedByTarget) && parsed.unit === 'max') || allTimers.length > 0;
  const isMax = !isTimed && (parsed.unit === 'max' || parsed.unit === 'complex');

  const muscles = getMuscles(ex.name);
  const diagramHTML = muscles ? `
  <div class="muscle-diagram">
    <div class="muscle-legend">
      <span><span style="color:#f97316;font-size:14px">●</span> Primary</span>
      <span><span style="color:#eab308;font-size:14px">●</span> Secondary</span>
    </div>
    ${bodyDiagramSVG(muscles.primary, muscles.secondary)}
  </div>` : '';

  const _locked = S.workoutSubmitted && !S.workoutEditing;
  const setsHTML = Array.from({length: ex.sets}, (_, s) => {
    const checked = log.setsState?.[s];
    return `
    <div class="set-row">
      <div class="set-label">Set ${s+1}</div>
      <div class="set-input-wrap">
        <input class="set-input" type="number" min="0" value="${log.repsPerSet[s] || ''}" placeholder="${isMax ? '—' : (isTimed ? '0' : '0')}" ${_locked ? 'readonly style="opacity:.7"' : `oninput="setRep(${i},${s},this.value)"`}>
        <span class="set-unit">${isTimed ? 'sec' : isMax ? 'reps' : parsed.unit === 'reps' ? 'reps' : ''}</span>
      </div>
      <button class="set-check${checked ? ' done' : ''}" ${_locked ? 'disabled' : `onclick="toggleSet(${i},${s})"`}>${checked ? '✓' : ''}</button>
    </div>`;
  }).join('');

  const isCurrentPane = i === S.modal;
  const _cdTarget = isCurrentPane ? S.countdownTarget
    : (parsed.unit === 'sec' ? (parsed.value || 0)
      : (allTimers.length > 0 ? allTimers[0] : null));
  const timerSec = isCurrentPane ? S.timerSec : (_cdTarget !== null ? _cdTarget : 0);
  const mm = String(Math.floor(timerSec/60)).padStart(2,'0');
  const ss = String(timerSec%60).padStart(2,'0');
  const timerClass = (isCurrentPane && S.timerRunning) ? 'running'
    : _cdTarget !== null ? (timerSec === 0 ? 'done-time' : '') : (timerSec > 0 ? 'done-time' : '');

  const fmtSec = v => v >= 60 ? `${Math.floor(v/60)}m${v%60 ? v%60+'s' : ''}` : `${v}s`;
  const presetsHTML = allTimers.length > 1 ? `
    <div class="timer-row" style="margin-bottom:4px">
      ${allTimers.map(v => `<button class="timer-btn" onclick="setTimerPreset(${v})"
        style="${_cdTarget===v?'background:var(--accent);color:#000;font-weight:700;':''}">${fmtSec(v)}</button>`).join('')}
    </div>` : '';

  const timerHTML = isTimed ? `
  <div class="timer-section">
    <div class="timer-target">Target: ${target}</div>
    ${presetsHTML}
    <div class="timer-display ${timerClass}">${mm}:${ss}</div>
    <div class="timer-row">
      <button class="timer-btn" onclick="timerToggle()">${S.timerRunning ? '⏸ Pause' : '▶ Start'}</button>
      <button class="timer-btn" onclick="timerReset()">↺ Reset</button>
      ${S.countdownTarget === null ? `<button class="timer-btn" onclick="timerUse(${i})">Use Time</button>` : ''}
    </div>
  </div>` : '';

  const _last = S.workout.exercises.length - 1;
  const _benefitText = EXERCISE_BENEFITS[ex.name] || '';
  let _benefitHTML = '';
  if (_benefitText) {
    const _bParts = [
      { label: 'Muscles Targeted', key: 'Muscles Targeted:' },
      { label: 'Movement Benefit', key: 'Movement Benefit:' },
      { label: 'Sport Application', key: 'Sport Application:' },
    ];
    const _bIdxs = _bParts.map(p => _benefitText.indexOf(p.key));
    const _bSections = _bParts.map((p, i) => {
      if (_bIdxs[i] === -1) return '';
      const start = _bIdxs[i] + p.key.length;
      const end = _bParts.slice(i + 1).map((_, j) => _bIdxs[i + 1 + j]).find(x => x > _bIdxs[i]) ?? _benefitText.length;
      return escapeHtml(_benefitText.slice(start, end).trim());
    });
    const _bId = `bb${i}`;

function setRep(i, s, v) { S.logs[i].repsPerSet[s] = v; saveProgress(); }

function toggleSet(i, s) {
  const newState = !S.logs[i].setsState[s];
  S.logs[i].setsState[s] = newState;
  S.logs[i].setsCompleted = S.logs[i].setsState.filter(Boolean).length;
  saveProgress();
  // Scope to pane-curr — querySelectorAll across all panes hits the wrong pane's button
  const btn = document.querySelectorAll('#pane-curr .set-check')[s];
  if (btn) { btn.classList.toggle('done', newState); btn.textContent = newState ? '✓' : ''; }
}

function checkPR(i) {
  const ex = S.workout.exercises[i];
  const log = S.logs[i];
  if (!log?.done) return;
  if (ex.block !== 'Finisher') return;

  const parsed = parseTarget(ex.target);
  if (parsed.unit === 'interval' || parsed.unit === 'complex') return;

  const values = log.repsPerSet.map(v => parseFloat(v)).filter(v => !isNaN(v) && v > 0);
  if (!values.length) return;
  const sessionBest = Math.max(...values);
  const unit = (parsed.unit === 'sec' || /plank|hold/i.test(ex.name) || /hold/i.test(ex.target)) ? 'sec' : 'reps';

  // Find all-time best from history (excludes current session)
  let prevBest = null;
  S.history.forEach(row => {
    if (String(row[3]) !== ex.name) return;
    const vals = String(row[5] || '').split(',')
      .map(v => parseFloat(v.trim())).filter(v => !isNaN(v) && v > 0);
    if (vals.length) {
      const m = Math.max(...vals);
      if (prevBest === null || m > prevBest) prevBest = m;
    }
  });

  if (prevBest === null || sessionBest > prevBest) {
    S.prs[ex.name] = { value: sessionBest, prevBest, unit };
    return true;
  }
  return false;
}

function markDone(i) {
  if (S.workoutStartTime === null) S.workoutStartTime = Date.now();
  const log = S.logs[i];
  const ex = S.workout.exercises[i];
  log.done = true;
  log.setsCompleted = ex.sets;
  log.reps = log.repsPerSet.filter(r => r !== '').join(', ') || log.repsPerSet[0] || '';
  const gotPR = checkPR(i);
  saveProgress();
  S.modal = null;
  clearInterval(S.timerInterval);
  S.timerRunning = false;
  S.countdownTarget = null;
  render();
  if (gotPR) setTimeout(() => launchConfetti('pr'), 150);
}

function startEditWorkout() {

  S.modal = null;
  render();
}

// ---- PROGRESS PERSISTENCE ----
function progressKey() {
  return 'wod_progress_' + S.user + '_' + localDateStr(S.selectedDate);
}
function saveProgress() {
  if (!S.selectedDate || !S.user) return;
  try {
    // Prune progress entries and submitted flags older than 21 days
    const cutoffDate = new Date(S.selectedDate);
    cutoffDate.setDate(cutoffDate.getDate() - 21);
    const cutoff = localDateStr(cutoffDate);
    const prefix = 'wod_progress_' + S.user + '_';
    const subPrefix = 'wod_sub_' + S.user + '_';
    Object.keys(localStorage).forEach(k => {
      if (k.startsWith(prefix) && k.slice(prefix.length) < cutoff) localStorage.removeItem(k);
      if (k.startsWith(subPrefix) && k.slice(subPrefix.length) < cutoff) localStorage.removeItem(k);
    });
    const data = { logs: S.logs, workoutStartTime: S.workoutStartTime, prs: S.prs, submitted: S.workoutSubmitted };
    if (S.workoutSubmitted) data.progression = S.progression; // snapshot targets at submission time
    localStorage.setItem(progressKey(), JSON.stringify(data));
  } catch(e) {
    console.error('[Together] saveProgress failed — localStorage may be full:', e, 'key:', progressKey());
  }
}
function loadProgress() {
  if (!S.selectedDate || !S.user) return;
  try {
    const key = progressKey();
    const dateStr = localDateStr(S.selectedDate);
    const raw = localStorage.getItem(key);
    if (!raw) {
      // No full blob — still check the dedicated submitted flag
      const _sub = localStorage.getItem('wod_sub_' + S.user + '_' + dateStr);
      if (_sub === '1') { S.workoutSubmitted = true; console.log('[Together] loadProgress: submitted flag found, no blob for', key); }
      else { console.log('[Together] loadProgress: no saved data for', key); }
      return;
    }
    const data = JSON.parse(raw);
    if (data.logs) {
      S.logs = {};
      Object.entries(data.logs).forEach(([k, v]) => { S.logs[parseInt(k)] = v; });
    }
    if (data.workoutStartTime) S.workoutStartTime = data.workoutStartTime;
    if (data.prs) S.prs = data.prs;
    // Accept submitted=true from either the blob OR the dedicated tiny flag
    const _subFlag = localStorage.getItem('wod_sub_' + S.user + '_' + dateStr) === '1';
    if (data.submitted || _subFlag) {
      S.workoutSubmitted = true;
      // Restore the progression snapshot so we show the targets that were active
      // at submission time, not next-session's targets (which calcProgression
      // would produce now that today's workout is in history).
      if (data.progression) S.progression = data.progression;
      console.log('[Together] loadProgress: restored submitted state for', key, '(blob:', data.submitted, 'flag:', _subFlag, ')');
    }
    S.workoutEditing = false; // never persist editing state across page reloads
  } catch(e) { console.error('[Together] loadProgress failed:', e); }
}
function clearProgress() {
  if (!S.selectedDate || !S.user) return;
  try { localStorage.removeItem(progressKey()); } catch(e) {}
  try { localStorage.removeItem('wod_sub_' + S.user + '_' + localDateStr(S.selectedDate)); } catch(e) {}
}

// ---- TIMER ----
// AudioContext is created on the user's Start tap (a real gesture) so iOS Safari
// allows it. We keep one instance alive and reuse it for every alarm.
let _audioCtx = null;
let _audioKeepAlive = null;
let _userCardAnim = false; // true only on the first render after navigating to the user screen
let _silenceSource = null;   // looping silent buffer — holds iOS from suspending AudioContext
let _msgPollInterval = null;
let _introSkipped = false;
let _touchStartX = 0;
let _touchStartY = 0;
let _swipeDir = null;
let _swipeActive = false;
let _slideVW = 0;
let _navTimeout = null;
let _fsTimerActive = false;

function startMessagePolling(user) {
  stopMessagePolling();
  _msgPollInterval = setInterval(() => {
    if (S.user === user && S.screen !== 'setup' && S.screen !== 'user') {
      checkUnreadMessages(user);
    }
  }, 30000);
}

function stopMessagePolling() {
  if (_msgPollInterval) { clearInterval(_msgPollInterval); _msgPollInterval = null; }
}

function ensureAudioCtx() {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
  } catch(e) {}
  return _audioCtx;
}

// Keeps iOS from suspending AudioContext during a timer:
// 1. A continuously looping silent buffer (primary — holds the graph active with no gaps)
// 2. A periodic inaudible oscillator every 20s (belt-and-suspenders)
function startAudioKeepAlive() {
  stopAudioKeepAlive();
  if (_audioCtx) {
    try {
      const buf = _audioCtx.createBuffer(1, 512, _audioCtx.sampleRate);
      _silenceSource = _audioCtx.createBufferSource();
      _silenceSource.buffer = buf;
      _silenceSource.loop = true;
      _silenceSource.connect(_audioCtx.destination);
      _silenceSource.start();
    } catch(e) { _silenceSource = null; }
  }
  _audioKeepAlive = setInterval(() => {
    if (!_audioCtx) return;
    try {
      if (_audioCtx.state === 'suspended') _audioCtx.resume();
      const osc = _audioCtx.createOscillator();
      const gain = _audioCtx.createGain();
      osc.connect(gain);
      gain.connect(_audioCtx.destination);
      gain.gain.setValueAtTime(0.0001, _audioCtx.currentTime);
      osc.start(_audioCtx.currentTime);
      osc.stop(_audioCtx.currentTime + 0.01);
    } catch(e) {}
  }, 20000);
}

function stopAudioKeepAlive() {
  if (_audioKeepAlive) { clearInterval(_audioKeepAlive); _audioKeepAlive = null; }
  if (_silenceSource) {
    try { _silenceSource.stop(); _silenceSource.disconnect(); } catch(e) {}
    _silenceSource = null;
  }
}

function playAlarm() {
  const ctx = _audioCtx;
  if (!ctx) return;

  // Two-tone ding: A5 (880Hz) + E6 (1320Hz) — perfect fifth, clean and pleasant
  const chime = (startTime) => {
    [[880, 0.55], [1320, 0.35]].forEach(([freq, vol]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(vol, startTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.55);
      osc.start(startTime);
      osc.stop(startTime + 0.57);
    });
  };

  // Pattern: Ding Ding — 600ms pause — Ding Ding — done
  const doPlay = () => {
    const t = ctx.currentTime + 0.05;
    chime(t);        // Ding 1
    chime(t + 0.2);  // Ding 2 — 200ms after Ding 1
    chime(t + 0.8);  // Ding 3 — 600ms pause after Ding 2
    chime(t + 1.0);  // Ding 4 — 200ms after Ding 3
  };

  // Resume first in case iOS suspended the context between tap and alarm
  if (ctx.state === 'suspended') ctx.resume().then(doPlay); else doPlay();
  if (navigator.vibrate) navigator.vibrate([100, 200, 100, 600, 100, 200, 100]);
}

function leaveWorkout() {
  clearInterval(S.timerInterval);
  stopAudioKeepAlive();
  S.timerRunning = false;
  S.screen = 'week';
  render();
}

function timerToggle() {
  // All DOM queries scoped to pane-curr so they don't hit adjacent panes in the carousel
  const pane = () => document.getElementById('pane-curr');
  if (S.timerRunning) {
    clearInterval(S.timerInterval);
    S.timerRunning = false;
    const startBtn = pane()?.querySelector('.timer-btn');
    if (startBtn) startBtn.textContent = '▶ Start';
    const d = pane()?.querySelector('.timer-display');
    if (d) d.classList.remove('running');
  } else {
    ensureAudioCtx(); // Must happen on this user gesture so iOS allows audio later
    if (!_silenceSource) startAudioKeepAlive(); // only restart if not already keeping alive
    S.timerRunning = true;
    const startBtn = pane()?.querySelector('.timer-btn');
    if (startBtn) startBtn.textContent = '⏸ Pause';
    // Open fullscreen overlay for countdown timers
    if (S.countdownTarget !== null && !_fsTimerActive) openFullscreenTimer();
    S.timerInterval = setInterval(_timerTick, 1000);
  }
  // No render() — calling render() rebuilds the modal HTML with translateX(0) which snaps to pane-prev
}

function _timerTick() {
  const p = document.getElementById('pane-curr');
  if (S.countdownTarget !== null) {
    S.timerSec--;
    _fsUpdateDisplay();
    const d = p?.querySelector('.timer-display');
    if (d) {
      const rem = Math.max(0, S.timerSec);
      d.textContent = `${String(Math.floor(rem/60)).padStart(2,'0')}:${String(rem%60).padStart(2,'0')}`;
      d.className = 'timer-display running';
    }
    if (S.timerSec <= 0) {
      clearInterval(S.timerInterval);
      S.timerRunning = false;
      S.timerSec = 0;
      const d2 = p?.querySelector('.timer-display');
      if (d2) { d2.textContent = '00:00'; d2.className = 'timer-display done-time'; }
      const btn = p?.querySelector('.timer-btn');
      if (btn) btn.textContent = '▶ Start';
      const ts = p?.querySelector('.timer-section');
      if (ts) { ts.classList.remove('timer-alarm'); void ts.offsetWidth; ts.classList.add('timer-alarm'); }
      playAlarm();
      if (_fsTimerActive) _fsComplete();
      return;
    }
  } else {
    S.timerSec++;
    const d = p?.querySelector('.timer-display');
    if (d) {
      d.textContent = `${String(Math.floor(S.timerSec/60)).padStart(2,'0')}:${String(S.timerSec%60).padStart(2,'0')}`;
      d.className = 'timer-display running';
    }
  }
  const btn = p?.querySelector('.timer-btn');
  if (btn) btn.textContent = '⏸ Pause';
}

function _fsRestartCountdown(sec) {
  clearInterval(S.timerInterval);
  S.timerRunning = true;
  S.countdownTarget = sec;
  S.timerSec = sec;
  const fillEl = document.getElementById('fs-fill');
  if (fillEl) {
    fillEl.style.transition = 'none';
    fillEl.style.height = '0%';
    requestAnimationFrame(() => requestAnimationFrame(() => { if (fillEl) fillEl.style.transition = 'height 1.05s linear'; }));
  }
  _fsUpdateDisplay();
  S.timerInterval = setInterval(_timerTick, 1000);
}

function timerReset() {
  clearInterval(S.timerInterval);
  if (S.timerOrigTarget !== null) { S.countdownTarget = S.timerOrigTarget; S.timerOrigTarget = null; }
  S.timerPhase = null;
  S.timerSec = S.countdownTarget !== null ? S.countdownTarget : 0;
  S.timerRunning = false;
  _renderAllPanes();
}

function setTimerPreset(sec) {
  clearInterval(S.timerInterval);
  S.timerRunning = false;
  S.countdownTarget = sec;
  S.timerSec = sec;
  _renderAllPanes();
}

// ── Fullscreen timer ────────────────────────────────────────────────────────
function openFullscreenTimer() {
  if (_fsTimerActive || S.countdownTarget === null) return;
  _fsTimerActive = true;
  const phaseColor = S.workout?.blockInfo?.color || '#58a6ff';
  const exName = (S.modal !== null) ? (S.workout?.exercises[S.modal]?.name || '') : '';
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

  const el = document.createElement('div');
  el.id = 'fs-timer';
  el.className = 'fs-overlay';
  el.style.setProperty('--fsc', phaseColor);
  el.innerHTML = `
    <div class="fs-base"></div>
    <div class="fs-tint"></div>
    <div class="fs-fill" id="fs-fill"></div>
    <button class="fs-btn fs-cancel-btn" onclick="fsCancelTap()">✕ Cancel</button>
    <button class="fs-btn fs-reset-btn" onclick="fsResetTap()">↺ Reset</button>
    <div class="fs-body">
      <div class="fs-name" id="fs-name">${exName}</div>
      <div class="fs-time" id="fs-time">${fmt(S.timerSec)}</div>
      <div class="fs-switch-label" id="fs-switch-label"></div>
    </div>
    <div class="fs-flash" id="fs-flash"></div>
    <div class="fs-confirm" id="fs-confirm">
      <div class="fs-confirm-msg">Cancel this timer?</div>
      <button class="fs-confirm-btn red" onclick="fsConfirmCancel()">Yes, cancel</button>
      <button class="fs-confirm-btn" onclick="fsDismissConfirm()">Keep going</button>
    </div>`;
  document.body.appendChild(el);
  // Double rAF to ensure the initial opacity:0 is painted before transitioning in
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('fs-in')));
}

function _fsUpdateDisplay() {
  if (!_fsTimerActive) return;
  const rem = Math.max(0, S.timerSec);
  const timeEl = document.getElementById('fs-time');
  if (timeEl) timeEl.textContent = `${String(Math.floor(rem/60)).padStart(2,'0')}:${String(rem%60).padStart(2,'0')}`;
  const fillEl = document.getElementById('fs-fill');
  if (fillEl && S.countdownTarget > 0) {
    fillEl.style.height = ((S.countdownTarget - rem) / S.countdownTarget * 100) + '%';
  }
}

function _fsClose(cb) {
  const el = document.getElementById('fs-timer');
  if (!el) { _fsTimerActive = false; cb && cb(); return; }
  el.classList.remove('fs-in');
  el.classList.add('fs-out');
  setTimeout(() => { el.remove(); _fsTimerActive = false; cb && cb(); }, 320);
}

function fsCancelTap() {
  // Pause timer while confirm is shown
  if (S.timerRunning) {
    clearInterval(S.timerInterval);
    S.timerRunning = false;
    const p = document.getElementById('pane-curr');
    const btn = p?.querySelector('.timer-btn'); if (btn) btn.textContent = '▶ Start';
    const d = p?.querySelector('.timer-display'); if (d) d.classList.remove('running');
  }
  document.getElementById('fs-confirm')?.classList.add('show');
}

function fsDismissConfirm() {
  document.getElementById('fs-confirm')?.classList.remove('show');
}

function fsConfirmCancel() {
  // Restore original target if cancelled mid-per-side sequence
  if (S.timerOrigTarget !== null) { S.countdownTarget = S.timerOrigTarget; S.timerOrigTarget = null; }
  S.timerPhase = null;
  _fsClose();
}

function fsResetTap() {
  clearInterval(S.timerInterval);
  S.timerRunning = false;
  // Restore original target if reset during switch/second-side phase
  if (S.timerOrigTarget !== null) { S.countdownTarget = S.timerOrigTarget; S.timerOrigTarget = null; }
  S.timerPhase = null;
  S.timerSec = S.countdownTarget;
  const lbl = document.getElementById('fs-switch-label');
  if (lbl) lbl.classList.remove('show');
  const fillEl = document.getElementById('fs-fill');
  if (fillEl) {
    fillEl.style.transition = 'none';
    fillEl.style.height = '0%';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (fillEl) fillEl.style.transition = 'height 1.05s linear';
    }));
  }
  _renderAllPanes();
  _fsClose();
}

function _fsComplete() {
  const i = S.modal;
  const ex = (i !== null) ? S.workout?.exercises[i] : null;
  const target = ex ? (S.progression[ex.name]?.target || ex.target) : '';
  const isPerSide = ex ? parseTarget(target).perSide : false;
  const flashEl = document.getElementById('fs-flash');

  if (isPerSide && !S.timerPhase) {
    // First side done → 7-second switch-sides countdown (no user action needed)
    S.timerOrigTarget = S.countdownTarget;
    S.timerPhase = 'switch';
    const lbl = document.getElementById('fs-switch-label');
    if (lbl) { lbl.textContent = 'Switch sides'; lbl.classList.add('show'); }
    if (flashEl) { void flashEl.offsetWidth; flashEl.classList.add('on'); }
    setTimeout(() => _fsRestartCountdown(7), 400);
    return;
  }

  if (S.timerPhase === 'switch') {
    // Switch sides done → auto-start second side
    S.timerPhase = 'second';
    const lbl = document.getElementById('fs-switch-label');
    if (lbl) lbl.classList.remove('show');
    if (flashEl) { void flashEl.offsetWidth; flashEl.classList.add('on'); }
    setTimeout(() => _fsRestartCountdown(S.timerOrigTarget), 400);
    return;
  }

  // Normal completion (non-per-side, or second side just finished)
  S.timerPhase = null;
  S.timerOrigTarget = null;
  if (flashEl) { void flashEl.offsetWidth; flashEl.classList.add('on'); }
  setTimeout(() => {
    if (i !== null && S.logs[i]) {
      const log = S.logs[i];
      const nextSet = log.setsState.findIndex(v => !v);
      if (nextSet !== -1) {
        log.setsState[nextSet] = true;
        log.setsCompleted = log.setsState.filter(Boolean).length;
        saveProgress();
      }
    }
    S.timerSec = S.countdownTarget !== null ? S.countdownTarget : 0;
    _fsClose(() => _renderAllPanes());
  }, 600);
}

function timerUse(i) {
  const log = S.logs[i];
  const ex = S.workout.exercises[i];
  const sec = S.timerSec;
  log.repsPerSet = Array(ex.sets).fill(String(sec));
  saveProgress();
  // Use _renderAllPanes (not render()) so we only refresh the pane contents in
  // place -- a full render() rebuilds modal-slide-track from its HTML template,
  // which resets transform to the prev-pane position and looks like the screen
  // jumped back to the previous exercise.
  _renderAllPanes();
}

function saveBday(user, val) {
  if (!val) { setBirthday(user, ''); return; }
  const m = val.match(/^\d{4}-(\d{2}-\d{2})$/);

}
