<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Together</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--surface3:#30363d;
  --accent:#3fb950;--accent-dim:#1a4226;--accent-glow:#3fb95033;
  --text:#e6edf3;--muted:#8b949e;--red:#f85149;--yellow:#d29922;--blue:#58a6ff;
  --border:#30363d;--r:14px;
}
[data-theme="light"]{
  --bg:#ffffff;--surface:#f6f8fa;--surface2:#eaeef2;--surface3:#d0d7de;
  --accent:#1f883d;--accent-dim:#dafbe1;--accent-glow:#1f883d18;
  --text:#1f2328;--muted:#57606a;--red:#d1242f;--yellow:#9a6700;--blue:#0969da;
  --border:#d0d7de;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ---- HEADER ---- */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.header-title{font-size:17px;font-weight:700;letter-spacing:.3px}
.header-user{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--accent)}
.header-user:hover{background:var(--surface3)}
.theme-toggle{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 10px;font-size:15px;cursor:pointer;line-height:1;transition:background .15s;flex-shrink:0}
.theme-toggle:hover{background:var(--surface3)}
.header-right{display:flex;align-items:center;gap:8px}
.header-user:hover{background:var(--accent-dim)}

/* ---- SCROLL BODY ---- */
.body{flex:1;overflow-y:auto;padding:0 0 120px}

/* ---- BUTTONS ---- */
.btn{display:block;width:100%;padding:15px 20px;border:none;border-radius:var(--r);font-size:16px;font-weight:700;cursor:pointer;text-align:center;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97);opacity:.85}
.btn-primary{background:var(--accent);color:#000}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-ghost{background:transparent;color:var(--muted);font-size:14px;padding:10px}
.btn-sm{padding:8px 16px;font-size:14px;width:auto;display:inline-block;border-radius:8px}

/* ---- SETUP SCREEN ---- */
.setup{padding:32px 24px;display:flex;flex-direction:column;gap:20px}
.setup h1{font-size:26px;font-weight:800;line-height:1.2}
.setup p{color:var(--muted);font-size:15px;line-height:1.6}
.setup-steps{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:12px;align-items:flex-start}
.step-num{background:var(--accent-dim);color:var(--accent);font-weight:700;font-size:12px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-text{font-size:14px;line-height:1.5;color:var(--muted)}
.step-text a{color:var(--blue);text-decoration:none}
.step-text code{background:var(--surface2);padding:1px 6px;border-radius:4px;font-size:13px;color:var(--accent)}
input.field{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--text);font-size:15px;outline:none;transition:border-color .2s}
input.field:focus{border-color:var(--accent)}
input.field::placeholder{color:var(--muted)}

/* ---- AUTH SCREEN ---- */
.auth-screen{padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
.auth-screen h2{font-size:24px;font-weight:800}
.auth-screen p{color:var(--muted);font-size:15px;line-height:1.6;max-width:320px}
.logo{font-size:48px;margin-bottom:8px}
.g-btn{display:flex;align-items:center;gap:12px;background:#fff;color:#1f1f1f;border:none;border-radius:10px;padding:14px 24px;font-size:16px;font-weight:600;cursor:pointer;width:100%;max-width:320px;justify-content:center;transition:box-shadow .2s}
.g-btn:hover{box-shadow:0 2px 12px #ffffff33}
.g-btn svg{width:20px;height:20px;flex-shrink:0}

/* ---- USER SELECT ---- */
.user-select{padding:32px 24px;display:flex;flex-direction:column;gap:16px}
.user-select h2{font-size:22px;font-weight:800;text-align:center;margin-bottom:8px}
.user-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:24px;cursor:pointer;transition:border-color .2s,background .2s;text-align:center}
.user-card:hover,.user-card.active{border-color:var(--accent);background:var(--accent-glow)}
.user-card h3{font-size:20px;font-weight:700;margin-bottom:6px}
.user-card p{font-size:14px;color:var(--muted)}
.user-card .icon{font-size:36px;margin-bottom:12px}

/* ---- WORKOUT OVERVIEW ---- */
.day-header{padding:20px 20px 12px;display:flex;flex-direction:column;gap:4px}
.day-label{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.day-workout{font-size:22px;font-weight:800}
.day-meta{display:flex;gap:10px;margin-top:6px}
.badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.badge.core{border-color:#3fb95044;color:var(--accent)}
.badge.arms{border-color:#58a6ff44;color:var(--blue)}
.badge.rest{border-color:#d2992244;color:var(--yellow)}
.badge.bands{border-color:#a371f744;color:#a371f7}

.progress-bar-wrap{padding:0 20px 16px}
.progress-bar-bg{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}
.progress-label{font-size:12px;color:var(--muted);margin-bottom:6px}

.block-section{margin-bottom:4px}
.block-label{padding:10px 20px 6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.exercise-row{display:flex;align-items:center;padding:14px 20px;border-top:1px solid var(--border);gap:14px;cursor:pointer;transition:background .15s}
.exercise-row:hover{background:var(--surface)}
.exercise-row.done{opacity:.55}
.exercise-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:13px}
.exercise-check.checked{background:var(--accent);border-color:var(--accent);color:#000}
.exercise-info{flex:1;min-width:0}
.exercise-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exercise-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prog-badge{background:var(--accent-dim);color:var(--accent);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px}
.exercise-arrow{color:var(--muted);font-size:16px;flex-shrink:0}

/* ---- REST DAY ---- */
.rest-day{padding:60px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.rest-day .icon{font-size:56px}
.rest-day h2{font-size:24px;font-weight:800}
.rest-day p{color:var(--muted);font-size:15px;max-width:280px;line-height:1.6}

/* ---- BOTTOM BAR ---- */
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:16px 20px;background:var(--bg);border-top:1px solid var(--border)}

/* ---- EXERCISE LOG MODAL ---- */
.modal-overlay{position:fixed;inset:0;background:#000a;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:0 0 40px;max-height:92vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--surface3);border-radius:2px;margin:12px auto 0}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:var(--surface2);border:none;color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px}
.modal-note{background:var(--surface2);border-left:3px solid var(--accent);border-radius:6px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.modal-demo{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--blue);margin-bottom:20px;text-decoration:none}
.modal-demo:hover{opacity:.8}
.sets-section{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.set-row{display:flex;align-items:center;gap:10px}
.set-label{font-size:13px;color:var(--muted);width:44px;flex-shrink:0}
.set-input-wrap{flex:1;display:flex;align-items:center;gap:8px}
.set-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;font-weight:700;width:70px;padding:10px 12px;text-align:center;outline:none;transition:border-color .2s;-moz-appearance:textfield}
.set-input::-webkit-inner-spin-button,.set-input::-webkit-outer-spin-button{-webkit-appearance:none}
.set-input:focus{border-color:var(--accent)}
.set-unit{font-size:13px;color:var(--muted)}
.set-check{width:32px;height:32px;border-radius:8px;border:2px solid var(--border);background:transparent;color:var(--accent);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.set-check.done{background:var(--accent-dim);border-color:var(--accent)}
.target-hint{background:var(--surface2);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:16px}
.target-hint strong{color:var(--text)}
.notes-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;resize:none;outline:none;font-family:inherit;transition:border-color .2s;margin-bottom:16px}
.notes-input:focus{border-color:var(--accent)}
.timer-section{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 0;margin-bottom:16px;background:var(--surface2);border-radius:12px}
.timer-display{font-size:44px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.timer-display.running{color:var(--accent)}
.timer-display.done-time{color:var(--yellow)}
.timer-row{display:flex;gap:10px}
.timer-btn{background:var(--surface3);border:none;color:var(--text);padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.timer-btn:hover{opacity:.8}
.timer-target{font-size:12px;color:var(--muted)}

/* ---- SUMMARY SCREEN ---- */
.summary{padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.summary h2{font-size:22px;font-weight:800}
.summary-stat{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.summary-stat-label{font-size:14px;color:var(--muted)}
.summary-stat-value{font-size:18px;font-weight:700;color:var(--accent)}
.summary-list{display:flex;flex-direction:column;gap:8px}
.summary-ex{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px}
.summary-ex-name{font-size:14px;font-weight:600}
.summary-ex-log{font-size:12px;color:var(--muted);margin-top:4px}
.uploading{display:flex;align-items:center;justify-content:center;gap:10px;padding:20px;color:var(--muted)}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.success-screen{padding:60px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.success-screen .check{font-size:64px}
.success-screen h2{font-size:26px;font-weight:800}
.success-screen p{color:var(--muted);font-size:15px;max-width:300px;line-height:1.6}

/* ---- SWIPE-TO-DELETE ---- */
.swipe-row{position:relative;overflow:hidden;border-radius:12px;margin-bottom:8px}
.swipe-content{position:relative;border-radius:12px;will-change:transform}
.swipe-delete-btn{position:absolute;right:0;top:0;bottom:0;width:72px;background:var(--red);display:flex;align-items:center;justify-content:center;border-radius:0 12px 12px 0;cursor:pointer;flex-shrink:0}
.swipe-delete-btn svg{pointer-events:none}

/* ---- MISC ---- */
.error-msg{background:#f8514922;border:1px solid #f8514966;border-radius:10px;padding:12px 16px;font-size:14px;color:var(--red);margin-top:4px}
.divider{height:1px;background:var(--border);margin:0 20px}
.skip-link{text-align:center;font-size:13px;color:var(--muted);padding:10px}
.skip-link a{color:var(--blue);cursor:pointer;text-decoration:none}

/* ---- WEEK VIEW ---- */
.week-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
.week-nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.week-nav-btn:hover{background:var(--surface3)}
.week-nav-title{font-size:14px;font-weight:700}
.week-day-row{display:flex;align-items:center;padding:14px 20px;border-top:1px solid var(--border);cursor:pointer;transition:background .15s;gap:12px}
.week-day-row:hover{background:var(--surface)}
.week-day-row.is-today{background:var(--accent-glow)}
.week-day-row.is-past{opacity:.6}
.week-day-info{flex:1;min-width:0}
.week-day-name{font-size:15px;font-weight:700}
.week-day-subname{font-size:12px;color:var(--muted);margin-top:1px}
.week-day-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.today-pill{background:var(--accent);color:#000;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px}
.week-arrow{color:var(--muted);font-size:16px}
.week-dur{font-size:12px;font-weight:600;color:var(--muted)}

/* ---- PERSONAL RECORDS ---- */
.pr-badge{background:var(--yellow);color:#000;font-size:10px;font-weight:800;padding:2px 7px;border-radius:4px;letter-spacing:.3px}
.exercise-row.pr-row{border-left:3px solid var(--yellow)}
.pr-card{background:#d2992218;border:1px solid #d2992255;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pr-card-title{font-size:12px;font-weight:700;color:var(--yellow);text-transform:uppercase;letter-spacing:.8px}
.pr-card-row{font-size:14px;color:var(--text);display:flex;justify-content:space-between;align-items:baseline}
.pr-card-row span{font-size:12px;color:var(--muted)}
.summary-ex.has-pr{border-left:3px solid var(--yellow)}

/* ---- STREAK FLAME ---- */
.streak-badge{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px;font-size:13px;font-weight:700}
.streak-count{color:var(--text)}
.flame-wrap{flex-shrink:0;transform-origin:50% 100%;animation:flame-body var(--fd,1s) linear infinite}
.flame-inner{animation:flame-inner-pulse var(--fd,1s) linear infinite}
.flame-core{animation:flame-inner-pulse var(--fd,1s) linear infinite;animation-delay:calc(var(--fd,1s)*-.3)}
@keyframes flame-body{
  0%  {transform:scaleX(1)   scaleY(1)   rotate(-1deg)}
  15% {transform:scaleX(.96) scaleY(1.04)rotate(.8deg)}
  30% {transform:scaleX(1.03)scaleY(.97) rotate(-1.2deg)}
  50% {transform:scaleX(.98) scaleY(1.02)rotate(.5deg)}
  65% {transform:scaleX(1.02)scaleY(.98) rotate(-.8deg)}
  80% {transform:scaleX(.97) scaleY(1.03)rotate(1deg)}
  100%{transform:scaleX(1)   scaleY(1)   rotate(-1deg)}
}
@keyframes flame-inner-pulse{
  0%,100%{opacity:.85}
  40%    {opacity:1}
  70%    {opacity:.6}
}

/* ---- CALENDAR ---- */
.week-nav-link{background:transparent;border:none;color:var(--text);font-size:14px;font-weight:700;cursor:pointer;padding:4px 10px;border-radius:8px;transition:background .15s;display:flex;align-items:center;gap:4px}
.week-nav-link:hover{background:var(--surface2)}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 14px 2px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cal-grid{display:flex;flex-direction:column;gap:3px;padding:0 14px 24px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;border-radius:8px;padding:2px}
.cal-week.gold{background:#d2992218}
.cal-week.gold .cal-day-num{color:var(--yellow)}
.cal-week.gold .cal-check{color:var(--yellow)}
.cal-week.gold .cal-day.is-today{outline-color:var(--yellow)}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;gap:1px}
.cal-day.other-month{opacity:.18}
.cal-day.is-today{background:var(--surface2);outline:1px solid var(--accent)}
.cal-day.logged{background:var(--accent-glow)}
.cal-day-num{font-size:12px;font-weight:600;line-height:1;color:var(--text)}
.cal-day.other-month .cal-day-num{color:var(--muted)}
.cal-check{color:var(--accent);font-size:13px;font-weight:800;line-height:1}

/* ---- MUSCLE HEATMAP ---- */
.muscle-diagram{margin:0 0 16px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px 10px}
.muscle-legend{display:flex;gap:16px;font-size:11px;color:var(--muted);margin-bottom:8px}
.muscle-diagram svg{width:100%;display:block;max-height:150px}

/* ---- QUOTE OF THE DAY ---- */
.quote-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;text-align:center}
.quote-text{font-size:14px;line-height:1.65;color:var(--muted);font-style:italic}
.quote-author{font-size:11px;color:var(--surface3);margin-top:8px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;filter:brightness(1.8)}

/* ---- NAV BAR ---- */
.nav-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 8px;border:none;background:transparent;cursor:pointer;color:var(--muted);transition:color .15s;gap:3px}
.nav-item.active{color:var(--accent)}
.nav-item svg{width:22px;height:22px;flex-shrink:0}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.3px}
.act-dot{width:11px;height:11px;border-radius:3px;background:var(--surface3)}
.act-dot.logged{background:var(--accent)}
.act-dot.rest{background:var(--surface2);opacity:.35}
.act-dot.future{background:var(--surface2);opacity:.15}

/* ---- BADGE NOTIFICATION ---- */
.badge-notif-overlay{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.78);animation:bfadein .25s ease}
.badge-notif-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:bslideup .3s cubic-bezier(.22,1,.36,1)}
.badge-notif-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.badge-notif-row:last-of-type{border-bottom:none}
.badge-notif-icon{font-size:34px;width:46px;text-align:center;flex-shrink:0;line-height:1}
@keyframes bfadein{from{opacity:0}to{opacity:1}}
@keyframes bslideup{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── Intro video screen ── */
.intro-screen{position:fixed;inset:0;background:#000;z-index:9999;cursor:pointer;-webkit-tap-highlight-color:transparent}
.intro-screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
@keyframes introFadeOut{to{opacity:0}}
.intro-screen.fading{animation:introFadeOut .4s ease forwards;pointer-events:none}

/* ── Transition animations ── */
@keyframes splashIn    { from{opacity:0;transform:scale(.94) translateY(10px)} to{opacity:1;transform:none} }
@keyframes splashOut   { to{opacity:0;transform:translateY(-22px)} }
@keyframes cardUp      { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:none} }
@keyframes slideInRight{ from{opacity:0;transform:translateX(18px)} to{opacity:1;transform:none} }

function getBirthday(user) { return localStorage.getItem(`birthday_${user}`) || ''; }

const US_HOLIDAYS_FIXED = new Set(['01-01','02-14','07-04','11-11','12-24','12-25','12-26','10-31']);
function isUSHoliday(dateStr) {
  if (!dateStr) return false;
  if (US_HOLIDAYS_FIXED.has(dateStr.slice(5))) return true;
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  const m = d.getMonth(), dow = d.getDay(), day = d.getDate();
  if (m === 10 && dow === 4 && day >= 22 && day <= 28) return true; // Thanksgiving
  if (m === 4  && dow === 1 && day >= 25 && day <= 31) return true; // Memorial Day
  if (m === 8  && dow === 1 && day >= 1  && day <= 7)  return true; // Labor Day
  return false;
}

function parseDurMinutes(dur) {
  if (!dur || dur === '—') return null;
  let total = 0;
  const h = dur.match(/(\d+)h/);
  const m = dur.match(/(\d+)\s*min/);
  const s = dur.match(/(\d+)\s*sec/);
  if (h) total += parseInt(h[1]) * 60;
  if (m) total += parseInt(m[1]);
  if (s) total += parseInt(s[1]) / 60;
  return total > 0 ? total : null;
}

function today() {
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function dateDay(d) { return DAYS_LONG[d.getDay()]; }

function fmtDate(d) { return `${MONTHS[d.getMonth()]} ${d.getDate()}`; }

function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fmtDuration(sec) {
  if (!sec) return '—';
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (m === 0) return `${s} sec`;
  if (m < 60) return s > 0 ? `${m} min ${s} sec` : `${m} min`;
  const h = Math.floor(m / 60);
  const rem = m % 60;
  return rem > 0 ? `${h}h ${rem} min` : `${h}h`;
}

// Returns array of 7 Date objects Mon–Sun for the week (offset weeks from now)
function getWeekDates(offset) {
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7) + offset * 7);
  monday.setHours(0, 0, 0, 0);
  return Array.from({length: 7}, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}

// Max ever-achieved streak (scanning forward through history)
function calcMaxStreak(user, loggedDates) {
  if (!loggedDates.size) return 0;
  const todayStr = localDateStr(new Date());
  const sorted = [...loggedDates].sort();
  const d = new Date(sorted[0]); d.setHours(0,0,0,0);
  const end = new Date(); end.setHours(0,0,0,0);
  let max = 0, cur = 0;
  while (d <= end) {
    const dStr = localDateStr(d);
    if (isPlanActive(PLAN_SHEETS[user][dateDay(d)], dStr)) {
      if (loggedDates.has(dStr)) { cur++; if (cur > max) max = cur; }
      else if (dStr < todayStr) cur = 0;
    }
    d.setDate(d.getDate() + 1);
  }
  return max;
}

// Return the date when streak first hit `target`, or null
function findStreakEarnedDate(user, loggedDates, target) {
  if (!loggedDates.size) return null;
  const todayStr = localDateStr(new Date());
  const sorted = [...loggedDates].sort();
  const d = new Date(sorted[0]); d.setHours(0,0,0,0);
  const end = new Date(); end.setHours(0,0,0,0);
  let cur = 0;
  while (d <= end) {
    const dStr = localDateStr(d);
    if (isPlanActive(PLAN_SHEETS[user][dateDay(d)], dStr)) {
      if (loggedDates.has(dStr)) { cur++; if (cur === target) return dStr; }
      else if (dStr < todayStr) cur = 0;
    }
    d.setDate(d.getDate() + 1);
  }
  return null;
}

// Compute earned badges (with earn dates) from raw log rows + date set
function computeBadgesFromRows(user, rows, dateSet) {
  const sorted = [...dateSet].sort();
  const total  = sorted.length;
  const todayStr = localDateStr(new Date());

  // ── Streaks ──────────────────────────────────────────────────
  const streak7Date   = findStreakEarnedDate(user, dateSet, 7);
  const streak14Date  = findStreakEarnedDate(user, dateSet, 14);
  const streak30Date  = findStreakEarnedDate(user, dateSet, 30);
  const streak60Date  = findStreakEarnedDate(user, dateSet, 60);
  const streak100Date = findStreakEarnedDate(user, dateSet, 100);
  const streak200Date = findStreakEarnedDate(user, dateSet, 200);
  const streak365Date = findStreakEarnedDate(user, dateSet, 365);

  // ── PR count (beat previous best for an exercise) ────────────
  // First-time logs establish the baseline but do NOT count as a PR.
  // Only a logged value that strictly exceeds all prior logs for that exercise counts.
  const sortedRows = [...rows].sort((a, b) => {
    const da = normDateStr(a[0]), db = normDateStr(b[0]);
    return da < db ? -1 : da > db ? 1 : 0;
  });
  const bestPerExercise = {}; // exerciseName → highest value ever logged
  let prCount = 0;
  let pr1Date = null, pr5Date = null, pr10Date = null, pr25Date = null, pr50Date = null;
  for (const row of sortedRows) {
    const name = String(row[3] || '').trim();
    if (!name) continue;
    const repsStr = String(row[5] || '').trim();
    const vals = repsStr.split(',').map(v => parseFloat(v.trim())).filter(n => !isNaN(n) && n > 0);
    if (!vals.length) continue;
    const maxVal = Math.max(...vals);
    const prevBest = bestPerExercise[name];
    if (prevBest !== undefined && maxVal > prevBest) {
      prCount++;
      const d = normDateStr(row[0]);
      if (prCount === 1)  pr1Date  = d;
      if (prCount === 5)  pr5Date  = d;
      if (prCount === 10) pr10Date = d;
      if (prCount === 25) pr25Date = d;
      if (prCount === 50) pr50Date = d;
    }
    if (prevBest === undefined || maxVal > prevBest) bestPerExercise[name] = maxVal;
  }

  // ── Total reps ───────────────────────────────────────────────
  let runningReps = 0, reps10kDate = null;
  for (const row of sortedRows) {
    if (reps10kDate) break;
    const repsStr = String(row[5] || '').trim();
    repsStr.split(',').forEach(v => { const n = parseFloat(v.trim()); if (!isNaN(n) && n > 0) runningReps += n; });
    if (runningReps >= 10000) reps10kDate = normDateStr(row[0]);
  }

  // ── Under 20 min ─────────────────────────────────────────────
  let under20Date = null;
  for (const row of sortedRows) {
    const mins = parseDurMinutes(String(row[8] || '').trim());
    if (mins !== null && mins < 20) { under20Date = normDateStr(row[0]); break; }
  }

  // ── Early bird (before 7am) — needs timestamp in row[9] ──────
  let earlyBirdDate = null;
  for (const row of sortedRows) {
    const t = String(row[9] || '').trim();
    if (/^\d{2}:\d{2}$/.test(t)) {
      const [h, m] = t.split(':').map(Number);
      if (h * 60 + m < 420) { earlyBirdDate = normDateStr(row[0]); break; }
    }
  }

  // ── Birthday ─────────────────────────────────────────────────
  const bday = getBirthday(user);
  const birthdayDate = bday ? (sorted.find(d => d.slice(5) === bday) || null) : null;

  // ── Holiday ──────────────────────────────────────────────────
  const holidayDate = sorted.find(d => isUSHoliday(d)) || null;

  // ── Group by year-month for month-based checks ───────────────
  const byYM = {};
  for (const d of sorted) {
    const ym = d.slice(0, 7);
    (byYM[ym] = byYM[ym] || []).push(d);
  }

  // ── January challenge (12 workouts in January) ───────────────
  let jan12Date = null;
  for (const [ym, dates] of Object.entries(byYM)) {
    if (ym.slice(5) === '01' && dates.length >= 12 && !jan12Date) jan12Date = dates[11];
  }

  // ── Summer grind (all scheduled in a complete summer month) ──
  let summerDate = null;
  for (const [ym, dates] of Object.entries(byYM).sort()) {
    if (summerDate) break;
    const mo = ym.slice(5);
    if (!['06','07','08'].includes(mo)) continue;
    const [yr] = ym.split('-');
    const year = parseInt(yr), month = parseInt(mo) - 1;
    const lastDay = localDateStr(new Date(year, month + 1, 0));
    if (lastDay >= todayStr) continue;
    const logSet = new Set(dates);
    let ok = true; let hasSched = false; let last = null;
    for (let d = 1; d <= new Date(year, month + 1, 0).getDate(); d++) {
      const date = new Date(year, month, d);
      const dStr = localDateStr(date);
      if (PLAN_SHEETS[user][dateDay(date)] !== null) {
        hasSched = true;
        if (!logSet.has(dStr)) { ok = false; break; }
        last = dStr;
      }
    }
    if (ok && hasSched && last) summerDate = last;
  }

  // ── Perfect month (all scheduled in a completed calendar month) ──
  let perfectMonthDate = null;
  for (const [ym, dates] of Object.entries(byYM).sort()) {
    if (perfectMonthDate) break;
    const [yr, mo] = ym.split('-');
    const year = parseInt(yr), month = parseInt(mo) - 1;
    const lastDay = localDateStr(new Date(year, month + 1, 0));
    if (lastDay >= todayStr) continue;
    const logSet = new Set(dates);
    let ok = true; let hasSched = false; let last = null;
    for (let d = 1; d <= new Date(year, month + 1, 0).getDate(); d++) {
      const date = new Date(year, month, d);
      if (PLAN_SHEETS[user][dateDay(date)] !== null) {
        hasSched = true;
        if (!logSet.has(localDateStr(date))) { ok = false; break; }
        last = localDateStr(date);
      }
    }
    if (ok && hasSched && last) perfectMonthDate = last;
  }

  // ── Perfect N consecutive weeks ──────────────────────────────
  function findPerfectWeeks(target) {
    if (!sorted.length) return null;
    const firstDate = new Date(sorted[0]); firstDate.setHours(0,0,0,0);
    const dow = firstDate.getDay();
    const weekMon = new Date(firstDate);
    weekMon.setDate(weekMon.getDate() + (dow === 0 ? -6 : 1 - dow));
    let consec = 0;
    const wm = new Date(weekMon);
    while (localDateStr(wm) <= todayStr) {
      let weekOk = true; let hasSched = false; let last = null;
      for (let i = 0; i < 7; i++) {
        const wday = new Date(wm); wday.setDate(wday.getDate() + i);
        const dStr = localDateStr(wday);
        if (dStr > todayStr) break;
        if (PLAN_SHEETS[user][dateDay(wday)] !== null) {
          hasSched = true;
          if (!dateSet.has(dStr)) weekOk = false;
          else last = dStr;
        }
      }
      if (weekOk && hasSched && last) { consec++; if (consec >= target) return last; }
      else consec = 0;
      wm.setDate(wm.getDate() + 7);
    }
    return null;
  }

  // ── Perfect N consecutive months ─────────────────────────────
  function findPerfectMonths(target) {
    let consec = 0; let last = null;
    for (const [ym, dates] of Object.entries(byYM).sort()) {
      const [yr, mo] = ym.split('-');
      const year = parseInt(yr), month = parseInt(mo) - 1;
      const lastDay = localDateStr(new Date(year, month + 1, 0));
      if (lastDay >= todayStr) break;
      const logSet = new Set(dates);
      let ok = true; let hasSched = false; let mLast = null;
      for (let d = 1; d <= new Date(year, month + 1, 0).getDate(); d++) {
        const date = new Date(year, month, d);
        if (PLAN_SHEETS[user][dateDay(date)] !== null) {
          hasSched = true;
          if (!logSet.has(localDateStr(date))) { ok = false; break; }
          mLast = localDateStr(date);
        }
      }
      if (ok && hasSched && mLast) { consec++; last = mLast; if (consec >= target) return last; }
      else { consec = 0; last = null; }
    }
    return null;
  }

  // ── Monday consistency ───────────────────────────────────────
  function findMondayConsistency(targetMonths) {
    if (!PLAN_SHEETS[user]['Monday']) return null;
    let consec = 0; let last = null;
    for (const [ym, dates] of Object.entries(byYM).sort()) {
      const [yr, mo] = ym.split('-');
      const year = parseInt(yr), month = parseInt(mo) - 1;
      const lastDay = localDateStr(new Date(year, month + 1, 0));
      if (lastDay >= todayStr) break;
      const logSet = new Set(dates);
      let ok = true; let hasMon = false; let mLast = null;
      for (let d = 1; d <= new Date(year, month + 1, 0).getDate(); d++) {
        const date = new Date(year, month, d);
        const dStr = localDateStr(date);
        if (date.getDay() === 1) {
          hasMon = true;
          if (!logSet.has(dStr)) { ok = false; break; }
          mLast = dStr;
        }
      }
      if (ok && hasMon && mLast) { consec++; last = mLast; if (consec >= targetMonths) return last; }
      else { consec = 0; last = null; }
    }
    return null;
  }

  // ── Saturday consistency ─────────────────────────────────────
  let perfectSats1mDate = null;
  if (PLAN_SHEETS[user]['Saturday'] !== null) {
    for (const [ym, dates] of Object.entries(byYM).sort()) {
      if (perfectSats1mDate) break;
      const [yr, mo] = ym.split('-');
      const year = parseInt(yr), month = parseInt(mo) - 1;
      const lastDay = localDateStr(new Date(year, month + 1, 0));
      if (lastDay >= todayStr) continue;
      const logSet = new Set(dates);
      let ok = true; let hasSat = false; let sLast = null;
      for (let d = 1; d <= new Date(year, month + 1, 0).getDate(); d++) {
        const date = new Date(year, month, d);
        const dStr = localDateStr(date);
        if (date.getDay() === 6) {
          hasSat = true;
          if (!logSet.has(dStr)) { ok = false; break; }
          sLast = dStr;
        }
      }
      if (ok && hasSat && sLast) perfectSats1mDate = sLast;
    }
  }

  // ── Build earned map ─────────────────────────────────────────
  const earned = {};
  // Workout counts
  if (total >= 1)   earned.first_workout = sorted[0];
  if (total >= 10)  earned.workouts_10   = sorted[9];
  if (total >= 25)  earned.workouts_25   = sorted[24];
  if (total >= 50)  earned.workouts_50   = sorted[49];
  if (total >= 100) earned.workouts_100  = sorted[99];
  if (total >= 200) earned.workouts_200  = sorted[199];
  if (total >= 365) earned.workouts_365  = sorted[364];
  // Streaks
  if (streak7Date)   earned.streak_7   = streak7Date;
  if (streak14Date)  earned.streak_14  = streak14Date;
  if (streak30Date)  earned.streak_30  = streak30Date;
  if (streak60Date)  earned.streak_60  = streak60Date;
  if (streak100Date) earned.streak_100 = streak100Date;
  if (streak200Date) earned.streak_200 = streak200Date;
  if (streak365Date) earned.streak_365 = streak365Date;
  // PRs
  if (pr1Date)  earned.first_pr = pr1Date;
  if (pr5Date)  earned.prs_5   = pr5Date;
  if (pr10Date) earned.prs_10  = pr10Date;
  if (pr25Date) earned.prs_25  = pr25Date;
  if (pr50Date) earned.prs_50  = pr50Date;
  // Consistency
  const p2w = findPerfectWeeks(2);  if (p2w) earned.perfect_2weeks  = p2w;
  const p4w = findPerfectWeeks(4);  if (p4w) earned.perfect_4weeks  = p4w;
  const p8w = findPerfectWeeks(8);  if (p8w) earned.perfect_8weeks  = p8w;
  if (perfectMonthDate)             earned.perfect_month   = perfectMonthDate;
  const p3m = findPerfectMonths(3); if (p3m) earned.perfect_3months = p3m;
  const m1 = findMondayConsistency(1); if (m1) earned.no_miss_mon_1m = m1;
  const m2 = findMondayConsistency(2); if (m2) earned.no_miss_mon_2m = m2;
  const m6 = findMondayConsistency(6); if (m6) earned.no_miss_mon_6m = m6;
  if (perfectSats1mDate) earned.perfect_sats_1m = perfectSats1mDate;
  // Special
  if (reps10kDate)    earned.reps_10000       = reps10kDate;
  if (under20Date)    earned.workout_under_20  = under20Date;
  if (earlyBirdDate)  earned.early_bird        = earlyBirdDate;
  if (jan12Date)      earned.january_12        = jan12Date;
  if (summerDate)     earned.summer_grind      = summerDate;
  if (holidayDate)    earned.holiday_hero      = holidayDate;
  if (birthdayDate)   earned.birthday_gains    = birthdayDate;
  return earned;
}

// ── Duo badge computation (runs with both users' data) ──────────────────
function computeDuoBadges(joshDates, wifeDates, joshRows, wifeRows) {
  const todayStr = localDateStr(new Date());
  const jSorted  = [...joshDates].sort();
  const wSorted  = [...wifeDates].sort();
  const earned   = {};

  // Both reach 50 / 100 workouts
  if (jSorted.length >= 50  && wSorted.length >= 50)
    earned.duo_50_workouts = [jSorted[49],  wSorted[49]].sort().pop();
  if (jSorted.length >= 100 && wSorted.length >= 100)
    earned.duo_100_workouts = [jSorted[99], wSorted[99]].sort().pop();

  // Valentine's Day & New Year's Day
  const jVal = jSorted.find(d => d.slice(5) === '02-14');
  const wVal = wSorted.find(d => d.slice(5) === '02-14');
  if (jVal && wVal) earned.duo_valentines = [jVal, wVal].sort().pop();

  const jNY = jSorted.find(d => d.slice(5) === '01-01');
  const wNY = wSorted.find(d => d.slice(5) === '01-01');
  if (jNY && wNY) earned.duo_new_year = [jNY, wNY].sort().pop();

  // Both 7-day and 30-day streaks simultaneously
  const j7  = findStreakEarnedDate('josh', joshDates, 7);
  const w7  = findStreakEarnedDate('wife', wifeDates, 7);
  const j30 = findStreakEarnedDate('josh', joshDates, 30);
  const w30 = findStreakEarnedDate('wife', wifeDates, 30);
  if (j7  && w7)  earned.duo_streak_7_sync = [j7,  w7].sort().pop();
  if (j30 && w30) earned.duo_streak_30     = [j30, w30].sort().pop();

  // 7 consecutive calendar dates where BOTH logged
  const allBothDates = jSorted.filter(d => wifeDates.has(d));
  let run = 1;
  for (let i = 1; i < allBothDates.length && !earned.duo_same_day_7; i++) {
    const prev = new Date(allBothDates[i-1]), curr = new Date(allBothDates[i]);
    const diff = Math.round((curr - prev) / 86400000);
    if (diff === 1) { run++; if (run >= 7) earned.duo_same_day_7 = allBothDates[i]; }
    else run = 1;
  }

  // Helper: check if all scheduled days in a week are logged for a user
  function weekOkFor(user, weekMon, logSet) {
    let hasSched = false;
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekMon); d.setDate(d.getDate() + i);
      const dStr = localDateStr(d);
      if (dStr > todayStr) break;
      if (PLAN_SHEETS[user][dateDay(d)] !== null) {
        hasSched = true;
        if (!logSet.has(dStr)) return false;
      }
    }
    return hasSched;
  }

  // Iterate all calendar weeks from first logged date
  function iterateWeeks(fn) {
    const allFirst = [...jSorted, ...wSorted].sort()[0];
    if (!allFirst) return;
    const firstDate = new Date(allFirst); firstDate.setHours(0,0,0,0);
    const dow = firstDate.getDay();
    const wm = new Date(firstDate);
    wm.setDate(wm.getDate() + (dow === 0 ? -6 : 1 - dow));
    while (localDateStr(wm) <= todayStr) {
      fn(new Date(wm));
      wm.setDate(wm.getDate() + 7);
    }
  }

  // Perfect week together & no-miss 2 weeks together
  let consecGood = 0;
  iterateWeeks(wm => {
    if (earned.duo_perfect_week && earned.duo_no_miss_2wks) return;
    const lastDay = localDateStr(new Date(wm.getTime() + 6 * 86400000));
    if (weekOkFor('josh', wm, joshDates) && weekOkFor('wife', wm, wifeDates)) {
      if (!earned.duo_perfect_week) earned.duo_perfect_week = lastDay;
      consecGood++;
      if (consecGood >= 2 && !earned.duo_no_miss_2wks) earned.duo_no_miss_2wks = lastDay;
    } else {
      consecGood = 0;
    }
  });

  // Perfect month together & same-day month
  const allYMs = new Set([...jSorted, ...wSorted].map(d => d.slice(0,7)));
  for (const ym of [...allYMs].sort()) {
    if (earned.duo_perfect_month && earned.duo_same_day_month) break;
    const [yr, mo] = ym.split('-');
    const year = parseInt(yr), month = parseInt(mo) - 1;
    const lastDay = localDateStr(new Date(year, month + 1, 0));
    if (lastDay >= todayStr) continue;
    const totalDays = new Date(year, month + 1, 0).getDate();
    let jAllOk = true, jHas = false, jLast = null;
    let wAllOk = true, wHas = false, wLast = null;
    let sharedOk = true, hasShared = false, sharedLast = null;
    for (let d = 1; d <= totalDays; d++) {
      const date = new Date(year, month, d);
      const dStr = localDateStr(date);
      const jSched = PLAN_SHEETS['josh'][dateDay(date)] !== null;
      const wSched = PLAN_SHEETS['wife'][dateDay(date)] !== null;
      if (jSched) { jHas = true; if (!joshDates.has(dStr)) jAllOk = false; else jLast = dStr; }
      if (wSched) { wHas = true; if (!wifeDates.has(dStr)) wAllOk = false; else wLast = dStr; }
      if (jSched && wSched) {
        hasShared = true;
        if (!joshDates.has(dStr) || !wifeDates.has(dStr)) sharedOk = false;
        else sharedLast = dStr;
      }
    }
    if (!earned.duo_perfect_month && jAllOk && jHas && jLast && wAllOk && wHas && wLast)
      earned.duo_perfect_month = [jLast, wLast].sort().pop();
    if (!earned.duo_same_day_month && sharedOk && hasShared && sharedLast)
      earned.duo_same_day_month = sharedLast;
  }

  // Time-based duo badges (needs row[9] timestamp "HH:MM")
  function buildTimeMap(rows) {
    const map = {};
    rows.forEach(row => {
      const date = normDateStr(row[0]);
      const t = String(row[9] || '').trim();
      if (date && /^\d{2}:\d{2}$/.test(t) && !map[date]) map[date] = t;
    });
    return map;
  }
  const jTimes = buildTimeMap(joshRows);
  const wTimes = buildTimeMap(wifeRows);

  for (const d of allBothDates.sort()) {
    const jt = jTimes[d], wt = wTimes[d];
    if (!jt || !wt) continue;
    const jMin = parseInt(jt.split(':')[0]) * 60 + parseInt(jt.split(':')[1]);
    const wMin = parseInt(wt.split(':')[0]) * 60 + parseInt(wt.split(':')[1]);
    if (!earned.duo_before_8am && jMin < 480 && wMin < 480) earned.duo_before_8am = d;
    if (!earned.duo_same_hour  && Math.abs(jMin - wMin) <= 60) earned.duo_same_hour = d;
    if (earned.duo_before_8am && earned.duo_same_hour) break;
  }

  return earned;
}

function badgeDateLabel(d) {
  if (!d) return '';
  const parts = d.split('-');
  if (parts.length !== 3) return d;
  return `${MONTHS[parseInt(parts[1])-1]} ${parseInt(parts[2])}, ${parts[0]}`;
}

// XP & LEVELING
// ═══════════════════════════════════════════════
// Total XP required to reach `level` from level 1
function xpThreshold(level) { return level <= 1 ? 0 : 125 * (level - 1) * level; }

function levelFromXP(xp) {
  let lv = 1;
  while (xpThreshold(lv + 1) <= xp) lv++;
  return lv;
}

const LEVEL_TITLES = ['','Rookie','Trainee','Grinder','Athlete','Competitor','Warrior','Champion','Elite','Master','Legend'];
function getLevelTitle(lv) { return LEVEL_TITLES[Math.min(lv, LEVEL_TITLES.length - 1)] || 'Legend'; }

function xpProgressInfo(xp) {
  xp = xp || 0;
  const lv    = levelFromXP(xp);
  const floor = xpThreshold(lv);
  const ceil  = xpThreshold(lv + 1);
  const cur   = xp - floor;
  const need  = ceil - floor;
  return { level: lv, title: getLevelTitle(lv), current: cur, needed: need, pct: Math.min(100, Math.round(cur / need * 100)) };
}

function calcWorkoutXP(exercisesDone, prCount, streak) {
  let xp = 100;
  xp += exercisesDone * 5;
  xp += prCount * 50;
  if (streak >= 30) xp += 75;
  else if (streak >= 14) xp += 50;
  else if (streak >= 7) xp += 25;
  return xp;
}

function xpBarHTML(user) {
  const xp = S.xp[user];
  if (xp === null) return '<div style="font-size:12px;color:var(--muted);margin-top:8px">Loading level…</div>';
  const info = xpProgressInfo(xp);
  return `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span style="font-size:13px;font-weight:700;color:var(--accent)">Lv.${info.level} &middot; ${info.title}</span>
      <span style="font-size:11px;color:var(--muted)">${info.current} / ${info.needed} XP</span>
    </div>
    <div style="height:6px;background:var(--surface3);border-radius:3px;overflow:hidden">
      <div id="xp-bar-${user}" data-pct="${info.pct}" style="height:100%;background:var(--accent);border-radius:3px;width:0%;transition:width 1.5s ease-out"></div>
    </div>
  </div>`;
}

function renderXPCard() {
  if (!S.lastXPEarned) return '';
  const info = xpProgressInfo(S.xp[S.user] || 0);
  return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 20px;text-align:center;width:100%;max-width:320px">
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">XP Earned</div>
    <div style="font-size:30px;font-weight:800;color:var(--yellow)">+${S.lastXPEarned} XP</div>
    ${S.levelUpInfo
      ? `<div style="font-size:13px;color:var(--accent);font-weight:700;margin-top:6px">⭐ Level Up → Lv.${info.level} · ${info.title}!</div>`
      : `<div style="font-size:12px;color:var(--muted);margin-top:6px">Lv.${info.level} · ${info.current}/${info.needed} XP to next level</div>`
    }
  </div>`;
}

// Normalize whatever date format GAS returns to YYYY-MM-DD
function normDateStr(v) {
  if (!v) return '';
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10); // ISO or already YYYY-MM-DD
  const slash = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (slash) return `${slash[3]}-${slash[1].padStart(2,'0')}-${slash[2].padStart(2,'0')}`;
  return '';
}
// Normalize whatever time format GAS returns to HH:MM
function normTimeStr(v) {
  if (!v) return '00:00';
  const s = String(v).trim();
  if (/^\d{2}:\d{2}/.test(s)) return s.slice(0, 5); // already HH:MM
  // GAS serializes time-only values as ISO with 1899-12-30 base date
  const iso = s.match(/T(\d{2}):(\d{2})/);
  if (iso) return `${iso[1]}:${iso[2]}`;
  return '00:00';
}
function calcStreak(user, loggedDates) {
  const todayStr = localDateStr(new Date());
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const dStr = localDateStr(d);
    const isScheduled = isPlanActive(PLAN_SHEETS[user][dateDay(d)], dStr);
    if (!isScheduled) {
      // Rest day — skip without breaking streak
      d.setDate(d.getDate() - 1);
      continue;
    }
    if (loggedDates.has(dStr)) {
      streak++;
      d.setDate(d.getDate() - 1);
      continue;
    }
    // Scheduled workout day not yet logged — if it's today, skip (pending); otherwise stop
    if (dStr === todayStr) {
      d.setDate(d.getDate() - 1);
      continue;
    }
    break;
  }
  return streak;
}

function isBothScheduled(d) {
  const day = dateDay(d);
  return PLAN_SHEETS.josh[day] !== null && PLAN_SHEETS.wife[day] !== null;
}

function calcCurrentCombinedStreak(joshDates, wifeDates) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  const todayStr = localDateStr(d);
  let streak = 0;
  for (let i = 0; i < 1000; i++) {
    const dStr = localDateStr(d);
    if (!isBothScheduled(d)) {
      // Not a shared workout day — skip without affecting streak
      d.setDate(d.getDate() - 1);
      continue;
    }
    const jLogged = joshDates.has(dStr);
    const wLogged = wifeDates.has(dStr);
    if (jLogged && wLogged) {
      streak++;
    } else if (dStr === todayStr) {
      // Today not yet logged — skip (pending)
    } else {
      break;
    }
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function calcBestCombinedStreak(joshDates, wifeDates) {
  const allDates = [...new Set([...joshDates, ...wifeDates])].sort();
  if (!allDates.length) return 0;
  const start = new Date(allDates[0] + 'T00:00:00');
  const end = new Date();
  end.setHours(0, 0, 0, 0);
  let best = 0, current = 0;
  const d = new Date(start);
  while (d <= end) {
    if (isBothScheduled(d)) {
      const dStr = localDateStr(d);
      const bothLogged = joshDates.has(dStr) && wifeDates.has(dStr);
      if (bothLogged) {
        current++;
        if (current > best) best = current;
      } else if (dStr < localDateStr(end)) {
        current = 0;
      }
    }
    d.setDate(d.getDate() + 1);
  }
  return best;
}

async function loadStreaks() {
  if (S.streaksLoading) return;
  S.streaksLoading = true;
  try {
    const [joshRows, wifeRows, joshXPRows, wifeXPRows] = await Promise.all([
      gasRead(JOSH_LOG_SHEET),
      gasRead(WIFE_LOG_SHEET),
      gasRead(JOSH_XP_SHEET),
      gasRead(WIFE_XP_SHEET)
    ]);
    const joshDates = new Set(joshRows.map(r => normDateStr(r[0])).filter(Boolean));
    const wifeDates = new Set(wifeRows.map(r => normDateStr(r[0])).filter(Boolean));
    S.streaks.josh = calcStreak('josh', joshDates);
    S.streaks.wife = calcStreak('wife', wifeDates);

    // Compute XP totals; retroactively initialize if XP sheet is empty
    const todayStr = localDateStr(new Date());
    [['josh', joshXPRows, joshDates, JOSH_XP_SHEET],
     ['wife', wifeXPRows, wifeDates, WIFE_XP_SHEET]].forEach(([user, xpRows, dates, sheet]) => {
      if (xpRows.length > 0) {
        S.xp[user] = xpRows.reduce((sum, r) => sum + (parseFloat(r[2]) || 0), 0);
      } else {
        const retroXP = dates.size * 150;
        S.xp[user] = retroXP;
        if (dates.size > 0) {
          gasWrite(sheet, [[todayStr, 'retroactive', retroXP, `Retroactive: ${dates.size} workouts`]]).catch(() => {});
        }
      }
    });

    // Compute duo badges (shown for both users)
    const duoBadges = computeDuoBadges(joshDates, wifeDates, joshRows, wifeRows);
    ['josh', 'wife'].forEach(user => {
      if (!S.badges[user]) S.badges[user] = {};
      Object.assign(S.badges[user], duoBadges);
    });

    // Level badges — award based on current XP total
    function levelBadgeDate(user) {
      // Find the XP row where cumulative XP crossed each level threshold
      const xpRows = user === 'josh' ? joshXPRows : wifeXPRows;
      const levels = [10, 25, 50, 75, 100];
      const result = {};
      let cumXP = 0;
      const sortedXP = [...xpRows].sort((a,b) => normDateStr(a[0]) < normDateStr(b[0]) ? -1 : 1);
      let li = 0;
      for (const row of sortedXP) {
        cumXP += parseFloat(row[2]) || 0;
        const lv = levelFromXP(cumXP);
        while (li < levels.length && lv >= levels[li]) {
          result[`level_${levels[li]}`] = normDateStr(row[0]) || todayStr;
          li++;
        }
        if (li >= levels.length) break;
      }
      return result;
    }
    ['josh','wife'].forEach(user => {
      const lvBadges = levelBadgeDate(user);
      if (!S.badges[user]) S.badges[user] = {};
      Object.assign(S.badges[user], lvBadges);
    });

    // Champion badge: who won last month?
    const now = new Date();
    const lastMonthYM = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const lastYM = `${lastMonthYM.getFullYear()}-${String(lastMonthYM.getMonth()+1).padStart(2,'0')}`;
    const jCount = [...joshDates].filter(d => d.startsWith(lastYM)).length;
    const wCount = [...wifeDates].filter(d => d.startsWith(lastYM)).length;
    if (jCount > 0 || wCount > 0) {
      if (jCount > wCount) S.champion = 'josh';
      else if (wCount > jCount) S.champion = 'wife';
      else S.champion = 'tie';
    } else {
      S.champion = null;
    }
    // Award champion badge to winner
    if (S.champion && S.champion !== 'tie') {
      const champDate = lastYM + '-' + String(new Date(now.getFullYear(), now.getMonth(), 0).getDate()).padStart(2,'0');
      if (!S.badges[S.champion]) S.badges[S.champion] = {};
      S.badges[S.champion].duo_champion = champDate;
    }

  } catch(e) {
    S.streaks.josh = 0;
    S.streaks.wife = 0;
    S.xp.josh = 0;
    S.xp.wife = 0;
  }
  S.streaksLoading = false;
  render();
}

async function loadWeekDurations() {
  if (S.weekDurationsLoaded) return;
  S.weekDurationsLoaded = true;
  try {
    const logSheet = S.user === 'josh' ? JOSH_LOG_SHEET : WIFE_LOG_SHEET;
    const prSheet  = S.user === 'josh' ? JOSH_PR_HISTORY_SHEET : WIFE_PR_HISTORY_SHEET;
    const [rows, prHistRows] = await Promise.all([gasRead(logSheet), gasRead(prSheet).catch(() => [])]);
    const map = {};
    const dateSet = new Set();
    rows.forEach(row => {
      const date = normDateStr(row[0]);
      const dur  = String(row[8] || '').trim();
      if (date) dateSet.add(date);
      if (date && dur && !map[date]) map[date] = dur;
    });
    S.weekDurations = map;
    S.loggedDates = dateSet;
    const baseBadges = computeBadgesFromRows(S.user, rows, dateSet);

    // PR streak badge: check if any exercise has PRs in 3 consecutive calendar weeks
    const pr3Date = computePR3WeeksBadge(prHistRows);
    if (pr3Date) baseBadges.pr_3weeks = pr3Date;

    // Apply manual overrides before merging (corrects dates and revokes false grants)
    applyBadgeOverrides(S.user, baseBadges);

    // Merge with any duo/level badges already computed in loadStreaks
    S.badges[S.user] = Object.assign({}, S.badges[S.user] || {}, baseBadges);
  } catch(e) {}
  S.badgesLoaded = true;
  render();
}

function computePR3WeeksBadge(prHistRows) {
  if (!prHistRows.length) return null;
  // Group by exercise → list of { week: 'YYYY-Www', date }
  const byEx = {};
  prHistRows.forEach(row => {
    const date = normDateStr(row[0]);
    const name = String(row[1] || '').trim();
    if (!date || !name) return;
    const d = new Date(date); d.setHours(0,0,0,0);
    const startOfYear = new Date(d.getFullYear(), 0, 1);
    const weekNum = Math.ceil(((d - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
    const weekKey = `${d.getFullYear()}-W${String(weekNum).padStart(2,'0')}`;
    if (!byEx[name]) byEx[name] = [];
    byEx[name].push({ weekKey, date });
  });
  for (const [, entries] of Object.entries(byEx)) {
    const weeks = [...new Set(entries.map(e => e.weekKey))].sort();
    for (let i = 2; i < weeks.length; i++) {
      const [y1,w1] = weeks[i-2].split('-W').map(Number);
      const [y2,w2] = weeks[i-1].split('-W').map(Number);
      const [y3,w3] = weeks[i].split('-W').map(Number);
      if (y1 === y2 && y2 === y3 && w2 === w1+1 && w3 === w2+1) {
        const earnDate = entries.filter(e => e.weekKey === weeks[i]).map(e => e.date).sort().pop();
        return earnDate;
      }
    }
  }
  return null;
}

// ═══════════════════════════════════════════════
// PROGRESSION LOGIC
// ═══════════════════════════════════════════════
// Extract all distinct time values (in seconds) from a target string (e.g. "45 sec → 30 sec")
function parseAllTimers(str) {
  const seen = new Set(), out = [];
  const re = /(\d+)\s*(min|sec)\b/gi;
  let m;
  while ((m = re.exec(str || '')) !== null) {
    const v = m[2].toLowerCase().startsWith('m') ? parseInt(m[1]) * 60 : parseInt(m[1]);
    if (!seen.has(v)) { seen.add(v); out.push(v); }
  }
  return out;
}

function parseTarget(str) {
  str = str || '';
  if (/failure|max|burnout|gauntlet|triset|flow/i.test(str)) return {value: null, unit: 'max'};
  if (/on\s*\/\s*off/i.test(str)) return {value: null, unit: 'interval'};
  if (/→|→/i.test(str)) return {value: null, unit: 'complex'};
  const perSide = /side|arm|leg/i.test(str);
  const sec = str.match(/(\d+)\s*sec/i);
  if (sec) return {value: parseInt(sec[1]), unit: 'sec', perSide};
  const min = str.match(/(\d+)\s*min/i);
  if (min) return {value: parseInt(min[1]) * 60, unit: 'sec', perSide};
  const num = str.match(/(\d+)/);
  if (num) return {value: parseInt(num[1]), unit: 'reps', perSide};
  return {value: null, unit: 'other'};
}

function calcProgression(exercises, history) {
  const prog = {};
  const byName = {};
  history.forEach(row => {
    const name = row[3];
    const reps = row[5];
    const date = normDateStr(row[0]);
    if (!date) return;
    if (!byName[name] || date > byName[name].date) byName[name] = {date, reps};
  });
  const NO_PROGRESS = new Set(['Warm-Up', 'Cool-Down', 'Finisher']);
  exercises.forEach(ex => {
    const parsed = parseTarget(ex.target);
    const last = byName[ex.name];
    if (NO_PROGRESS.has(ex.block) || !last || parsed.unit === 'max' || parsed.unit === 'interval' || parsed.unit === 'complex' || !parsed.value) {
      prog[ex.name] = {target: ex.target, progressed: false};
      return;
    }
    const loggedVal = parseFloat(last.reps);
    if (!isNaN(loggedVal) && loggedVal >= parsed.value) {
      let newVal = parsed.unit === 'sec' ? parsed.value + 5 : parsed.value + 1;
      const unit = parsed.unit === 'sec' ? ' sec' : ' reps';
      const side = parsed.perSide ? '/side' : '';
      prog[ex.name] = {target: `${newVal}${unit}${side}`, progressed: true};
    } else {
      prog[ex.name] = {target: ex.target, progressed: false};
    }
  });
  return prog;
}

async function gasRead(sheetName) {
  const url = `${S.gasUrl}?action=read&sheet=${encodeURIComponent(sheetName)}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Read failed: ${r.status}`);
  const json = await r.json();
  return json.rows || [];
}

// Like gasRead but returns ALL rows (no header skip) — used for sheets with no header row (e.g. Messages)
async function gasReadAll(sheetName) {
  const url = `${S.gasUrl}?action=read_all&sheet=${encodeURIComponent(sheetName)}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Read failed: ${r.status}`);
  const json = await r.json();
  return json.rows || [];
}

async function gasWrite(sheetName, rows) {
  const data = encodeURIComponent(JSON.stringify({sheet: sheetName, rows}));
  const url = `${S.gasUrl}?action=log&data=${data}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Write failed: ${r.status}`);
  return r.json();
}

async function fetchPlan(user, day) {
  const meta = PLAN_SHEETS[user][day];
  if (!meta) return null; // rest day
  const url = `${S.gasUrl}?action=get_plan&sheet=${encodeURIComponent(meta.sheet)}&day=${encodeURIComponent(day)}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Could not load workout plan (${r.status})`);
  const json = await r.json();
  if (json.error) throw new Error(json.error);
  return { ...meta, exercises: json.exercises };
}

async function loadHistory() {
  try {

async function submitWorkout() {
  S.workoutDuration = S.workoutStartTime ? Math.floor((Date.now() - S.workoutStartTime) / 1000) : 0;
  S.screen = 'uploading';
  render();
  try {
    const sheet = S.user === 'josh' ? JOSH_LOG_SHEET : WIFE_LOG_SHEET;
    const dateStr = localDateStr(S.selectedDate || new Date());
    const durationStr = fmtDuration(S.workoutDuration);
    const timeStr = new Date().toTimeString().slice(0,5); // "HH:MM"
    const rows = [];
    S.workout.exercises.forEach((ex, i) => {
      const log = S.logs[i];
      if (!log || !log.done) return;
      rows.push([
        dateStr,
        S.day,
        S.workout.name,
        ex.name,
        String(log.setsCompleted || ex.sets),
        log.reps || '',
        log.notes || '',
        '✅',
        durationStr,
        timeStr
      ]);
    });
    if (rows.length) await gasWrite(sheet, rows);

    // Write PR history (for "PR 3 weeks in a row" badge tracking)
    if (Object.keys(S.prs).length > 0) {
      const prSheet = S.user === 'josh' ? JOSH_PR_HISTORY_SHEET : WIFE_PR_HISTORY_SHEET;
      const prRows = Object.keys(S.prs).map(name => [dateStr, name, S.prs[name].value || '']);
      gasWrite(prSheet, prRows).catch(() => {});
    }
    S.loggedDates.add(dateStr);
    if (durationStr) S.weekDurations[dateStr] = durationStr;
    S.weekJustCompleted = isCurrentWeekComplete();

    // XP
    const exercisesDone = Object.values(S.logs).filter(l => l.done).length;
    const prCount = Object.keys(S.prs).length;
    const xpEarned = calcWorkoutXP(exercisesDone, prCount, S.streaks[S.user] || 0);
    const prevXP   = S.xp[S.user] || 0;
    const prevLevel = levelFromXP(prevXP);
    S.xp[S.user]   = prevXP + xpEarned;
    S.lastXPEarned  = xpEarned;
    const newLevel  = levelFromXP(S.xp[S.user]);
    S.levelUpInfo   = newLevel > prevLevel ? { level: newLevel, title: getLevelTitle(newLevel) } : null;
    const xpNote = `${exercisesDone} ex${prCount > 0 ? `, ${prCount} PR` : ''}${(S.streaks[S.user]||0) >= 7 ? ', streak' : ''}`;
    gasWrite(S.user === 'josh' ? JOSH_XP_SHEET : WIFE_XP_SHEET,
      [[dateStr, S.workout.name, xpEarned, xpNote]]).catch(() => {});

    S.togetherRecordsLoaded = false;
    S.togetherRecordsLoading = false;
    S.togetherRecords = null;
    clearProgress();
    S.screen = 'success';
    render();
    checkAndNotifyNewBadges();
    if (S.levelUpInfo) setTimeout(() => showLevelUpNotification(S.levelUpInfo), 700);
  } catch(e) {
    S.error = e.message;
    S.screen = 'summary';
    render();
  }
}

function isCurrentWeekComplete() {
  if (!S.user || !PLAN_SHEETS[S.user]) return false;
  return getWeekDates(0)
    .filter(d => PLAN_SHEETS[S.user][dateDay(d)] !== null)
    .every(d => S.loggedDates.has(localDateStr(d)));
}

function launchConfetti(type) {
  const existing = document.getElementById('confetti-canvas');
  if (existing) existing.remove();
  const canvas = document.createElement('canvas');
  canvas.id = 'confetti-canvas';
  canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const W = canvas.width, H = canvas.height;
  const colors = ['#f97316','#eab308','#22c55e','#3b82f6','#a855f7','#ec4899','#ef4444','#06b6d4','#84cc16','#f43f5e'];
  const DURATION = 3200;
  const FADE_START = DURATION * 0.6;
  const start = performance.now();
  const particles = [];

  function mkParticle(x, y, vx, vy) {
    return {
      x, y, vx, vy,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.3,
      w: 6 + Math.random() * 7,
      h: 4 + Math.random() * 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      shape: Math.random() < 0.6 ? 'rect' : 'circle',
      gravity: 0.15 + Math.random() * 0.15,
      drag: 0.98 + Math.random() * 0.01,
    };
  }

  if (type === 'pr') {
    const ox = W / 2, oy = H * 0.15;
    for (let i = 0; i < 90; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random() * 10;
      particles.push(mkParticle(ox, oy, Math.cos(angle) * speed, Math.sin(angle) * speed - 3));
    }
  } else {
    [[W * 0.1, H], [W * 0.9, H]].forEach(([ox, oy]) => {
      for (let i = 0; i < 100; i++) {
        const spread = (Math.random() - 0.5) * 14;
        const up = -(12 + Math.random() * 10);
        particles.push(mkParticle(ox, oy, spread, up));
      }
    });
  }

  function loop(now) {
    const elapsed = now - start;
    if (elapsed > DURATION) { canvas.remove(); return; }
    ctx.clearRect(0, 0, W, H);
    const alpha = elapsed > FADE_START ? 1 - (elapsed - FADE_START) / (DURATION - FADE_START) : 1;
    particles.forEach(p => {
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      if (p.shape === 'rect') {
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.h / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

function checkAndNotifyNewBadges() {
  const todayStr = localDateStr(new Date());
  const existing = S.badges[S.user] || {};
  const total = S.loggedDates.size;
  const maxStreak = calcMaxStreak(S.user, S.loggedDates);
  const sessionPrs = Object.keys(S.prs).length;

  // Estimate historical PR count from already-earned badges
  let prCount = 0;
  if (existing.prs_50) prCount = 50;
  else if (existing.prs_25) prCount = 25;
  else if (existing.prs_10) prCount = 10;
  else if (existing.prs_5)  prCount = 5;
  else if (existing.first_pr) prCount = 1;
  prCount = Math.max(prCount, sessionPrs);

  const xp    = S.xp[S.user] || 0;
  const level = levelFromXP(xp);
  const now   = new Date();
  const curMD = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const timeStr = now.toTimeString().slice(0,5);
  const [tH, tM] = timeStr.split(':').map(Number);
  const todayMinutes = tH * 60 + tM;
  const durMinutes = S.workoutDuration ? S.workoutDuration / 60 : null;

  // Check if current month is now a perfect month (all scheduled days logged up through today)
  let currentMonthPerfect = false;
  {
    const year = now.getFullYear(), month = now.getMonth();
    const totalDays = new Date(year, month + 1, 0).getDate();
    let ok = true; let hasSched = false;
    // Check every scheduled day this month that has already passed (or is today)
    // AND verify no scheduled days remain unlogged before today
    for (let d = 1; d <= totalDays; d++) {
      const date = new Date(year, month, d);
      const dStr = localDateStr(date);
      if (dStr > todayStr) break;
      if (PLAN_SHEETS[S.user][dateDay(date)] !== null) {
        hasSched = true;
        if (!S.loggedDates.has(dStr)) { ok = false; break; }
      }
    }
    // Only award if today IS the last scheduled day of this month (month complete)
    let lastSchedDay = null;
    for (let d = totalDays; d >= 1; d--) {
      const date = new Date(year, month, d);
      if (PLAN_SHEETS[S.user][dateDay(date)] !== null) { lastSchedDay = localDateStr(date); break; }
    }
    currentMonthPerfect = ok && hasSched && lastSchedDay === todayStr;
  }

  const checks = [
    // Workout milestones
    { id: 'first_workout',  earned: total >= 1 },
    { id: 'workouts_10',    earned: total >= 10 },
    { id: 'workouts_25',    earned: total >= 25 },
    { id: 'workouts_50',    earned: total >= 50 },
    { id: 'workouts_100',   earned: total >= 100 },
    { id: 'workouts_200',   earned: total >= 200 },
    { id: 'workouts_365',   earned: total >= 365 },
    // Streaks
    { id: 'streak_7',       earned: maxStreak >= 7 },
    { id: 'streak_14',      earned: maxStreak >= 14 },
    { id: 'streak_30',      earned: maxStreak >= 30 },
    { id: 'streak_60',      earned: maxStreak >= 60 },
    { id: 'streak_100',     earned: maxStreak >= 100 },
    { id: 'streak_200',     earned: maxStreak >= 200 },
    { id: 'streak_365',     earned: maxStreak >= 365 },
    // PRs
    { id: 'first_pr',       earned: prCount >= 1 },
    { id: 'prs_5',          earned: prCount >= 5 },
    { id: 'prs_10',         earned: prCount >= 10 },
    { id: 'prs_25',         earned: prCount >= 25 },
    { id: 'prs_50',         earned: prCount >= 50 },
    // Levels
    { id: 'level_10',       earned: level >= 10 },
    { id: 'level_25',       earned: level >= 25 },
    { id: 'level_50',       earned: level >= 50 },
    { id: 'level_75',       earned: level >= 75 },
    { id: 'level_100',      earned: level >= 100 },
    // Special — immediate triggers
    { id: 'workout_under_20', earned: durMinutes !== null && durMinutes < 20 },
    { id: 'early_bird',       earned: todayMinutes < 420 },
    { id: 'holiday_hero',     earned: isUSHoliday(todayStr) },
    { id: 'birthday_gains',   earned: !!getBirthday(S.user) && curMD === getBirthday(S.user) },
    // Consistency — perfect month (only if today completes it)
    { id: 'perfect_month',    earned: currentMonthPerfect },
    // January challenge
    { id: 'january_12',       earned: now.getMonth() === 0 && [...S.loggedDates].filter(d => d.startsWith(String(now.getFullYear()) + '-01')).length >= 12 },
  ];

  const newBadgeDefs = [];
  for (const c of checks) {
    if (c.earned && !existing[c.id]) {
      const def = BADGE_DEFS.find(b => b.id === c.id);
      if (def) {
        if (!S.badges[S.user]) S.badges[S.user] = {};
        S.badges[S.user][c.id] = todayStr;
        newBadgeDefs.push(def);
      }
    }
  }
  if (newBadgeDefs.length) setTimeout(() => showBadgeNotification(newBadgeDefs), 800);
}

// ---- WEEK VIEW ----
function renderWeekBody() {
  const dates = getWeekDates(S.weekOffset);
  const todayStr = localDateStr(new Date());
  const first = dates[0], last = dates[6];
  const weekLabel = first.getMonth() === last.getMonth()
    ? `${MONTHS[first.getMonth()]} ${first.getDate()}–${last.getDate()}, ${first.getFullYear()}`
    : `${MONTHS[first.getMonth()]} ${first.getDate()} – ${MONTHS[last.getMonth()]} ${last.getDate()}, ${first.getFullYear()}`;

  const TYPE_COLOR = { CORE: '#3fb950', ARMS: '#58a6ff', REST: '#d29922', BANDS: '#a371f7' };
  let rowsHTML = '';
  dates.forEach(date => {
    const dName = dateDay(date);
    const meta = PLAN_SHEETS[S.user][dName];
    const type = meta ? meta.type : 'REST';
    const workoutName = meta ? meta.name : 'Rest Day';
    const color = TYPE_COLOR[type] || '#8b949e';
    const dStr = localDateStr(date);
    const isToday = dStr === todayStr;
    const isPast  = date < new Date() && !isToday;
    const rowClass = isToday ? ' is-today' : isPast ? ' is-past' : '';
    const dur = meta ? (S.weekDurations[dStr] || '') : '';
    rowsHTML += `
    <div class="week-day-row${rowClass}" onclick="selectDay(${date.getTime()})">
      <div class="week-day-info">
        <div class="week-day-name">${DAYS_SHORT[date.getDay()]} ${fmtDate(date)}</div>
        <div class="week-day-subname">${workoutName}</div>
      </div>
      <div class="week-day-right">
        ${isToday ? '<span class="today-pill">Today</span>' : ''}
        ${dur ? `<span class="week-dur">${dur}</span>` : ''}
        <span class="badge" style="border-color:${color}55;color:${color}">${type}</span>
        ${meta ? '<span class="week-arrow">›</span>' : ''}
      </div>
    </div>`;
  });
  return `
  <div class="week-nav">
    <button class="week-nav-btn" onclick="S.weekOffset--;render()">‹</button>
    <button class="week-nav-link" onclick="navTo('calendar')" title="Open monthly calendar">${weekLabel} &nbsp;📅</button>
    <button class="week-nav-btn" onclick="S.weekOffset++;render()">›</button>
  </div>
  ${rowsHTML}`;
}

// ---- MONTH CALENDAR ----
function renderCalendarBody() {
  if (S.calendarYear === null) {
    const now = new Date();
    S.calendarYear = now.getFullYear();
    S.calendarMonth = now.getMonth();
  }
  const year = S.calendarYear, month = S.calendarMonth;
  const todayStr = localDateStr(new Date());
  const monthLabel = `${MONTHS[month]} ${year}`;

  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // Mon-first
  const totalDays = new Date(year, month + 1, 0).getDate();
  const prevTotal = new Date(year, month, 0).getDate();

  const cells = [];
  for (let i = firstDow - 1; i >= 0; i--)
    cells.push({ day: prevTotal - i, cur: false });
  for (let d = 1; d <= totalDays; d++) {
    const date = new Date(year, month, d);
    const dStr = localDateStr(date);
    const dName = dateDay(date);
    const scheduled = PLAN_SHEETS[S.user][dName] !== null;
    cells.push({ day: d, cur: true, dStr, isToday: dStr === todayStr,
                 logged: S.loggedDates.has(dStr), scheduled });
  }
  const tail = (7 - cells.length % 7) % 7;
  for (let d = 1; d <= tail; d++)
    cells.push({ day: d, cur: false });

  // Group into week rows; detect gold weeks (all scheduled days logged)
  const weeksHTML = [];
  for (let i = 0; i < cells.length; i += 7) {
    const wk = cells.slice(i, i + 7);
    const scheduledDays = wk.filter(c => c.cur && c.scheduled);
    const isGold = scheduledDays.length > 0 && scheduledDays.every(c => c.logged);
    const wkCells = wk.map(c => {
      if (!c.cur) return `<div class="cal-day other-month"><span class="cal-day-num">${c.day}</span></div>`;
      const cls = `cal-day${c.isToday ? ' is-today' : ''}${c.logged ? ' logged' : ''}`;
      return `<div class="${cls}">
        <span class="cal-day-num">${c.day}</span>
        ${c.logged ? '<span class="cal-check">✓</span>' : ''}
      </div>`;
    }).join('');
    weeksHTML.push(`<div class="cal-week${isGold ? ' gold' : ''}">${wkCells}</div>`);
  }

  const DOW = ['Mo','Tu','We','Th','Fr','Sa','Su'];
  return `
  <div class="week-nav">
    <button class="week-nav-btn" onclick="prevMonth()">‹</button>
    <div class="week-nav-title">${monthLabel}</div>
    <button class="week-nav-btn" onclick="nextMonth()">›</button>
  </div>
  <div class="cal-dow-row">${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}</div>
  <div class="cal-grid">${weeksHTML.join('')}</div>`;
}

function prevMonth() {
  if (S.calendarMonth === 0) { S.calendarMonth = 11; S.calendarYear--; }
  else S.calendarMonth--;
  render();
}
function nextMonth() {
  if (S.calendarMonth === 11) { S.calendarMonth = 0; S.calendarYear++; }
  else S.calendarMonth++;
  render();
}

  S.prs = {};
  S.modal = null;
  S.error = '';
  S.workoutStartTime = null;
  S.workoutDuration = 0;

  render();
