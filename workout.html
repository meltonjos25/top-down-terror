// ---- WORKOUT ----
function renderWorkout() {
  const w = S.workout;
  if (!w) return;

  if (w.type === 'REST') {
    const dateLabel = S.selectedDate ? `${S.day}, ${fmtDate(S.selectedDate)}` : S.day;
    app.innerHTML = `
    <div class="header"><div class="header-title">${dateLabel}</div><div class="header-right">${themeBtn()}<button class="header-user" onclick="S.screen='week';render()">← Week</button></div></div>
    <div class="rest-day">
      <div class="icon">😴</div>
      <h2>${w.name}</h2>
      <p>${dateLabel} is a rest day. Recovery is part of the program — enjoy it.</p>
      <button class="btn btn-secondary" style="max-width:280px;margin-top:16px" onclick="S.screen='week';render()">← Back to week</button>
    </div>`;
    return;
  }

  const total = w.exercises.length;
  const done = Object.values(S.logs).filter(l => l.done).length;
  const pct = total ? Math.round(done/total*100) : 0;

  const blocks = {};
  w.exercises.forEach((ex, i) => {
    if (!blocks[ex.block]) blocks[ex.block] = [];
    blocks[ex.block].push({ex, i});
  });

  let blockHTML = '';
  for (const [block, items] of Object.entries(blocks)) {
    const blockColor = {
      'Warm-Up':'#d29922','Block 1':'#58a6ff','Block 2':'#a371f7',
      'Finisher':'#f85149','Cool-Down':'#3fb950'
    }[block] || '#8b949e';
    blockHTML += `<div class="block-section"><div class="block-label" style="color:${blockColor}">${block}</div>`;
    items.forEach(({ex, i}) => {
      const log = S.logs[i];
      const isDone = log?.done;
      const prog = S.progression[ex.name];
      const target = prog?.target || ex.target;
      const progressed = prog?.progressed;
      const pr = S.prs[ex.name];
      blockHTML += `
      <div class="exercise-row${isDone ? ' done' : ''}${pr ? ' pr-row' : ''}" onclick="openModal(${i})">
        <div class="exercise-check${isDone ? ' checked' : ''}">${isDone ? '✓' : ''}</div>
        <div class="exercise-info">
          <div class="exercise-name">${ex.name}</div>
          <div class="exercise-meta">
            <span>${ex.sets}×</span><span>${target}</span>
            ${progressed ? '<span class="prog-badge">↑ PROGRESSED</span>' : ''}
            ${pr ? '<span class="pr-badge">🏆 PR</span>' : ''}
          </div>
        </div>
        <div class="exercise-arrow">›</div>
      </div>`;
    });
    blockHTML += '</div>';
  }

  const dateLabel = S.selectedDate ? `${S.day}, ${fmtDate(S.selectedDate)}` : S.day;
  const canSubmit = done > 0;
  app.innerHTML = `
  <div class="header">
    <div class="header-title">${dateLabel}</div>
    <div class="header-right">${themeBtn()}<button class="header-user" onclick="S.screen='week';render()">← Week</button></div>
  </div>
  <div class="body screen-enter">
    <div class="day-header">
      <div class="day-label">${dateLabel}</div>
      <div class="day-workout">${w.name}</div>
      <div class="day-meta">
        <span class="badge ${w.type.toLowerCase()}">${w.type}</span>
        <span class="badge">${w.duration}</span>
        <span class="badge">${done}/${total} done</span>
      </div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-label">${pct}% complete</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>
    ${blockHTML}
  </div>
  <div class="bottom-bar">
    <button class="btn btn-primary" onclick="S.screen='summary';render()" ${!canSubmit ? 'disabled style="opacity:.4"' : ''}>
      Review & Submit Workout →
    </button>
  </div>
  ${S.modal !== null ? renderModal() : ''}`;
}

// ---- MODAL ----
function openModal(i) {
  S.modal = i;
  clearInterval(S.timerInterval);
  S.timerRunning = false;
  const _ex = S.workout.exercises[i];
  const _parsed = parseTarget(S.progression[_ex.name]?.target || _ex.target);
  const _allTimers = parseAllTimers(S.progression[_ex.name]?.target || _ex.target);
  if (_parsed.unit === 'sec') {
    S.countdownTarget = _parsed.value;
  } else if (_allTimers.length > 0) {
    S.countdownTarget = _allTimers[0];
  } else {
    S.countdownTarget = null;
  }
  S.timerSec = S.countdownTarget !== null ? S.countdownTarget : 0;
  if (!S.logs[i]) {
    const ex = S.workout.exercises[i];
    const prog = S.progression[ex.name];
    const target = prog?.target || ex.target;
    const parsed = parseTarget(target);
    const prefill = parsed.value != null ? String(parsed.value) : '';
    S.logs[i] = { done: false, setsCompleted: 0, repsPerSet: Array(ex.sets).fill(prefill), notes: '', setsState: Array(ex.sets).fill(false) };
  }
  render();
}

function closeModal() {
  const overlay = document.querySelector('.modal-overlay');
  function _doClose() { S.modal = null; clearInterval(S.timerInterval); stopAudioKeepAlive(); S.timerRunning = false; S.countdownTarget = null; render(); }
  if (overlay) {
    overlay.classList.remove('sheet-enter');
    overlay.classList.add('sheet-exit');
    setTimeout(_doClose, 230);
  } else { _doClose(); }
}

function renderModal() {
  const i = S.modal;
  const ex = S.workout.exercises[i];
  const log = S.logs[i];
  const prog = S.progression[ex.name];
  const target = prog?.target || ex.target;
  const parsed = parseTarget(target);
  const allTimers = parseAllTimers(target);
  const isTimedByName = /plank|hold/i.test(ex.name);
  const isTimed = parsed.unit === 'sec' || (isTimedByName && parsed.unit === 'max') || allTimers.length > 0;
  const isMax = !isTimed && (parsed.unit === 'max' || parsed.unit === 'complex');

  const muscles = getMuscles(ex.name);
  const diagramHTML = muscles ? `
  <div class="muscle-diagram">
    <div class="muscle-legend">
      <span><span style="color:#f97316;font-size:14px">●</span> Primary</span>
      <span><span style="color:#eab308;font-size:14px">●</span> Secondary</span>
    </div>
    ${bodyDiagramSVG(muscles.primary, muscles.secondary)}
  </div>` : '';

  const setsHTML = Array.from({length: ex.sets}, (_, s) => {
    const checked = log.setsState?.[s];
    return `
    <div class="set-row">
      <div class="set-label">Set ${s+1}</div>
      <div class="set-input-wrap">
        <input class="set-input" type="number" min="0" value="${log.repsPerSet[s] || ''}" placeholder="${isMax ? '—' : (isTimed ? '0' : '0')}" oninput="setRep(${i},${s},this.value)">
        <span class="set-unit">${isTimed ? 'sec' : isMax ? 'reps' : parsed.unit === 'reps' ? 'reps' : ''}</span>
      </div>
      <button class="set-check${checked ? ' done' : ''}" onclick="toggleSet(${i},${s})">${checked ? '✓' : ''}</button>
    </div>`;
  }).join('');

  const timerSec = S.timerSec;
  const mm = String(Math.floor(timerSec/60)).padStart(2,'0');
  const ss = String(timerSec%60).padStart(2,'0');
  const timerClass = S.timerRunning ? 'running' : S.countdownTarget !== null ? (timerSec === 0 ? 'done-time' : '') : (timerSec > 0 ? 'done-time' : '');

  const fmtSec = v => v >= 60 ? `${Math.floor(v/60)}m${v%60 ? v%60+'s' : ''}` : `${v}s`;
  const presetsHTML = allTimers.length > 1 ? `
    <div class="timer-row" style="margin-bottom:4px">
      ${allTimers.map(v => `<button class="timer-btn" onclick="setTimerPreset(${v})"
        style="${S.countdownTarget===v?'background:var(--accent);color:#000;font-weight:700;':''}">${fmtSec(v)}</button>`).join('')}
    </div>` : '';

  const timerHTML = isTimed ? `
  <div class="timer-section">
    <div class="timer-target">Target: ${target}</div>
    ${presetsHTML}
    <div class="timer-display ${timerClass}">${mm}:${ss}</div>
    <div class="timer-row">
      <button class="timer-btn" onclick="timerToggle()">${S.timerRunning ? '⏸ Pause' : '▶ Start'}</button>
      <button class="timer-btn" onclick="timerReset()">↺ Reset</button>
      ${S.countdownTarget === null ? `<button class="timer-btn" onclick="timerUse(${i})">Use Time</button>` : ''}
    </div>
  </div>` : '';

  return `
  <div class="modal-overlay sheet-enter" onclick="handleOverlayClick(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <div class="modal-title">${ex.name}</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        ${ex.note ? `<div class="modal-note">${ex.note}</div>` : ''}
        ${ex.demo ? `<button class="modal-demo" onclick="openGifModal('${ex.demo.replace(/'/g,"\\'")}','${ex.name.replace(/'/g,"\\'")}')">▶ Watch Demo</button>` : ''}
        <div class="target-hint">Target: <strong>${ex.sets} × ${target}</strong>${prog?.progressed ? ' <span class="prog-badge">↑ PROGRESSED</span>' : ''}</div>
        ${diagramHTML}
        ${timerHTML}

function checkPR(i) {
  const ex = S.workout.exercises[i];
  const log = S.logs[i];
  if (!log?.done) return;
  if (ex.block !== 'Finisher') return;

  const parsed = parseTarget(ex.target);
  if (parsed.unit === 'interval' || parsed.unit === 'complex') return;

  const values = log.repsPerSet.map(v => parseFloat(v)).filter(v => !isNaN(v) && v > 0);
  if (!values.length) return;
  const sessionBest = Math.max(...values);
  const unit = (parsed.unit === 'sec' || /plank|hold/i.test(ex.name)) ? 'sec' : 'reps';

  // Find all-time best from history (excludes current session)
  let prevBest = null;
  S.history.forEach(row => {
    if (String(row[3]) !== ex.name) return;
    const vals = String(row[5] || '').split(',')
      .map(v => parseFloat(v.trim())).filter(v => !isNaN(v) && v > 0);
    if (vals.length) {
      const m = Math.max(...vals);
      if (prevBest === null || m > prevBest) prevBest = m;
    }
  });

  if (prevBest === null || sessionBest > prevBest) {
    S.prs[ex.name] = { value: sessionBest, prevBest, unit };
    return true;
  }
  return false;
}

function markDone(i) {

  saveProgress();

// ---- TIMER ----
// AudioContext is created on the user's Start tap (a real gesture) so iOS Safari
// allows it. We keep one instance alive and reuse it for every alarm.
let _audioCtx = null;
let _audioKeepAlive = null;
let _userCardAnim = false; // true only on the first render after navigating to the user screen
let _silenceSource = null;   // looping silent buffer — holds iOS from suspending AudioContext
let _msgPollInterval = null;
let _introSkipped = false;

function startMessagePolling(user) {
  stopMessagePolling();
  _msgPollInterval = setInterval(() => {
    if (S.user === user && S.screen !== 'setup' && S.screen !== 'user') {
      checkAndShowDedicationPopup(user);
    }
  }, 30000);
}

function stopMessagePolling() {
  if (_msgPollInterval) { clearInterval(_msgPollInterval); _msgPollInterval = null; }
}

function ensureAudioCtx() {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
  } catch(e) {}
  return _audioCtx;
}

// Keeps iOS from suspending AudioContext during a timer:
// 1. A continuously looping silent buffer (primary — holds the graph active with no gaps)
// 2. A periodic inaudible oscillator every 20s (belt-and-suspenders)
function startAudioKeepAlive() {
  stopAudioKeepAlive();
  if (_audioCtx) {
    try {
      const buf = _audioCtx.createBuffer(1, 512, _audioCtx.sampleRate);
      _silenceSource = _audioCtx.createBufferSource();
      _silenceSource.buffer = buf;
      _silenceSource.loop = true;
      _silenceSource.connect(_audioCtx.destination);
      _silenceSource.start();
    } catch(e) { _silenceSource = null; }
  }
  _audioKeepAlive = setInterval(() => {
    if (!_audioCtx) return;
    try {
      if (_audioCtx.state === 'suspended') _audioCtx.resume();
      const osc = _audioCtx.createOscillator();
      const gain = _audioCtx.createGain();
      osc.connect(gain);
      gain.connect(_audioCtx.destination);
      gain.gain.setValueAtTime(0.0001, _audioCtx.currentTime);
      osc.start(_audioCtx.currentTime);
      osc.stop(_audioCtx.currentTime + 0.01);
    } catch(e) {}
  }, 20000);
}

function stopAudioKeepAlive() {
  if (_audioKeepAlive) { clearInterval(_audioKeepAlive); _audioKeepAlive = null; }
  if (_silenceSource) {
    try { _silenceSource.stop(); _silenceSource.disconnect(); } catch(e) {}
    _silenceSource = null;
  }
}

function playAlarm() {
  const ctx = _audioCtx;
  if (!ctx) return;

  // Play 3 two-tone chimes (A5 + E6 = perfect fifth — clear but pleasant)
  const chime = (startTime) => {
    [[880, 0.55], [1320, 0.35]].forEach(([freq, vol]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(vol, startTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.55);
      osc.start(startTime);
      osc.stop(startTime + 0.57);
    });
  };

  const doPlay = () => {
    const t = ctx.currentTime + 0.05;
    chime(t);
    chime(t + 0.7);
    chime(t + 1.4);
  };

  // Resume first in case iOS suspended the context between tap and alarm,
  // then repeat the full alarm 3 times with a 2.5-second gap between each
  const fireOnce = () => {
    if (ctx.state === 'suspended') ctx.resume().then(doPlay); else doPlay();
    if (navigator.vibrate) navigator.vibrate([350, 150, 350, 150, 350]);
  };
  fireOnce();
  setTimeout(fireOnce, 2500);
  setTimeout(fireOnce, 5000);
}

function timerToggle() {
  if (S.timerRunning) {
    clearInterval(S.timerInterval);
    stopAudioKeepAlive();
    S.timerRunning = false;
  } else {
    ensureAudioCtx(); // Must happen on this user gesture so iOS allows audio later
    startAudioKeepAlive();
    S.timerRunning = true;
    S.timerInterval = setInterval(() => {
      if (S.countdownTarget !== null) {
        S.timerSec--;
        const d = document.querySelector('.timer-display');
        if (d) {
          const rem = Math.max(0, S.timerSec);
          d.textContent = `${String(Math.floor(rem/60)).padStart(2,'0')}:${String(rem%60).padStart(2,'0')}`;
          d.className = 'timer-display running';
        }
        if (S.timerSec <= 0) {
          clearInterval(S.timerInterval);
          S.timerRunning = false;
          S.timerSec = 0;
          const d = document.querySelector('.timer-display');
          if (d) { d.textContent = '00:00'; d.className = 'timer-display done-time'; }
          const btn = document.querySelector('.timer-btn');
          if (btn) btn.textContent = '▶ Start';
          playAlarm();
          // Stop keep-alive AFTER alarm so the silent buffer stays connected while the alarm plays
          setTimeout(stopAudioKeepAlive, 6000);
          return;
        }
      } else {
        S.timerSec++;
        const d = document.querySelector('.timer-display');
        if (d) {
          d.textContent = `${String(Math.floor(S.timerSec/60)).padStart(2,'0')}:${String(S.timerSec%60).padStart(2,'0')}`;
          d.className = 'timer-display running';
        }
      }
      const btn = document.querySelector('.timer-btn');
      if (btn) btn.textContent = '⏸ Pause';
    }, 1000);
  }
  render();
}

function timerReset() {
  clearInterval(S.timerInterval);
  stopAudioKeepAlive();
  S.timerSec = S.countdownTarget !== null ? S.countdownTarget : 0;
  S.timerRunning = false;
  render();
}

function setTimerPreset(sec) {

      return `<div style="background:var(--surface);border:1px solid ${isEarned?'var(--accent)':'var(--border)'};border-radius:12px;padding:14px;${isEarned?'':'opacity:.42'}${isChamp&&isEarned?';background:var(--accent-dim)':''}" >
        <div style="font-size:26px;line-height:1;margin-bottom:8px">${b.icon}</div>
        <div style="font-size:13px;font-weight:700;line-height:1.2;margin-bottom:4px">${b.name}</div>
        <div style="font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:6px">${b.desc}</div>
        ${isEarned
          ? `<div style="font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.3px">✓ ${isChamp ? 'Current champion' : badgeDateLabel(earnDate)}</div>`
          : `<div style="font-size:10px;color:var(--muted)">🔒 Locked</div>`}
      </div>`;
    }).join('');
    return `
    <div style="margin-top:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">${CAT_ICONS[cat]} ${cat}</div>
        <div style="font-size:11px;color:var(--muted)">${catEarned}/${badges.length}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${cards}</div>
    </div>`;
  }).join('');

  // Birthday config section
  const jBday = getBirthday('josh');
  const wBday = getBirthday('wife');
  const bdaySection = `
  <div style="margin-top:28px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px">
    <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px">🎂 Birthday Settings</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:13px;width:48px;font-weight:600">Josh</span>
        <input type="date" id="bday-josh" value="${jBday ? new Date().getFullYear() + '-' + jBday : ''}"
          style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;outline:none"
          oninput="saveBday('josh',this.value)">
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:13px;width:48px;font-weight:600">Wife</span>
        <input type="date" id="bday-wife" value="${wBday ? new Date().getFullYear() + '-' + wBday : ''}"
          style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;outline:none"
          oninput="saveBday('wife',this.value)">
      </div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">Year is ignored — only month & day matter.</div>
  </div>`;

  return `${sections}
  <div style="font-size:12px;color:var(--muted);text-align:center;margin-top:16px">${earnedCount} / ${total} badges earned</div>
  ${bdaySection}`;
}

function saveBday(user, val) {
  if (!val) { setBirthday(user, ''); return; }
  const m = val.match(/^\d{4}-(\d{2}-\d{2})$/);
  if (m) setBirthday(user, m[1]);
}

// ---- MESSAGES TAB ----
async function loadMessages() {
  if (S.messagesLoading) return;
  S.messagesLoading = true;
  render();
  try {
    const rows = await gasReadAll(MESSAGES_SHEET);
    const user = S.user;
    const deleted = new Set(JSON.parse(localStorage.getItem('deletedMsgs_' + user) || '[]'));
    const sent = [], received = [];
    rows.forEach(row => {
      const date = String(row[0] || '').trim();
      const time = String(row[1] || '').trim();
      const from = String(row[2] || '').trim().toLowerCase();
      const to   = String(row[3] || '').trim().toLowerCase();
      const text = String(row[4] || '').trim();
      if (!date || !text) return;
      const msg = { date, time, from, to, text };
      if (from === user) sent.unshift(msg);
      else if (to === user && !deleted.has(msgKey(msg))) received.unshift(msg);
    });
    S.messages = { sent, received };
  } catch(e) {
    S.messages = { sent: [], received: [] };
  }
  S.messagesLoaded = true;
  S.messagesLoading = false;
  render();
}

async function sendDedicationMessage() {
  const text = (S.messageDraft || '').trim();
  if (!text || S.messageSending) return;
  S.messageSending = true;
  S.messageSendError = '';
  render();
  try {
    const to      = S.user === 'josh' ? 'wife' : 'josh';
    const dateStr = localDateStr(new Date());
    const timeStr = new Date().toTimeString().slice(0, 5);
    await gasWrite(MESSAGES_SHEET, [[dateStr, timeStr, S.user, to, text]]);
    const newMsg = { date: dateStr, time: timeStr, from: S.user, to, text };
    if (!S.messages) S.messages = { sent: [], received: [] };
    S.messages.sent.unshift(newMsg);
    S.messageDraft = '';
  } catch(e) {
    S.messageSendError = 'Failed to send — please try again.';
  }
  S.messageSending = false;
  render();
}

function renderMessagesBody() {
  if (!S.messagesLoaded && !S.messagesLoading) loadMessages();

  const otherName = S.user === 'josh' ? 'Wife' : 'Josh';
  const msgs = S.messages || { sent: [], received: [] };

  const composerHTML = `
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:24px">
    <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px">Write to ${otherName}</div>
    <textarea id="msg-draft" rows="3"
      placeholder="Write something kind… (optional)"
      oninput="S.messageDraft=this.value"
      style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:14px;line-height:1.5;resize:vertical;outline:none;font-family:inherit">${escapeHtml(S.messageDraft)}</textarea>
    ${S.messageSendError ? `<div style="font-size:12px;color:var(--red);margin-top:6px">${S.messageSendError}</div>` : ''}
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px">
      <button class="btn btn-ghost btn-sm" onclick="S.messageDraft='';S.messageSendError='';render()">Clear</button>
      <button class="btn btn-primary btn-sm" onclick="sendDedicationMessage()" ${S.messageSending?'disabled':''}>
        ${S.messageSending ? 'Sending…' : 'Send ❤️'}
      </button>
    </div>
  </div>`;

  function msgCard(m, isSent) {
    const label = isSent
      ? `To ${S.user === 'josh' ? 'Wife' : 'Josh'}`
      : `From ${S.user === 'josh' ? 'Wife' : 'Josh'}`;
    const labelColor = isSent ? 'var(--blue)' : 'var(--accent)';
    const inner = `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div style="font-size:11px;font-weight:700;color:${labelColor};text-transform:uppercase;letter-spacing:.5px">${label}</div>
        <div style="font-size:11px;color:var(--muted)">${m.date}${m.time ? ' · ' + m.time : ''}</div>
      </div>
      <div style="font-size:14px;line-height:1.55;color:var(--text)">${escapeHtml(m.text)}</div>
    </div>`;
    if (isSent) return `<div style="margin-bottom:8px">${inner}</div>`;
    const key = escapeHtml(msgKey(m));
    return `<div class="swipe-row">
      <div class="swipe-delete-btn" onclick="deleteReceivedMsg('${key}')">
        <svg viewBox="0 0 24 24" fill="white" width="22" height="22"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6h14z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </div>
      <div class="swipe-content" style="touch-action:pan-y"
           ontouchstart="swipeStart(event,this)"
           ontouchmove="swipeMove(event,this)"
           ontouchend="swipeEnd(event,this)">
        ${inner}
      </div>
    </div>`;
  }

  const loading = S.messagesLoading
    ? `<div class="uploading" style="justify-content:flex-start;gap:10px;padding:12px 0"><div class="spinner"></div><span style="font-size:14px;color:var(--muted)">Loading messages…</span></div>`
    : '';

  const receivedHTML = !S.messagesLoaded ? loading
    : msgs.received.length
      ? msgs.received.map(m => msgCard(m, false)).join('')
      : `<div style="font-size:13px;color:var(--muted);text-align:center;padding:20px 0">No messages yet.</div>`;

  const sentHTML = !S.messagesLoaded ? ''
    : msgs.sent.length
      ? msgs.sent.map(m => msgCard(m, true)).join('')
      : `<div style="font-size:13px;color:var(--muted);text-align:center;padding:20px 0">Nothing sent yet.</div>`;

  return `<div style="padding:20px">
    <div style="font-size:20px;font-weight:800;margin-bottom:4px">❤️ Dedications</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:20px">Leave a note for your spouse</div>
    ${composerHTML}
    <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">Received</div>
    ${receivedHTML}
    ${S.messagesLoaded && msgs.sent.length >= 0 ? `
    <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;margin-top:20px">Sent</div>
    ${sentHTML}` : ''}
  </div>`;
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- SWIPE-TO-DELETE (messages) ----
let _swEl = null, _swX0 = 0, _swY0 = 0, _swDx = 0, _swLocked = false;

function swipeStart(e, el) {
  _swEl = el; _swX0 = e.touches[0].clientX; _swY0 = e.touches[0].clientY;
  _swDx = 0; _swLocked = false;
  el.style.transition = 'none';
}
function swipeMove(e, el) {
  if (_swEl !== el) return;
  const dx = e.touches[0].clientX - _swX0;
  const dy = e.touches[0].clientY - _swY0;
  if (!_swLocked) {
    if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
    if (Math.abs(dy) > Math.abs(dx)) { _swEl = null; return; }
    _swLocked = true;
  }
  e.preventDefault();
  _swDx = Math.min(0, Math.max(dx, -72));
  el.style.transform = `translateX(${_swDx}px)`;
}
function swipeEnd(e, el) {
  if (_swEl !== el) return;
  el.style.transition = 'transform 0.2s ease';
  if (_swDx < -36) { el.style.transform = 'translateX(-72px)'; }
  else { el.style.transform = 'translateX(0)'; _swDx = 0; }
  _swEl = null;
}

function msgKey(m) {
  return `${m.date}|${m.from}|${String(m.text).slice(0, 60)}`;
}
function deleteReceivedMsg(key) {
  if (!S.messages) return;
  S.messages.received = S.messages.received.filter(m => msgKey(m) !== key);
  const stored = JSON.parse(localStorage.getItem('deletedMsgs_' + S.user) || '[]');
  if (!stored.includes(key)) stored.push(key);
  localStorage.setItem('deletedMsgs_' + S.user, JSON.stringify(stored));
  render();
}

function checkAndShowDedicationPopup(user) {
  gasReadAll(MESSAGES_SHEET).then(rows => {
    const storageKey = `shownPopups_${user}`;
    const shown = new Set(JSON.parse(localStorage.getItem(storageKey) || '[]'));
    const unread = [];
    rows.forEach(row => {
      const date = normDateStr(String(row[0] || ''));
      const time = normTimeStr(String(row[1] || ''));
      const to   = String(row[3] || '').trim().toLowerCase();
      const text = String(row[4] || '').trim();
      if (to !== user || !date || !text) return;
      const from = String(row[2] || '').trim();
      const key  = `${date}|${time}|${from}|${text.slice(0, 60)}`;
      if (!shown.has(key)) unread.push({ date, time, from, text, key });
    });
    if (unread.length) {
      unread.forEach(m => shown.add(m.key));
      localStorage.setItem(storageKey, JSON.stringify([...shown]));
      setTimeout(() => showDedicationPopup(unread, user), 400);
    }
  }).catch(() => {});
}

function showDedicationPopup(messages, user) {
  if (document.querySelector('.dedication-popup')) return;
  const fromName = user === 'josh' ? 'Wife' : 'Josh';
  const el = document.createElement('div');
  el.className = 'badge-notif-overlay dedication-popup';
  const msgsHTML = messages.map(m => `
    <div style="background:var(--surface2);border-radius:10px;padding:14px;margin-bottom:8px;text-align:left">
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${m.date}${m.time ? ' · ' + m.time : ''}</div>
      <div style="font-size:15px;line-height:1.55;color:var(--text)">${escapeHtml(m.text)}</div>
    </div>`).join('');
  el.innerHTML = `
    <div class="badge-notif-card">
      <div style="font-size:40px;text-align:center;margin-bottom:8px">❤️</div>
      <div style="font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;text-align:center">From ${fromName}</div>
      <div style="font-size:20px;font-weight:800;margin-bottom:16px;text-align:center">${messages.length > 1 ? messages.length + ' new dedications' : 'A dedication for you'}</div>
      ${msgsHTML}
      <button onclick="this.closest('.badge-notif-overlay').remove()"
        style="width:100%;margin-top:18px;background:var(--accent);color:#000;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer">
        ❤️ Thank you!
      </button>
    </div>`;
  document.body.appendChild(el);
}

// ---- TOGETHER RECORDS ----
async function loadTogetherRecords() {
  if (S.togetherRecordsLoading || S.togetherRecordsLoaded) return;
  S.togetherRecordsLoading = true;
  render();
  try {
    const [joshRows, wifeRows] = await Promise.all([
      gasRead(JOSH_LOG_SHEET),
      gasRead(WIFE_LOG_SHEET)
    ]);
    const joshDates = new Set(joshRows.map(r => normDateStr(r[0])).filter(Boolean));
    const wifeDates = new Set(wifeRows.map(r => normDateStr(r[0])).filter(Boolean));
    const joshTotal = joshDates.size;
    const wifeTotal = wifeDates.size;
    const combinedTotal = [...joshDates].filter(d => wifeDates.has(d)).length;
    const currentStreak = calcCurrentCombinedStreak(joshDates, wifeDates);
    const bestStreak = calcBestCombinedStreak(joshDates, wifeDates);
    S.togetherRecords = { combinedTotal, joshTotal, wifeTotal, currentStreak, bestStreak };
    S.togetherRecordsLoaded = true;
    const dateStr = localDateStr(new Date());
    gasWrite(TOGETHER_RECORDS_SHEET, [[dateStr, joshTotal, wifeTotal, combinedTotal, currentStreak, bestStreak]]).catch(() => {});
  } catch(e) {}
  S.togetherRecordsLoading = false;
  render();
}

// ---- RECORDS TAB ----
async function loadRecordsData() {
  if (S.recordsLoading || S.recordsLoaded) return;
  S.recordsLoading = true;
  render();
  try {
    const logSheet = S.user === 'josh' ? JOSH_LOG_SHEET : WIFE_LOG_SHEET;
    const logRows = await gasRead(logSheet);

    const TRACKED = new Set(['Max Plank Hold', 'Push-Up Burnout', 'Pike Push-Up Burnout']);
    const TIMED_RECORDS = new Set(['Max Plank Hold']);

    const bests = {};
    logRows.forEach(row => {
      const name = String(row[3] || '').trim();
      const repsStr = String(row[5] || '').trim();
      if (!name || !repsStr || !TRACKED.has(name)) return;
      const vals = repsStr.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v) && v > 0);
      if (!vals.length) return;
      const best = Math.max(...vals);
      if (!bests[name] || best > bests[name].value) {
        const parsed = parseTarget(String(row[4] || ''));
        const unit = TIMED_RECORDS.has(name) ? 'sec' : (parsed.unit === 'sec' ? 'sec' : 'reps');
        bests[name] = { value: best, unit };
      }
    });
    S.allTimeRecords = bests;
    S.recordsLoaded = true;
  } catch(e) {}
  S.recordsLoading = false;
  render();
}

function renderRecordsBody() {
  if (!S.recordsLoaded && !S.recordsLoading) loadRecordsData();
  if (!S.togetherRecordsLoaded && !S.togetherRecordsLoading) loadTogetherRecords();

  // Personal Records section
  let personalHTML;
  if (S.recordsLoading) {
    personalHTML = `<div class="uploading"><div class="spinner"></div>Loading…</div>`;
  } else {
    const entries = Object.entries(S.allTimeRecords).sort((a,b) => a[0].localeCompare(b[0]));
    if (!entries.length) {
      personalHTML = `<div style="color:var(--muted);text-align:center;padding:24px 0;font-size:14px">No finisher records logged yet.</div>`;
    } else {
      personalHTML = entries.map(([name, r]) => {
        let valDisplay;
        if (r.unit === 'sec') {
          const m = Math.floor(r.value / 60);
          const s = Math.round(r.value % 60);
          valDisplay = m > 0
            ? `${m}<span style="font-size:12px;color:var(--muted);font-weight:600">m</span> ${String(s).padStart(2,'0')}<span style="font-size:12px;color:var(--muted);font-weight:600">s</span>`
            : `${s}<span style="font-size:12px;color:var(--muted);font-weight:600">s</span>`;
        } else {
          valDisplay = `${r.value} <span style="font-size:12px;color:var(--muted);font-weight:600">${r.unit}</span>`;
        }
        return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px">
          <div style="font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</div>
          <div style="font-size:18px;font-weight:800;color:var(--accent);flex-shrink:0">${valDisplay}</div>
        </div>`;
      }).join('');
    }
  }

  // Together Records section
  let togetherHTML;
  if (S.togetherRecordsLoading) {
    togetherHTML = `<div class="uploading"><div class="spinner"></div>Loading…</div>`;
  } else if (!S.togetherRecords) {
    togetherHTML = `<div style="color:var(--muted);text-align:center;padding:24px 0;font-size:14px">No together records yet.</div>`;
  } else {
    const tr = S.togetherRecords;
    const streakColor = tr.currentStreak > 0 ? 'var(--accent)' : 'var(--muted)';
    togetherHTML = `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px">
        <div>
          <div style="font-size:14px;font-weight:600">Combined Workouts</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">Days you both logged a workout</div>
        </div>
        <div style="font-size:22px;font-weight:800;color:var(--accent);flex-shrink:0">${tr.combinedTotal} <span style="font-size:12px;color:var(--muted);font-weight:600">total</span></div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px">
        <div style="font-size:14px;font-weight:600;margin-bottom:10px">Combined Streak</div>
        <div style="display:flex;gap:10px">
          <div style="flex:1;background:var(--surface2);border-radius:8px;padding:10px 12px;text-align:center">
            <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">Current</div>
            <div style="font-size:26px;font-weight:800;color:${streakColor}">${tr.currentStreak}</div>
            <div style="font-size:11px;color:var(--muted)">${tr.currentStreak === 1 ? 'day' : 'days'}</div>
          </div>
          <div style="flex:1;background:var(--surface2);border-radius:8px;padding:10px 12px;text-align:center">
            <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">All-Time Best</div>
            <div style="font-size:26px;font-weight:800;color:var(--yellow)">${tr.bestStreak}</div>
            <div style="font-size:11px;color:var(--muted)">${tr.bestStreak === 1 ? 'day' : 'days'}</div>
          </div>
        </div>
      </div>`;
  }

  return `
  <div style="padding:20px;display:flex;flex-direction:column;gap:24px">
    <div>
      <div style="font-size:18px;font-weight:800;margin-bottom:12px">Personal Records</div>
      <div style="display:flex;flex-direction:column;gap:8px">${personalHTML}</div>
    </div>
    <div>
      <div style="font-size:18px;font-weight:800;margin-bottom:12px">Together Records 👨‍❤️‍👩</div>
      <div style="display:flex;flex-direction:column;gap:8px">${togetherHTML}</div>
    </div>
  </div>`;
}

  _introSkipped = false;
  app.innerHTML = `
  <div class="intro-screen" id="intro-screen" onclick="skipIntro()">
    <video id="intro-video" src="Together App Animation.mp4"
      autoplay muted playsinline webkit-playsinline preload="auto">
    </video>
  </div>`;
  const vid = document.getElementById('intro-video');
  vid.addEventListener('ended', skipIntro);
  // If autoplay is blocked by the browser, skip straight through
  vid.play().catch(() => skipIntro());
}

function skipIntro() {
  if (_introSkipped) return;
  _introSkipped = true;
  const el = document.getElementById('intro-screen');
  const proceed = () => {
    if (S.gasUrl) { _userCardAnim = true; S.screen = 'user'; }
    else S.screen = 'setup';
    render();
  };
  if (el) {
    el.classList.add('fading');
    setTimeout(proceed, 380);
  } else {
    proceed();
  }
}
