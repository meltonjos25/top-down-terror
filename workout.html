  'Fast Glute Bridge': 'Muscles Targeted: gluteus maximus and hamstrings. Movement Benefit: develops hip extension rate of force development in the supine position to build reactive glute power for athletic movements. Sport Application: Sprinting — builds the glute explosiveness that drives propulsive force into the track during the drive phase.',
  'Fast Heel Slide': 'Muscles Targeted: hip flexors, iliopsoas, and rectus femoris. Movement Benefit: trains rapid hip flexion in a supine position to develop the speed of the hip flexors for walking and running stride recovery. Sport Application: Soccer — improves the foot speed needed to quickly draw the leg forward to strike a fast incoming ball.',
  'Fast Pike Push-Up': 'Muscles Targeted: anterior deltoid, triceps brachii, and upper trapezius. Movement Benefit: trains overhead pressing speed by moving quickly through a pike push-up to develop shoulder power endurance. Sport Application: Volleyball — builds the shoulder speed needed for a rapid arm swing on a quick-set attack.',
  'Figure-4 Glute Stretch': 'Muscles Targeted: piriformis, gluteus medius, and hip external rotators. Movement Benefit: stretches the external hip rotators to relieve hip impingement and restore femoral internal rotation range of motion. Sport Application: Cycling — releases the piriformis tightness that develops from sustained hip external rotation in a cycling posture.',
  'Figure-4 Stretch': 'Muscles Targeted: piriformis, hip external rotators, and gluteus medius. Movement Benefit: provides a targeted stretch to the posterior hip to improve femoral range of motion and reduce sciatic tension. Sport Application: Running — reduces the hip tightness that shifts loading to the IT band during long training runs.',
  'Forearm Plank': 'Muscles Targeted: transverse abdominis, rectus abdominis, and erector spinae. Movement Benefit: develops anti-extension core endurance by holding a rigid plank on the forearms to build sustained midline stability. Sport Application: Surfing — builds the trunk stiffness needed to maintain board control through choppy whitewater sections.',
  'Full Body Tension Hold': 'Muscles Targeted: pectoralis major, quadriceps, erector spinae, and transverse abdominis. Movement Benefit: develops the ability to maximally contract all major muscle groups simultaneously to create whole-body stiffness and force transfer. Sport Application: Powerlifting — builds the total-body tension needed to maintain a rigid structure during a maximal squat.',
  'Full Integration Circuit': 'Muscles Targeted: shoulders, core, hips, and legs across multiple joint complexes. Movement Benefit: chains multiple movement patterns without rest to develop neuromuscular coordination and metabolic conditioning simultaneously. Sport Application: CrossFit — builds the work capacity to cycle through complex multi-joint movements under fatigue.',
  'Gentle Spinal Twist': 'Muscles Targeted: erector spinae, rotators, and external oblique. Movement Benefit: restores thoracic and lumbar rotation range of motion to decompress the spine and relieve tightness after training. Sport Application: Golf — maintains the rotational mobility that allows a full shoulder turn without lower back strain.',
  'Glute Bridge': 'Muscles Targeted: gluteus maximus and hamstrings. Movement Benefit: activates and strengthens the hip extensors in a supine position to build the foundation of posterior chain power. Sport Application: Sprinting — develops the glute strength that generates horizontal propulsive force in each push-off.',
  'Glute Bridge March': 'Muscles Targeted: gluteus maximus, hamstrings, and contralateral hip flexors. Movement Benefit: challenges the glute bridge by alternating leg lifts to add anti-extension and anti-rotation demand on the planted side. Sport Application: Running — builds the single-leg hip stability that prevents lateral pelvic drop on each ground contact.',
  'Glute Bridge with Band': 'Muscles Targeted: gluteus maximus, gluteus medius, and hamstrings. Movement Benefit: adds hip abduction resistance to the glute bridge to simultaneously target the glute max and glute med for complete hip development. Sport Application: Volleyball — develops the hip complex needed for a powerful vertical jump from a bilateral stance.',
  'Glute Bridge with Band Blue': 'Muscles Targeted: gluteus maximus, gluteus medius, and hamstrings. Movement Benefit: loads the glute bridge pattern with heavy band resistance around the knees to maximize glute activation and hip abduction strength. Sport Application: Sprinting — builds the complete glute complex needed to drive maximal force into the ground at toe-off.',
  'Glute Bridge with Band Green': 'Muscles Targeted: gluteus maximus and gluteus medius. Movement Benefit: combines hip extension and abduction demands in a moderate-resistance glute bridge to develop balanced hip strength. Sport Application: Basketball — develops the hip power for a vertical jump while maintaining knee alignment under lateral forces.',
  'Glute Bridge with Hold': 'Muscles Targeted: gluteus maximus, hamstrings, and erector spinae. Movement Benefit: adds an isometric hold at the top of the bridge to increase time under tension and improve hip extensor endurance. Sport Application: Cycling — builds the sustained glute activation needed to maintain power output in the saddle on long climbs.',
  'Happy Baby Pose': 'Muscles Targeted: adductors, hip external rotators, and lumbar erectors. Movement Benefit: provides a passive stretch to the inner hip and lower back while decompressing the sacroiliac joint. Sport Application: Yoga — restores the hip opening flexibility needed for deep external rotation poses like pigeon or lotus.',
  'High Knees': 'Muscles Targeted: hip flexors, quadriceps, and gastrocnemius. Movement Benefit: develops hip flexor speed and cardiovascular conditioning through rapid alternating knee drives. Sport Application: Soccer — builds the leg speed needed for a short acceleration burst to beat a defender to the ball.',
  'Hip 90/90 Switch': 'Muscles Targeted: hip external rotators, adductors, and piriformis. Movement Benefit: dynamically improves hip internal and external rotation range of motion by actively transitioning between bilateral 90/90 hip positions. Sport Application: Martial arts — builds the hip mobility to quickly reposition the feet and hips when transitioning between stances.',
  'Hip Circle': 'Muscles Targeted: hip external rotators, adductors, and gluteus medius. Movement Benefit: mobilizes the hip joint through a full rotational range of motion to lubricate the joint and activate the surrounding muscles. Sport Application: Soccer — warms up the hips for the multidirectional demands of dribbling and cutting.',
  'Hip Circle Standing': 'Muscles Targeted: gluteus medius, hip flexors, and hip external rotators. Movement Benefit: activates the hip abductors and rotators in a standing position to prepare the hip complex for athletic loading. Sport Application: Tennis — primes the hips for the lateral steps and split-step transitions used during active rallies.',
  'Hip Circles': 'Muscles Targeted: hip flexors, adductors, and gluteus medius. Movement Benefit: increases hip joint mobility and activates the stabilizers around the femoral head to prepare for single-leg and multidirectional movements. Sport Application: Gymnastics — warms up the hips for the high-amplitude leg swings used on the uneven bars.',
  'Hip Circles Standing': 'Muscles Targeted: gluteus medius, hip external rotators, and hip flexors. Movement Benefit: dynamically mobilizes the standing hip through a circular range to activate the abductors and prepare for unilateral loading. Sport Application: Running — warms up the hip complex for the demands of single-leg push-off mechanics.',
  'Hip Flexor Lunge Stretch': 'Muscles Targeted: iliopsoas, rectus femoris, and anterior hip capsule. Movement Benefit: lengthens the hip flexors from a kneeling lunge position to restore hip extension range of motion and reduce anterior pelvic tilt. Sport Application: Sprinting — improves stride length by allowing full hip extension during the push-off phase.',
  'Hip Hinge with Band': 'Muscles Targeted: hamstrings, gluteus maximus, and erector spinae. Movement Benefit: teaches and reinforces the hip hinge movement pattern with band feedback to develop proper posterior chain loading mechanics. Sport Application: Weightlifting — builds the hip hinge mechanics needed for an efficient clean or deadlift setup.',
  'Hollow Body Hold': 'Muscles Targeted: transverse abdominis, rectus abdominis, and hip flexors. Movement Benefit: develops the anterior chain tension and anti-extension core strength fundamental to gymnastics and all overhead athletic movement. Sport Application: Gymnastics — builds the body tension required to maintain shape on the bar, beam, or during floor tumbling.',
  'Hollow Body Hold Bent Knees': 'Muscles Targeted: transverse abdominis, rectus abdominis, and hip flexors. Movement Benefit: introduces the hollow body position with bent knees to reduce leverage and build anti-extension core strength progressively. Sport Application: Gymnastics — develops the foundational body tension needed before progressing to a straight-leg hollow hold on apparatus.',
  'Hollow Body Rock': 'Muscles Targeted: transverse abdominis, rectus abdominis, and hip flexors. Movement Benefit: develops dynamic anterior chain tension by rocking in a hollow body position, building both hold strength and the rhythm of an arch-to-hollow swing. Sport Application: Gymnastics — teaches the pendulum mechanics used for kipping pull-ups and bar muscle-ups.',
  'Hollow Body Rock Fast': 'Muscles Targeted: transverse abdominis, rectus abdominis, and hip flexors. Movement Benefit: accelerates the hollow body rock to develop the rhythmic power and body tension used for dynamic bar swings. Sport Application: Gymnastics — builds the swing momentum and body stiffness required for a giant swing on the high bar.',
  'Inchworm Walk-Out': 'Muscles Targeted: hamstrings, anterior deltoid, and transverse abdominis. Movement Benefit: dynamically stretches the hamstrings while building shoulder stability as the hands walk forward to a plank position. Sport Application: Soccer — prepares the hamstrings for sprinting demands and warms up the shoulder girdle before training.',
  'Inverted Row Underhand': 'Muscles Targeted: biceps brachii, latissimus dorsi, and rhomboids. Movement Benefit: uses a supinated grip to shift emphasis toward the biceps and lower lat during horizontal rowing for balanced pulling development. Sport Application: Rock climbing — builds the supinated pulling strength used when gripping a jug hold and pulling through an overhang.',
  'Inverted Row Wide Grip': 'Muscles Targeted: posterior deltoid, rhomboids, and middle trapezius. Movement Benefit: widens hand position to target the rear deltoid and upper traps more effectively during horizontal pulling. Sport Application: Rowing — develops the scapular retraction strength needed to finish a stroke with the handle pulled to the lower chest.',
  'Inverted Row with Pause': 'Muscles Targeted: latissimus dorsi, rhomboids, and biceps brachii. Movement Benefit: adds a hold at the top of the inverted row to build isometric horizontal pulling strength and scapular retraction endurance. Sport Application: Wrestling — develops the grip and pulling strength to maintain a clinch hold against an opponent\'s resistance.',
  'Isometric Table Inverted Row Hold': 'Muscles Targeted: latissimus dorsi, rhomboids, and biceps brachii. Movement Benefit: develops isometric horizontal pulling strength by holding the top position of an inverted row for time. Sport Application: Rock climbing — builds the lock-off strength needed to hold a body position while evaluating the next move.',
  'Jefferson Curl with Band Tan': 'Muscles Targeted: erector spinae, hamstrings, and thoracic extensors. Movement Benefit: builds spinal flexion strength and sequential vertebral mobility by performing a slow weighted forward fold with intentional segmental movement. Sport Application: Weightlifting — develops the spinal strength to safely round under a heavy barbell and return to extension.',
  'Jumping Jacks': 'Muscles Targeted: gluteus medius, deltoids, and gastrocnemius. Movement Benefit: elevates heart rate and activates the hip abductors and shoulders simultaneously as a cardiovascular primer. Sport Application: Basketball — warms up the lateral hip abductors and shoulder elevation needed for defensive positioning.',
  'Jump Squat Hold': 'Muscles Targeted: quadriceps, gluteus maximus, and gastrocnemius. Movement Benefit: combines explosive jumping with an isometric hold landing to develop both power and deceleration strength simultaneously. Sport Application: Volleyball — builds the jump power and landing control needed for a quick-set attack with a soft landing.',
  'Jump Squat to Plank': 'Muscles Targeted: quadriceps, gluteus maximus, anterior deltoid, and transverse abdominis. Movement Benefit: trains the transition from explosive lower body power to upper body stability in a single flowing movement. Sport Application: Basketball — develops the ability to sprint for a loose ball and immediately brace into a floor dive.',
  'Jump and Press Band Blue': 'Muscles Targeted: quadriceps, gluteus maximus, anterior deltoid, and triceps brachii. Movement Benefit: combines explosive leg power with overhead arm pressing to develop full-body coordination and power expression. Sport Application: Basketball — builds the simultaneous leg jump and arm extension needed for a jump-shot over a defender.',
  'Kneeling Hip Flexor Stretch': 'Muscles Targeted: iliopsoas, rectus femoris, and anterior hip capsule. Movement Benefit: targets the hip flexors from a kneeling position to restore the hip extension range of motion needed for optimal running mechanics. Sport Application: Sprinting — lengthens the iliopsoas to allow full hip extension at push-off, improving stride length and speed.',
  'Kneeling Hip Hinge': 'Muscles Targeted: gluteus maximus, hamstrings, and erector spinae. Movement Benefit: teaches the hip hinge pattern from a kneeling position to isolate the posterior chain without lower leg compensation. Sport Application: Weightlifting — builds the hip hinge mechanics and glute engagement fundamental to a clean or snatch pull.',
  'Kneeling Pallof Press-Hold': 'Muscles Targeted: obliques, transverse abdominis, and gluteus medius. Movement Benefit: develops anti-rotation core stability from a kneeling position by pressing a band straight out and holding, removing lower body compensation to isolate trunk stiffness. Sport Application: Golf — builds the rotational bracing strength that protects the spine and transfers power through the hips during a full swing.',
  'Knees-to-Chest Hug': 'Muscles Targeted: gluteus maximus and lumbar erectors. Movement Benefit: provides a passive stretch to the lower back and hips to relieve compressive stress after training. Sport Application: Running — reduces lower back tightness after long runs by decompressing the lumbar spine.',
  'L-Sit Hold on Chairs': 'Muscles Targeted: hip flexors, triceps brachii, and rectus abdominis. Movement Benefit: develops extreme hip flexor and pressing strength by holding the legs parallel to the floor while supporting the body on the arms. Sport Application: Gymnastics — builds the prerequisite strength for L-sit to handstand transitions on the floor or parallel bars.',
  'Lateral Bound to Plank': 'Muscles Targeted: gluteus medius, quadriceps, and anterior deltoid. Movement Benefit: trains lateral explosive power followed immediately by upper body stabilization to develop reactive athletic coordination. Sport Application: Basketball — builds the lateral power and quick deceleration needed to stop after an explosive side-cut.',
  'Lateral Lunge': 'Muscles Targeted: adductors, quadriceps, and gluteus medius. Movement Benefit: develops single-leg lateral strength and adductor flexibility to improve change-of-direction mechanics and lateral stability. Sport Application: Tennis — builds the hip and leg strength to push hard off a wide lateral step to reach a ball.',
  'Lateral Plank Walk': 'Muscles Targeted: anterior deltoid, serratus anterior, transverse abdominis, and obliques. Movement Benefit: trains dynamic shoulder stability and anti-rotation core control during lateral plank stepping. Sport Application: Wrestling — develops the shoulder stability and core stiffness needed to resist being pinned on the mat.',
  'Lateral Step to Plank': 'Muscles Targeted: gluteus medius, quadriceps, anterior deltoid, and transverse abdominis. Movement Benefit: combines a lateral step into a plank to train the transition from lateral movement to upper body stabilization. Sport Application: Soccer — develops the ability to quickly step wide defensively and immediately brace to redirect pressure.',
  'Lying Hip Circles': 'Muscles Targeted: hip flexors, hip external rotators, and gluteus medius. Movement Benefit: mobilizes the hip joint in the supine position through slow circles to improve range of motion with no spinal loading. Sport Application: Yoga — prepares the hips for deep hip-opening poses by gently circulating the femoral head.',
  'Lying Knee Rocks': 'Muscles Targeted: lumbar erectors, piriformis, and hip external rotators. Movement Benefit: gently mobilizes the lumbar spine and hip external rotators by rocking the knees side to side in a supine position. Sport Application: Golf — releases the lumbar rotation restriction that limits a full shoulder turn in a backswing.',
  'Lying Knee-to-Chest': 'Muscles Targeted: gluteus maximus and lumbar erectors. Movement Benefit: provides a single-leg hip and low back stretch in the supine position to reduce tension after posterior chain loading. Sport Application: Running — releases hip and lower back tightness that accumulates during extended distance running.',
  'Lying Spinal Twist': 'Muscles Targeted: thoracic erectors, piriformis, and obliques. Movement Benefit: restores thoracic and lumbar rotation by passively twisting the spine in the supine position to relieve tightness after exercise. Sport Application: Golf — maintains the thoracic rotation mobility that generates clubhead speed during a full swing.',
  'Marching In Place': 'Muscles Targeted: iliopsoas, quadriceps, and gluteus maximus. Movement Benefit: activates the hip flexors and extensors rhythmically to warm up the locomotion pattern and increase circulation. Sport Application: Running — primes the hip flexor cycling pattern used during ground contact and stride recovery.',
  'Max Archer Push-Ups': 'Muscles Targeted: pectoralis major, anterior deltoid, serratus anterior, and triceps brachii. Movement Benefit: tests and develops maximum unilateral pressing strength by performing as many archer push-ups as possible in a controlled manner. Sport Application: Wrestling — measures the single-arm push strength used to drive an opponent off balance in a collar tie.',
  'Max Band Glute Bridge Hold Blue': 'Muscles Targeted: gluteus maximus, hamstrings, and hip external rotators. Movement Benefit: tests isometric hip extensor endurance under heavy band load to build sustained glute activation capacity. Sport Application: Sprinting — develops the sustained glute engagement needed to maintain top-end speed over a 200-meter effort.',
  'Max Band Squat Slow Blue': 'Muscles Targeted: quadriceps, gluteus maximus, and hamstrings. Movement Benefit: tests and builds maximum lower-body strength endurance under heavy accommodating resistance with a slow tempo. Sport Application: Cycling — develops the quad and glute endurance needed to sustain high power output across a long mountain stage.',
  'Max Bear Hold': 'Muscles Targeted: anterior deltoid, serratus anterior, transverse abdominis, and quadriceps. Movement Benefit: tests maximum full-body tension endurance by holding the quadruped hover for as long as possible. Sport Application: Gymnastics — builds the body tension endurance required to maintain a static shape during a held skill.',
  'Max Explosive Push-Ups': 'Muscles Targeted: pectoralis major, triceps brachii, and anterior deltoid. Movement Benefit: develops and measures maximum explosive pressing power through all-out push-ups performed to failure. Sport Application: Football — builds the explosive chest strength used to create immediate separation from a block at the line.',
  'Max Effort Integration': 'Muscles Targeted: pectorals, lats, core, and glutes across total-body patterns. Movement Benefit: demands peak neuromuscular output by combining multiple exercises into a maximum-effort circuit. Sport Application: Military fitness — tests and develops the full-body stamina needed to perform under physical stress for extended periods.',
  'Max L-Sit Hold on Chairs': 'Muscles Targeted: hip flexors, triceps brachii, and rectus abdominis. Movement Benefit: tests and develops maximum hip flexor and tricep endurance in the L-sit position to build the prerequisite strength for advanced calisthenics. Sport Application: Gymnastics — builds the L-sit hold time needed to perform a transition to press handstand on the parallel bars.',
  'Max Reverse Crunches': 'Muscles Targeted: rectus abdominis, hip flexors, and transverse abdominis. Movement Benefit: tests and develops lower abdominal and hip flexor endurance by curling the hips toward the chest repeatedly to failure. Sport Application: Gymnastics — builds the lower abdominal and hip flexor strength needed for leg raise progressions on bars or rings.',
  'Max Single Arm Band Glute Bridge': 'Muscles Targeted: gluteus maximus, hamstrings, and obliques. Movement Benefit: challenges hip extension strength with an asymmetric band load requiring anti-rotation core engagement to maintain pelvic stability. Sport Application: Sprinting — develops the unilateral glute strength that produces force in each independent push-off.',
  'Max Single Arm Modified Plank': 'Muscles Targeted: anterior deltoid, serratus anterior, obliques, and transverse abdominis. Movement Benefit: tests maximum unilateral shoulder stability and anti-rotation core endurance from the modified plank position. Sport Application: Swimming — builds the shoulder and core connection that maintains body alignment during a unilateral arm pull.',
  'Max Single Arm Push-Up': 'Muscles Targeted: pectoralis major, triceps brachii, and anterior deltoid. Movement Benefit: tests and develops maximum unilateral pressing strength by performing single-arm push-ups to the full range of failure. Sport Application: Wrestling — measures the single-arm strength used to post and redirect an opponent during a clinch.',
  'Max Single Leg Glute Bridge': 'Muscles Targeted: gluteus maximus and hamstrings. Movement Benefit: tests unilateral hip extensor endurance by performing maximum reps of a single-leg glute bridge to assess posterior chain imbalances. Sport Application: Running — identifies and addresses left-right hip extension asymmetries that affect stride efficiency.',
  'Max Slow Negative Push-Ups': 'Muscles Targeted: pectoralis major, anterior deltoid, and triceps brachii. Movement Benefit: builds maximum eccentric pressing strength by lowering as slowly as possible to the floor under full body control. Sport Application: Gymnastics — develops the pressing eccentric control needed for a controlled lowering from a planche support.',
  'Max Slow Negative Push-Ups Knees Down': 'Muscles Targeted: pectoralis major, anterior deltoid, and triceps brachii. Movement Benefit: develops eccentric pressing strength from a modified position, building the lowering control to progress to full negative push-ups. Sport Application: Tennis — builds the shoulder and arm control needed to absorb the impact of a low-ball volley.',
  'Max Typewriter Push-Ups': 'Muscles Targeted: pectoralis major, anterior deltoid, serratus anterior, and triceps brachii. Movement Benefit: develops lateral chest and shoulder strength by sliding horizontally during the push-up to load the chest unilaterally. Sport Application: Rock climbing — builds the shoulder traversal strength used to move laterally across a traverse wall.',
  'Modified Archer Push-Up': 'Muscles Targeted: pectoralis major, anterior deltoid, serratus anterior, and triceps brachii. Movement Benefit: introduces unilateral pressing demands with a modified range of motion to build strength for progressing to the full archer push-up. Sport Application: Wrestling — develops the asymmetric pressing strength used to post on one arm during a mat return.',
  'Modified Burpee': 'Muscles Targeted: pectoralis major, quadriceps, and anterior deltoid. Movement Benefit: builds full-body conditioning through a lower-impact burpee variation that develops cardiovascular endurance and multi-joint strength. Sport Application: Soccer — builds the total-body conditioning needed to sprint repeatedly throughout a 90-minute match.',
  'Modified Burpee No Jump': 'Muscles Targeted: pectoralis major, quadriceps, and anterior deltoid. Movement Benefit: develops full-body strength endurance through a step-back burpee variation that reduces joint impact while maintaining conditioning demand. Sport Application: Cycling — builds the aerobic base and leg strength needed for high-volume training without joint stress.',
  'Modified Copenhagen Plank': 'Muscles Targeted: adductors and obliques. Movement Benefit: provides an accessible entry to the Copenhagen plank to begin developing adductor and lateral core strength with greater stability. Sport Application: Soccer — develops the groin stability needed to resist adductor strain during kicking and change-of-direction.',
  'Modified Copenhagen Plank Knee Down': 'Muscles Targeted: adductors, obliques, and hip flexors. Movement Benefit: builds adductor and lateral core strength in the most supported Copenhagen plank variation for developing groin stability. Sport Application: Hockey — develops the foundational groin strength needed for wide-stride skating without adductor strain.',
  'Modified Clamshell': 'Muscles Targeted: gluteus medius and hip external rotators. Movement Benefit: activates the hip abductors with a reduced range of motion to build the recruitment pattern for progressing to a full clamshell. Sport Application: Running — develops the hip abductor activity that prevents knee valgus during ground contact.',
  'Mountain Climber Tabata': 'Muscles Targeted: hip flexors, transverse abdominis, anterior deltoid, and quadriceps. Movement Benefit: develops cardiovascular endurance, hip flexor speed, and dynamic core stability through interval-based mountain climbers. Sport Application: Soccer — builds the running engine and core control needed to press and chase for a full 90 minutes.',
  'Neck Rolls': 'Muscles Targeted: upper trapezius, levator scapulae, and scalenes. Movement Benefit: gently mobilizes the cervical spine and releases neck tension accumulated from training and daily postural demands. Sport Application: Wrestling — maintains cervical flexibility to safely absorb contact forces during a neck bridge defense.',
  'One Arm Hang on Table Edge': 'Muscles Targeted: latissimus dorsi, biceps brachii, and grip muscles. Movement Benefit: builds unilateral grip endurance and lat strength by hanging from a single arm in a passive stretch position. Sport Application: Rock climbing — develops the single-arm hang strength needed to hold a difficult crimp while reaching with the other hand.',
  'Pike Push-Up': 'Muscles Targeted: anterior deltoid, triceps brachii, and upper trapezius. Movement Benefit: targets the shoulder pressing muscles through a body-weight overhead motion using the hips-high pike position to increase shoulder loading. Sport Application: Gymnastics — builds the shoulder pressing strength needed for handstand push-up progressions.',
  'Pike Push-Up Hold': 'Muscles Targeted: anterior deltoid, serratus anterior, and triceps brachii. Movement Benefit: develops isometric overhead pushing strength by holding at the bottom of the pike push-up with elbows bent. Sport Application: Gymnastics — builds the bottom-position shoulder strength needed to control a planche or L-sit to handstand.',
  'Pike Push-Up Negative': 'Muscles Targeted: anterior deltoid, triceps brachii, and upper trapezius. Movement Benefit: develops eccentric overhead pressing strength through a slow controlled descent to build shoulder stability for full pike push-ups. Sport Application: Gymnastics — builds the overhead lowering control needed for a press to headstand from a standing pike.',
  'Pigeon Pose': 'Muscles Targeted: piriformis, hip external rotators, and iliopsoas. Movement Benefit: provides a deep passive stretch to the posterior hip and hip flexors to restore hip range of motion after extended sitting or training. Sport Application: Cycling — releases the hip external rotators and flexors compressed by a long-distance road cycling position.',
  'Plank Hold with Reach': 'Muscles Targeted: serratus anterior, obliques, and transverse abdominis. Movement Benefit: challenges anti-rotation and shoulder stability by reaching one arm forward from a plank without allowing the hips to rotate. Sport Application: Swimming — builds the shoulder and trunk connection that prevents hip rotation during a unilateral arm pull.',
  'Plyo Mountain Climber': 'Muscles Targeted: hip flexors, quadriceps, anterior deltoid, and transverse abdominis. Movement Benefit: develops explosive hip flexor speed and dynamic core stability through fast alternating knee drives in a plank position. Sport Application: Soccer — builds the running speed and core endurance needed for repeated high-intensity pressing sprints.',
  'Plyo Push-Up': 'Muscles Targeted: pectoralis major, triceps brachii, and anterior deltoid. Movement Benefit: develops explosive horizontal pressing power by generating enough force to become airborne at the top of the push-up. Sport Application: Basketball — builds the chest and arm power for a powerful two-handed push pass against defensive pressure.',
  'Plyometric Dip': 'Muscles Targeted: triceps brachii, anterior deltoid, and pectoralis major. Movement Benefit: trains explosive elbow extension and anterior shoulder power by pressing explosively off the dip bars to create airtime. Sport Application: Gymnastics — develops the explosive pressing power needed for a dynamic cast to handstand on parallel bars.',
  'Plyometric Dip on Chair': 'Muscles Targeted: triceps brachii, anterior deltoid, and lower pectoralis major. Movement Benefit: builds explosive pressing strength from a chair-supported dip position to progress toward full bar plyometric dips. Sport Application: Tennis — develops the explosive elbow extension used to drive through a smash with maximum arm speed.',
  'Power Flow': 'Muscles Targeted: pectorals, shoulders, glutes, and core across linked power patterns. Movement Benefit: links power-focused exercises in a flowing sequence to develop neuromuscular efficiency and sustained explosive output. Sport Application: CrossFit — builds the ability to maintain power expression across multiple movement patterns in a complex workout.',
  'Power Gauntlet': 'Muscles Targeted: total body across explosive movement patterns. Movement Benefit: chains power exercises with minimal rest to push the limits of muscular endurance and neuromuscular drive under fatigue. Sport Application: Football — develops the sustained explosive power needed for repeated high-intensity plays over a full game.',
  'Power Shoulder Complex': 'Muscles Targeted: anterior deltoid, middle deltoid, rotator cuff, and upper trapezius. Movement Benefit: trains multiple shoulder movement patterns back-to-back to develop shoulder strength and power endurance simultaneously. Sport Application: Baseball — builds the shoulder strength and durability needed to throw at high velocity across multiple innings.',
  'Power Tabata Modified': 'Muscles Targeted: glutes, chest, and core in a modified explosive pattern. Movement Benefit: applies the Tabata protocol to a modified movement to build power endurance through high-intensity interval training. Sport Application: Soccer — develops the repeated sprint ability needed to maintain explosive intensity throughout a full match.',
  'Power Triset': 'Muscles Targeted: pushing muscles, pulling muscles, and hip extensors. Movement Benefit: combines three power exercises performed sequentially to develop muscular endurance, power, and metabolic conditioning. Sport Application: Rugby — builds the sustained explosive strength needed for scrummaging, tackling, and sprinting throughout a match.',
  'Prone Cobra Hold': 'Muscles Targeted: erector spinae, rhomboids, and posterior deltoid. Movement Benefit: strengthens the posterior chain of the shoulder and spine by holding the cobra position with active retraction and external rotation. Sport Application: Swimming — develops the posterior shoulder strength needed to maintain a high elbow position during the pull phase.',
  'Prone Hip Extension': 'Muscles Targeted: gluteus maximus and hamstrings. Movement Benefit: isolates the hip extensors in a prone position to build glute and hamstring strength without spinal loading. Sport Application: Running — strengthens the hip extensors that contribute to push-off power and stride propulsion.',
  'Prone Shoulder Tap': 'Muscles Targeted: anterior deltoid, serratus anterior, and transverse abdominis. Movement Benefit: builds anti-rotation core stability and shoulder control by tapping the opposite shoulder from a plank position without rotating. Sport Application: Wrestling — develops the shoulder and core stability to maintain a strong base position while being pressured.',
  'Pseudo Planche Lean': 'Muscles Targeted: anterior deltoid, serratus anterior, and pectoralis major. Movement Benefit: builds the shoulder protraction and anterior chain strength by leaning forward in a planche position with straight arms. Sport Application: Gymnastics — develops the anterior shoulder loading capacity needed to progress toward a full planche skill.',
  'Pseudo Planche Push-Up': 'Muscles Targeted: anterior deltoid, serratus anterior, and lower pectoralis major. Movement Benefit: trains the shoulder through a forward-translated push-up that loads the anterior delts and builds planche-specific pressing strength. Sport Application: Gymnastics — develops the shoulder strength needed for a floor exercise skill transition.',
  'Push-Up Plus': 'Muscles Targeted: serratus anterior and pectoralis minor. Movement Benefit: adds scapular protraction at the top of the push-up to isolate and strengthen the serratus anterior for shoulder stability. Sport Application: Swimming — builds the serratus strength that maintains scapular upward rotation during high-elbow freestyle recovery.',
  'Push-Up Position Hold': 'Muscles Targeted: anterior deltoid, serratus anterior, and transverse abdominis. Movement Benefit: develops shoulder stability and full-body tension by holding a straight-arm plank with active shoulder engagement. Sport Application: Wrestling — builds the arm strength and core stiffness needed to post on both hands and defend against a takedown.',
  'Push-Up with Hold': 'Muscles Targeted: pectoralis major, triceps brachii, and anterior deltoid. Movement Benefit: adds an isometric pause at the bottom of the push-up to increase time under tension and improve strength at the weakest joint angle. Sport Application: Basketball — develops the chest and arm strength needed to create space on a hand-check while driving to the basket.',
  'Quadruped Breathing': 'Muscles Targeted: diaphragm, transverse abdominis, and pelvic floor. Movement Benefit: resets intra-abdominal pressure mechanics and deep core coordination from a hands-and-knees position that frees the spine. Sport Application: Powerlifting — reinforces the breathing and bracing pattern needed to protect the spine during maximal lifts.',
  'Quadruped Hip Circle': 'Muscles Targeted: gluteus medius, hip external rotators, and hip flexors. Movement Benefit: activates the hip stabilizers through a circular range of motion in a supported position that reduces spinal stress. Sport Application: Soccer — warms up the hips for the multidirectional movements required in dribbling and defensive positioning.',
  'Quadruped Hold': 'Muscles Targeted: anterior deltoid, serratus anterior, transverse abdominis, and quadriceps. Movement Benefit: builds the joint alignment and body tension needed to hold a stable quadruped position as a foundation for more demanding movements. Sport Application: Gymnastics — develops the shoulder and core stability required for table-top and L-sit transitions.',
  'Quadruped Leg Slide': 'Muscles Targeted: gluteus maximus, hamstrings, and erector spinae. Movement Benefit: trains isolated hip extension from the quadruped position with a sliding leg to build glute strength without lumbar compensation. Sport Application: Running — activates the glutes in the hip extension pattern that drives propulsion during each push-off.',
  'Quadruped Reach': 'Muscles Targeted: serratus anterior, contralateral erector spinae, and glutes. Movement Benefit: develops single-arm shoulder stability and anti-rotation core control by reaching forward from a quadruped position. Sport Application: Swimming — builds the shoulder control and trunk stability for the catch phase of a freestyle stroke.',
  'Quick Lateral Steps': 'Muscles Targeted: gluteus medius, quadriceps, and gastrocnemius. Movement Benefit: trains lateral movement speed and hip abductor reactivity to improve agility and defensive positioning. Sport Application: Basketball — develops the lateral step quickness needed to shadow a ball handler and prevent drive penetration.',
  'RKC Plank': 'Muscles Targeted: transverse abdominis, rectus abdominis, hip flexors, and gluteus maximus. Movement Benefit: maximizes full-body tension by squeezing every muscle group simultaneously in a plank, generating far greater core activation than a passive hold. Sport Application: Powerlifting — develops the maximal bracing intensity needed to create the stiffest possible trunk under a barbell.',
  'Reactive Push-Up': 'Muscles Targeted: pectoralis major, triceps brachii, and anterior deltoid. Movement Benefit: trains the stretch-shortening cycle in the horizontal press by dropping into the bottom position and explosively rebounding upward. Sport Application: Football — builds the reactive pressing power needed to instantly disengage from a block after absorbing contact.',
  'Reverse Hyper on Table': 'Muscles Targeted: gluteus maximus, hamstrings, and erector spinae. Movement Benefit: trains hip extension in a prone overhung position to decompress the lumbar spine while building posterior chain strength. Sport Application: Gymnastics — strengthens the hip extension used in a layout back flip and reduces lumbar compressive stress.',
  'Row Burnout': 'Muscles Targeted: latissimus dorsi, rhomboids, and biceps brachii. Movement Benefit: induces horizontal pulling fatigue to drive muscular endurance adaptation in the upper back and elbow flexors. Sport Application: Rowing — builds the arm and back endurance needed to maintain consistent pull force across a 2000-meter race.',
  'Scapular Push-Up': 'Muscles Targeted: serratus anterior and pectoralis minor. Movement Benefit: isolates serratus anterior and scapular protraction mechanics in a push-up position without elbow flexion for shoulder health. Sport Application: Swimming — builds the serratus strength needed for scapular control during high-elbow freestyle recovery.',
  'Scapular Squeezes': 'Muscles Targeted: rhomboids and middle trapezius. Movement Benefit: activates the scapular retractors to improve posture and prepare the shoulder girdle for pulling movements. Sport Application: Archery — builds the retraction strength needed to pull the bowstring and hold a consistent anchor position.',
  'Scapular Wall Slides': 'Muscles Targeted: lower trapezius, serratus anterior, and middle trapezius. Movement Benefit: teaches and reinforces scapular upward rotation mechanics by sliding the arms up a wall while maintaining scapular contact. Sport Application: Swimming — improves the shoulder mechanics for the recovery arc in freestyle to prevent impingement.',
  'Seated Ab Brace': 'Muscles Targeted: transverse abdominis, internal oblique, and pelvic floor. Movement Benefit: teaches intra-abdominal pressure generation in a seated position to build the bracing reflex needed for spinal protection. Sport Application: Cycling — develops the core bracing that stabilizes the pelvis and transfers power through the pedal stroke.',
  'Seated Band Anti-Rotation': 'Muscles Targeted: obliques, transverse abdominis, and erector spinae. Movement Benefit: trains rotational core stability in a seated position against band resistance to develop spine protection under torsional loads. Sport Application: Golf — builds the anti-rotation resistance that controls the downswing deceleration phase after impact.',
  'Seated Band Core Row Tan': 'Muscles Targeted: rhomboids, biceps brachii, and obliques. Movement Benefit: combines horizontal pulling with seated core stabilization to train the connection between upper-back pulling and trunk stability. Sport Application: Rowing — builds the back and core linkage that transfers leg drive force into the handle at the finish.',
  'Seated Band Row': 'Muscles Targeted: latissimus dorsi, rhomboids, and biceps brachii. Movement Benefit: develops horizontal pulling strength in a seated position with the legs extended to isolate the upper back without leg drive. Sport Application: Rowing — builds the arm and back pulling strength isolated from the leg push for balanced rowing development.',
  'Seated Band Twist': 'Muscles Targeted: external oblique, internal oblique, and erector spinae. Movement Benefit: trains active trunk rotation against band resistance to develop rotational core power and spinal mobility. Sport Application: Golf — builds the rotational core strength that generates clubhead speed during the downswing.',
  'Seated Leg Press with Band': 'Muscles Targeted: quadriceps, gluteus maximus, and hamstrings. Movement Benefit: trains the knee extension and hip extension pattern from a seated position with band resistance as a step toward standing squat patterns. Sport Application: Cycling — develops the quad and glute strength for the power phase of the pedal stroke between 12 and 5 o\'clock.',
  'Seated Spinal Twist': 'Muscles Targeted: external oblique, thoracic erectors, and piriformis. Movement Benefit: actively rotates the thoracic and lumbar spine to restore rotational range of motion and release tension after training. Sport Application: Tennis — maintains the thoracic rotation needed for a full backswing on both forehand and backhand strokes.',
  'Shoulder CARs': 'Muscles Targeted: rotator cuff complex, deltoids, and serratus anterior. Movement Benefit: takes the shoulder through its complete passive range of motion actively to develop joint control and mobility simultaneously. Sport Application: Baseball — maintains full shoulder range of motion for pitchers between starts to prevent stiffness.',
  'Shoulder Circuit': 'Muscles Targeted: deltoids, rotator cuff complex, and upper trapezius. Movement Benefit: targets the shoulder from multiple angles in sequence to develop comprehensive shoulder strength and muscular endurance. Sport Application: Swimming — builds the complete shoulder strength needed to sustain stroke mechanics across a long open-water swim.',
  'Shoulder Culmination': 'Muscles Targeted: deltoids, rotator cuff, and upper trapezius. Movement Benefit: combines advanced shoulder exercises in a final phase workout to test and express the shoulder strength built across the training cycle. Sport Application: Volleyball — peaks the shoulder power needed for explosive spikes and powerful serving during competition.',
  'Shoulder Cross-Body Stretch': 'Muscles Targeted: posterior deltoid, teres minor, and infraspinatus. Movement Benefit: stretches the posterior shoulder capsule to restore horizontal adduction range of motion after pressing and overhead work. Sport Application: Swimming — maintains posterior shoulder flexibility for the arm recovery arc in freestyle stroke.',
  'Shoulder Isometric Burnout': 'Muscles Targeted: deltoids, rotator cuff, and upper trapezius. Movement Benefit: induces deep muscular fatigue through sustained isometric shoulder holds to build endurance in the stabilizing muscles. Sport Application: Tennis — develops the shoulder endurance needed to maintain arm speed on serves late in a third-set tiebreak.',
  'Shoulder Opener Stretch': 'Muscles Targeted: anterior deltoid, pectoralis minor, and subscapularis. Movement Benefit: opens the anterior shoulder and chest to restore the range of motion needed for overhead pressing and throwing mechanics. Sport Application: Baseball — restores shoulder external rotation range to allow a high arm slot during a pitching delivery.',
  'Shoulder Rolls': 'Muscles Targeted: upper trapezius, levator scapulae, and rhomboids. Movement Benefit: mobilizes the scapulothoracic joint and releases neck-shoulder tension by rolling the shoulders through full circumduction. Sport Application: Swimming — loosens the trapezius and shoulder before a training session to allow free arm recovery.',
  'Shoulder Shrugs': 'Muscles Targeted: upper trapezius and levator scapulae. Movement Benefit: activates and warms up the scapular elevators to prepare the neck-shoulder complex for overhead and pulling exercises. Sport Application: Weightlifting — prepares the upper traps for the high-pull position during a clean or snatch.',
  'Side Plank with Band Row Blue': 'Muscles Targeted: obliques, latissimus dorsi, and gluteus medius. Movement Benefit: combines lateral core stability with a horizontal pull to develop the connection between pulling strength and anti-lateral-flexion endurance. Sport Application: Rowing — builds the core-to-arm connection that prevents lateral trunk collapse during a powerful drive.',
  'Side Plank with Thread': 'Muscles Targeted: obliques, transverse abdominis, and thoracic rotators. Movement Benefit: adds a rotational component to the side plank by threading the top arm under the body to develop dynamic anti-rotation strength. Sport Application: Tennis — builds the lateral core strength that resists trunk lean during a wide forehand stretch.',
  'Side-Lying Clam': 'Muscles Targeted: gluteus medius and hip external rotators. Movement Benefit: isolates the hip abductors in a side-lying position to build the foundational activation pattern for pelvic stability. Sport Application: Running — develops the gluteus medius activity that prevents the hip drop causing IT band syndrome.',
  'Side-Lying Hip Abduction': 'Muscles Targeted: gluteus medius and tensor fasciae latae. Movement Benefit: trains hip abduction strength through full range of motion in a side-lying position for isolated hip lateral stability development. Sport Application: Soccer — builds the hip abductor strength that stabilizes the pelvis during single-leg kicking and landing.',
  'Side-Lying Leg Lift': 'Muscles Targeted: gluteus medius and tensor fasciae latae. Movement Benefit: develops hip abduction strength and endurance in a side-lying position to improve lateral hip stability for functional movements. Sport Application: Running — builds the hip abductor endurance that maintains alignment over thousands of strides.',
  'Single Arm Band Curl Blue': 'Muscles Targeted: biceps brachii and brachialis. Movement Benefit: develops unilateral elbow flexion strength under heavy resistance to address left-right asymmetries in pulling strength. Sport Application: Rock climbing — builds the individual arm pulling strength needed to lock off and reach on a steep route.',
  'Single Arm Band Curl Green': 'Muscles Targeted: biceps brachii and brachialis. Movement Benefit: builds unilateral elbow flexion strength with moderate resistance to develop balanced arm pulling capacity. Sport Application: Tennis — develops the arm strength needed for a powerful topspin one-handed backhand.',
  'Single Arm Band Face Pull Green': 'Muscles Targeted: posterior deltoid, infraspinatus, and middle trapezius. Movement Benefit: trains unilateral rear shoulder external rotation and retraction to address shoulder asymmetries from throwing or racquet sports. Sport Application: Tennis — builds the serving arm\'s deceleration strength to protect the posterior shoulder after ball contact.',
  'Single Arm Band Face Pull Tan': 'Muscles Targeted: posterior deltoid and middle trapezius. Movement Benefit: activates the rear shoulder and scapular retractors unilaterally with light resistance to prime the shoulder for pulling work. Sport Application: Baseball — prepares the posterior shoulder for the deceleration forces encountered during throwing.',
  'Single Arm Band Front Raise Tan': 'Muscles Targeted: anterior deltoid and clavicular pectoralis. Movement Benefit: develops unilateral anterior shoulder strength with light resistance to build even shoulder development and control. Sport Application: Swimming — builds the arm lift strength for the hand-entry arc of a backstroke on the weaker side.',
  'Single Arm Band Overhead Press Blue': 'Muscles Targeted: anterior deltoid, triceps brachii, and upper trapezius. Movement Benefit: develops unilateral overhead pressing strength under heavy load to correct asymmetries and build single-arm shoulder power. Sport Application: Basketball — builds the shooting arm strength to elevate a shot over a tall defender from distance.',
  'Single Arm Band Overhead Press Tan': 'Muscles Targeted: anterior deltoid, triceps brachii, and upper trapezius. Movement Benefit: introduces unilateral overhead pressing with light resistance to develop shoulder control and anti-lateral-flexion core stability. Sport Application: Volleyball — builds the spike arm strength and stability needed for accurate shot placement.',
  'Single Arm Band Pull-Apart Tan': 'Muscles Targeted: posterior deltoid and rhomboids. Movement Benefit: activates the rear shoulder and scapular retractors unilaterally with light band resistance to develop balanced shoulder health. Sport Application: Archery — builds the single-arm retraction needed to draw a bow to a consistent anchor on the dominant side.',
  'Single Arm Band Reverse Fly Tan': 'Muscles Targeted: posterior deltoid, rhomboids, and middle trapezius. Movement Benefit: trains unilateral rear shoulder strength to correct front-to-back imbalances from single-arm pressing activities. Sport Application: Baseball — builds the throwing arm\'s deceleration musculature to prevent posterior shoulder overuse injuries.',
  'Single Arm Band Row Green': 'Muscles Targeted: latissimus dorsi, rhomboids, and biceps brachii. Movement Benefit: develops unilateral horizontal pulling strength to identify and correct left-right pulling asymmetries. Sport Application: Rowing — builds the arm-specific pulling strength to maintain equal force delivery on each side of the stroke.',
  'Single Arm Band Row Tan': 'Muscles Targeted: latissimus dorsi and rhomboids. Movement Benefit: activates the upper back pulling muscles unilaterally with light resistance to warm up for rowing and pulling patterns. Sport Application: Kayaking — primes the lat for the single-arm sweep stroke used to maintain course direction.',
  'Single Arm Bird Dog': 'Muscles Targeted: erector spinae, anterior deltoid, and contralateral glutes. Movement Benefit: intensifies the bird dog pattern by using only one extended arm to increase the rotational stability demand on the trunk. Sport Application: Golf — develops the diagonal core stability that links the lead shoulder to the trail hip in a swing.',
  'Single Arm Modified Plank': 'Muscles Targeted: anterior deltoid, serratus anterior, obliques, and transverse abdominis. Movement Benefit: builds unilateral shoulder stability and anti-rotation core endurance from a modified plank position. Sport Application: Wrestling — develops the shoulder strength to post on one arm while extending the other to block an opponent.',
  'Single Arm Pike Push-Up': 'Muscles Targeted: anterior deltoid, triceps brachii, and serratus anterior. Movement Benefit: develops unilateral overhead pressing strength in a pike position to build toward handstand push-up variations. Sport Application: Gymnastics — builds single-arm pressing strength needed for advanced handstand balance skills.',
  'Single Arm Plank': 'Muscles Targeted: anterior deltoid, serratus anterior, obliques, and transverse abdominis. Movement Benefit: challenges shoulder stability and anti-rotation core endurance by removing one arm from the plank to concentrate load. Sport Application: Swimming — builds the single-arm shoulder stability and core connection for unilateral freestyle pull mechanics.',
  'Single Arm Push-Up Progression': 'Muscles Targeted: pectoralis major, triceps brachii, and anterior deltoid. Movement Benefit: systematically develops unilateral pressing strength through scaled single-arm push-up variations to build toward a full single-arm push-up. Sport Application: Wrestling — develops the single-arm strength needed to press off the mat when scrambling for position.',
  'Single Arm Table Inverted Row': 'Muscles Targeted: latissimus dorsi, rhomboids, and biceps brachii. Movement Benefit: develops unilateral horizontal pulling strength under body weight to build balanced upper back strength and address pulling asymmetries. Sport Application: Rock climbing — builds the single-arm pulling strength critical for making dynamic moves on steep terrain.',
  'Single Arm Table Row': 'Muscles Targeted: latissimus dorsi and rhomboids. Movement Benefit: trains one-arm horizontal pulling from a table support to build isolated lat and upper back strength. Sport Application: Kayaking — develops the single-arm pulling power needed for an aggressive forward stroke on the weak side.',
  'Single Arm Tricep Dip': 'Muscles Targeted: triceps brachii and anterior deltoid. Movement Benefit: develops unilateral elbow extension strength by loading one arm during a chair dip to address tricep asymmetries. Sport Application: Tennis — builds the arm-specific extension power needed for a flat serve with maximum arm speed.',
  'Single Arm Tricep Push-Up': 'Muscles Targeted: triceps brachii and anterior deltoid. Movement Benefit: isolates the tricep unilaterally through a narrow push-up performed on one arm to build asymmetric elbow extension strength. Sport Application: Boxing — develops the single-arm power for a quick jab-cross combination with maximal punch extension.',
  'Single Arm Wall Push': 'Muscles Targeted: anterior deltoid, serratus anterior, and triceps brachii. Movement Benefit: builds shoulder stability and pressing endurance through sustained single-arm isometric pushing into a wall surface. Sport Application: Wrestling — develops the shoulder endurance needed to post and hold a stiff-arm against a driving opponent.',
  'Single Leg Balance Hold': 'Muscles Targeted: peroneals, tibialis anterior, and gluteus medius. Movement Benefit: develops proprioceptive ankle and hip stability by balancing on one foot to improve neuromuscular control of single-leg athletic movements. Sport Application: Soccer — builds the balance needed to control a bouncing ball on one foot while shielding from a defender.',
  'Single Leg Band Clamshell Tan': 'Muscles Targeted: gluteus medius, hip external rotators, and hip flexors. Movement Benefit: adds hip flexion to the clamshell position to simultaneously activate the hip abductors and flexors in a functionally demanding position. Sport Application: Running — builds the combined hip flexor and abductor strength that drives the swing leg while stabilizing the stance leg.',
  'Single Leg Band Glute Bridge Green': 'Muscles Targeted: gluteus maximus and hamstrings. Movement Benefit: removes one leg to double the load on the working hip and build unilateral hip extension strength with moderate band resistance. Sport Application: Sprinting — develops the independent glute strength that drives each push-off without compensating from the other leg.',
  'Single Leg Band Kickback Tan': 'Muscles Targeted: gluteus maximus and hamstrings. Movement Benefit: isolates hip extension on one leg against light resistance to develop unilateral glute strength and hip extension range of motion. Sport Application: Running — activates the glutes in the terminal hip extension pattern critical for the toe-off phase of a sprint.',
  'Single Leg Band Romanian Deadlift Tan': 'Muscles Targeted: hamstrings, gluteus maximus, and erector spinae. Movement Benefit: develops unilateral hip hinge mechanics and hamstring loading through a single-leg RDL with light band resistance. Sport Application: Soccer — builds the hamstring and glute strength needed to decelerate during a high-speed cut.',
  'Single Leg Band Side Step Tan': 'Muscles Targeted: gluteus medius, tensor fasciae latae, and hip abductors. Movement Benefit: trains lateral hip abductor strength in a single-leg standing position with band resistance to improve dynamic lateral stability. Sport Application: Basketball — develops the lateral hip strength needed to change direction quickly without losing balance.',
  'Single Leg Band Squat Tan': 'Muscles Targeted: quadriceps, gluteus maximus, and hip abductors. Movement Benefit: develops unilateral squat strength against band resistance to build single-leg power and knee stability. Sport Application: Soccer — builds the single-leg strength needed to receive a pass and quickly change direction in one motion.',
  'Single Leg Calf Raise Hold': 'Muscles Targeted: gastrocnemius, soleus, and peroneals. Movement Benefit: builds calf strength and ankle stability through an isometric single-leg calf raise hold to develop push-off power and injury resilience. Sport Application: Basketball — develops the ankle and calf strength needed to elevate on a jump shot while planting off one foot.',
  'Single Leg Glute Bridge': 'Muscles Targeted: gluteus maximus and hamstrings. Movement Benefit: concentrates hip extension load on one leg to build unilateral posterior chain strength and identify left-right imbalances. Sport Application: Running — builds the single-leg hip extension power that drives forward propulsion at toe-off.',
  'Single Leg Glute Bridge (warmup)': 'Muscles Targeted: gluteus maximus and hamstrings. Movement Benefit: activates the hip extensors in a single-leg pattern to prepare the glutes for the demands of running, jumping, and loaded training. Sport Application: Sprinting — primes the glute for independent push-off mechanics before an intensive lower body session.',
  'Single Leg Hollow Hold': 'Muscles Targeted: transverse abdominis, rectus abdominis, and hip flexors. Movement Benefit: develops anterior core tension and hip flexor strength in a modified hollow position by extending one leg to increase lever demand. Sport Application: Gymnastics — builds the body tension and hip flexor strength needed for a single-leg lowering on the floor exercise.',
  'Single Leg RDL Hold': 'Muscles Targeted: hamstrings, gluteus maximus, and peroneals. Movement Benefit: develops balance, hip hinge mechanics, and hamstring isometric strength through a single-leg RDL held at the bottom position. Sport Application: Soccer — builds the balance and hamstring strength to control the body when lunging to play a ball in stride.',
  'Single-Leg Glute Bridge': 'Muscles Targeted: gluteus maximus and hamstrings. Movement Benefit: strengthens the hip extensors unilaterally to develop power and reduce muscle imbalances in the posterior chain. Sport Application: Sprinting — builds the independent push-off glute strength that drives each stride in a maximal effort sprint.',
  'Single-Leg Hip Circle': 'Muscles Targeted: gluteus medius, hip flexors, and hip external rotators. Movement Benefit: activates the hip stabilizers through circular movements in a single-leg stance to improve dynamic hip control. Sport Application: Soccer — warms up the hip for the multidirectional movement demands of dribbling at speed.',
  'Slow Heel Slides': 'Muscles Targeted: hip flexors, iliopsoas, and rectus femoris. Movement Benefit: builds controlled hip flexion in a supine position to develop the slow-tempo strength needed for deliberate athletic movements. Sport Application: Swimming — develops the hip flexor strength for the flutter kick, controlling leg speed for a consistent rhythm.',
  'Slow Negative Close-Grip Push-Up': 'Muscles Targeted: triceps brachii, pectoralis major, and anterior deltoid. Movement Benefit: builds eccentric tricep and pressing strength by lowering the chest slowly to the floor with a narrow grip. Sport Application: Tennis — develops the arm lowering strength needed to absorb the shock of landing after a jump for an overhead smash.',
  'Slow Negative Pike Push-Up': 'Muscles Targeted: anterior deltoid, triceps brachii, and upper trapezius. Movement Benefit: develops eccentric overhead pressing strength through a slow controlled lowering in the pike position. Sport Application: Gymnastics — builds the overhead lowering control for a controlled descent from a handstand to the floor.',
  'Slow Negative Push-Up': 'Muscles Targeted: pectoralis major, anterior deltoid, and triceps brachii. Movement Benefit: maximizes eccentric phase loading in the horizontal press to build tissue resilience and strength in the difficult lowering phase. Sport Application: Football — develops the chest and arm deceleration strength needed to absorb a pass-rusher\'s counter move.',
  'Slow Negative Push-Up Knees Down': 'Muscles Targeted: pectoralis major, anterior deltoid, and triceps brachii. Movement Benefit: builds eccentric pressing strength from a modified position to progress toward full slow-negative push-ups. Sport Application: Basketball — develops the arm strength to brace and control a body collision during a drive to the basket.',
  'Slow Negative Table Inverted Row': 'Muscles Targeted: latissimus dorsi, rhomboids, and biceps brachii. Movement Benefit: emphasizes eccentric horizontal pulling strength by lowering slowly from the top of the inverted row to build pulling resilience. Sport Application: Rock climbing — develops the eccentric pulling control needed to lower the body safely on a downclimb.',
  'Small Squat Jump': 'Muscles Targeted: quadriceps, gluteus maximus, and gastrocnemius. Movement Benefit: develops the stretch-shortening cycle in the legs through small amplitude jump repeats to build reactive power and ankle stiffness. Sport Application: Basketball — builds the quick-twitch jump reactivity needed for rapid back-to-back tip attempts at the rim.',
  'Small Squat Jump Land Soft': 'Muscles Targeted: quadriceps, gluteus maximus, and soleus. Movement Benefit: develops reactive jumping with a focus on soft landing mechanics to train both power production and safe deceleration. Sport Application: Volleyball — builds the jump power combined with quiet-landing mechanics needed to spike and land without ankle injury.',
  'Speed Bird Dog': 'Muscles Targeted: erector spinae, gluteus maximus, and contralateral multifidus. Movement Benefit: increases the tempo of the bird dog to develop the spinal stabilization speed needed for dynamic athletic movements. Sport Application: Soccer — builds the quick trunk stabilization reflex needed when suddenly changing direction with a defender close.',
  'Speed Dead Bug': 'Muscles Targeted: transverse abdominis, hip flexors, and rectus abdominis. Movement Benefit: trains anti-extension core stability at speed to develop the dynamic trunk control needed during fast athletic movements. Sport Application: Basketball — builds the quick core bracing that protects the spine during fast changes of direction.',
  'Speed Mountain Climber': 'Muscles Targeted: hip flexors, quadriceps, and anterior deltoid. Movement Benefit: develops maximum hip flexor speed and cardiovascular conditioning through all-out mountain climbers. Sport Application: Soccer — builds the high-frequency leg turnover needed for explosive pressing runs to win the ball.',
  'Speed Push-Up': 'Muscles Targeted: pectoralis major, triceps brachii, and anterior deltoid. Movement Benefit: develops pressing endurance and rate of force development by performing push-ups at maximum sustainable speed. Sport Application: Football — builds the explosive press power that immediately engages a defensive lineman on the snap.',
  'Speed Superman Pulls': 'Muscles Targeted: erector spinae, gluteus maximus, and rear deltoid. Movement Benefit: trains fast posterior chain activation through rapid lying superman pulls to develop reactive back extensors. Sport Application: Gymnastics — builds the back extension speed used in a back walkover or back handspring approach.',
  'Sprint Dead Bug': 'Muscles Targeted: transverse abdominis, hip flexors, and rectus abdominis. Movement Benefit: performs dead bugs at full speed to train the anti-extension core stability needed during maximal sprinting efforts. Sport Application: Sprinting — builds the trunk stiffness that transfers leg power to forward propulsion without energy leakage.',
  'Sprint Sit-Up': 'Muscles Targeted: rectus abdominis, hip flexors, and iliopsoas. Movement Benefit: performs sit-ups at maximum speed to develop hip flexor power and trunk flexion endurance for explosive athletic demands. Sport Application: MMA — builds the abdominal speed needed to execute a quick sit-out from a bottom position on the mat.',
  'Stir the Pot': 'Muscles Targeted: transverse abdominis, obliques, and erector spinae. Movement Benefit: trains anti-extension and anti-rotation core stability simultaneously by circling the arms in a plank on a ball. Sport Application: Golf — develops the full core stiffness that resists bending under the torsional forces of a downswing.',
  'Stir the Pot on Forearms': 'Muscles Targeted: transverse abdominis, obliques, and serratus anterior. Movement Benefit: trains anti-rotation and anti-extension on the forearms to develop all-plane core stability without wrist loading. Sport Application: Golf — builds the lateral and rotational core control that protects the lower back during a powerful golf swing.',
  'Strength Core Gauntlet': 'Muscles Targeted: rectus abdominis, obliques, transverse abdominis, and hip flexors. Movement Benefit: chains core strength exercises with minimal rest to build superior trunk strength and endurance simultaneously. Sport Application: Rowing — develops the trunk strength endurance needed to maintain powerful leg-to-back force transfer across 2000 meters.',
  'Strength Flow': 'Muscles Targeted: lats, pectorals, core, and glutes across linked strength patterns. Movement Benefit: links strength movements in a sequential flow to build functional strength endurance and improve movement efficiency. Sport Application: CrossFit — develops the movement quality to sustain technique under load across a complex strength workout.',
  'Strength Triset': 'Muscles Targeted: major push, pull, and hinge muscle groups. Movement Benefit: pairs three complementary strength exercises for sequential execution to maximize time efficiency and muscular endurance. Sport Application: Rugby — develops the sustained strength endurance needed for scrummaging, mauling, and running throughout an 80-minute match.',
  'Suitcase Hold': 'Muscles Targeted: obliques, quadratus lumborum, and erector spinae. Movement Benefit: develops lateral core stability by holding a load asymmetrically at the side, training the quadratus lumborum to resist lateral flexion. Sport Application: Wrestling — builds the lateral trunk stiffness needed to resist being tilted or turned during a clinch battle.',
  'Supine Figure-4 Stretch': 'Muscles Targeted: piriformis, gluteus medius, and hip external rotators. Movement Benefit: provides a deep passive stretch to the posterior hip complex in a supine position for recovery and mobility maintenance. Sport Application: Cycling — releases the piriformis tightness caused by sustained hip external rotation during road cycling.',
  'Supine Hamstring Stretch': 'Muscles Targeted: hamstrings and posterior knee capsule. Movement Benefit: lengthens the hamstring from a supine position to restore hip flexion range of motion and reduce posterior chain tightness. Sport Application: Sprinting — restores the hamstring flexibility needed for a full stride length during acceleration.',
  'Supine Hip Lift': 'Muscles Targeted: gluteus maximus, hamstrings, and erector spinae. Movement Benefit: activates the glutes and hamstrings with a supine hip lift to build the foundation for more demanding bridge variations. Sport Application: Running — develops the glute activation pattern for the hip extension push-off in each stride.',
  'Supine Knee Hug': 'Muscles Targeted: gluteus maximus and lumbar erectors. Movement Benefit: provides a gentle passive stretch to the hip and lower back in the supine position for decompression and recovery. Sport Application: Running — releases the hip compression and lumbar tension that builds after sustained running workloads.',
  'Supine Knee Rocks': 'Muscles Targeted: lumbar erectors, hip external rotators, and adductors. Movement Benefit: gently mobilizes the lumbar spine and hips through lateral knee rocking to release tension after training. Sport Application: Golf — releases the lumbar and hip restrictions that limit a free shoulder turn during the backswing.',
  'Supine Leg Lowering': 'Muscles Targeted: transverse abdominis, hip flexors, and rectus abdominis. Movement Benefit: builds anti-extension core control through a progressive leg-lowering challenge that requires maintaining a flat lumbar spine. Sport Application: Swimming — develops the lower abdominal control that prevents the hips from dropping during kick-driven propulsion.',
  'Supine Leg Slides': 'Muscles Targeted: transverse abdominis and hip flexors. Movement Benefit: activates the deep core in a supine position through leg slides that challenge lumbar stability with minimal hip flexor loading. Sport Application: Running — builds the foundational core control that stabilizes the pelvis during the swing phase of each stride.',
  'Supine Spinal Twist': 'Muscles Targeted: thoracic erectors, piriformis, and obliques. Movement Benefit: provides a passive rotational stretch to the thoracic and lumbar spine to restore mobility after training. Sport Application: Golf — maintains the thoracic rotation range that generates clubhead speed in a full backswing.',
  'Supported Bear Hold': 'Muscles Targeted: anterior deltoid, serratus anterior, and quadriceps. Movement Benefit: introduces the bear hold position with supported balance to build shoulder and core tension before progressing to the unsupported version. Sport Application: Gymnastics — develops the body tension foundation needed for a full quadruped hover without assistance.',
  'Supported Side Plank': 'Muscles Targeted: obliques, gluteus medius, and adductors. Movement Benefit: develops lateral core and hip stability from a supported position to build the foundation for the full side plank. Sport Application: Running — builds the lateral hip stability needed to resist pelvic drop during single-leg ground contact.',
  'Supported Single Leg Stand': 'Muscles Targeted: peroneals, tibialis anterior, and gluteus medius. Movement Benefit: develops balance and proprioceptive ankle control in a single-leg stance with light support assistance. Sport Application: Soccer — builds the unipedal balance needed to receive and control a pass on one leg while scanning the field.',
  'Tabata Burpee': 'Muscles Targeted: pectoralis major, quadriceps, gluteus maximus, and anterior deltoid. Movement Benefit: maximizes cardiovascular and full-body muscular conditioning through repeated all-out burpee intervals in the Tabata protocol. Sport Application: CrossFit — develops the work capacity and mental durability needed to perform at maximum intensity under exhaustion.',
  'Tall Kneeling Band Row': 'Muscles Targeted: latissimus dorsi, rhomboids, and gluteus maximus. Movement Benefit: trains horizontal pulling from a kneeling position that eliminates lower body momentum and demands active glute engagement for spinal stability. Sport Application: Rowing — builds the isolated back strength separated from leg drive to develop pull-only rowing power.',
  'Thread the Needle': 'Muscles Targeted: thoracic erectors, rotators, and posterior deltoid. Movement Benefit: improves thoracic rotation mobility by threading one arm under the body while in a quadruped position to open the upper spine. Sport Application: Tennis — restores the thoracic rotation needed for a full shoulder turn during a two-handed backhand.',
  'Thoracic Extension on Floor': 'Muscles Targeted: thoracic erectors and rhomboids. Movement Benefit: opens the thoracic spine into extension over the floor to reverse the flexion posture of daily sitting and pressing exercises. Sport Application: Swimming — restores the thoracic extension needed for a high-elbow catch position in butterfly and freestyle.',
