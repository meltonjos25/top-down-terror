// ---- MESSAGES TAB ----
async function loadMessages() {
  if (S.messagesLoading) return;
  S.messagesLoading = true;
  render();
  try {
    const rows = await gasReadAll(MESSAGES_SHEET);
    const user = S.user;
    const deleted = new Set(JSON.parse(localStorage.getItem('deletedMsgs_' + user) || '[]'));
    const sent = [], received = [];
    rows.forEach(row => {
      const date = normDateStr(String(row[0] || ''));
      const time = normTimeStr(String(row[1] || ''));
      const from = String(row[2] || '').trim().toLowerCase();
      const to   = String(row[3] || '').trim().toLowerCase();
      const text = String(row[4] || '').trim();
      if (!date || text.length < 2) return;
      const edited = String(row[5] || '').trim().toLowerCase() === 'edited';
      const msg = { date, time, from, to, text, edited };
      if (from === user) sent.unshift(msg);
      else if (to === user && !deleted.has(msgKey(msg))) received.unshift(msg);
    });
    S.messages = { sent, received };
  } catch(e) {
    S.messages = { sent: [], received: [] };
  }
  S.messagesLoaded = true;
  S.messagesLoading = false;
  render();
}

async function sendDedicationMessage() {
  const text = (S.messageDraft || '').trim();
  if (!text || S.messageSending) return;
  S.messageSending = true;
  S.messageSendError = '';
  render();
  try {
    const to      = S.user === 'husband' ? 'wife' : 'husband';
    const dateStr = localDateStr(new Date());
    const timeStr = new Date().toTimeString().slice(0, 5);
    await gasWrite(MESSAGES_SHEET, [[dateStr, timeStr, S.user, to, text]]);
    const newMsg = { date: dateStr, time: timeStr, from: S.user, to, text };
    if (!S.messages) S.messages = { sent: [], received: [] };
    S.messages.sent.unshift(newMsg);
    S.messageDraft = '';
  } catch(e) {
    S.messageSendError = 'Failed to send — please try again.';
  }
  S.messageSending = false;
  render();
  // Scroll to bottom and refocus input after send
  requestAnimationFrame(() => {
    const body = document.querySelector('.body');
    if (body) body.scrollTop = body.scrollHeight;
    const inp = document.getElementById('msg-text-input');
    if (inp) inp.focus();
  });
}

function formatDaySep(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  } catch(e) { return dateStr; }
}

function msgInputGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ---- MSG EDIT / DELETE ----
let _msgLpTimer = null, _msgLpMoved = false, _msgLpX = 0, _msgLpY = 0;
let _msgMenuEl = null, _msgMenuMsg = null;
let _msgConfirmEl = null, _msgConfirmMsg = null;
window._sentMsgs = [];

async function gasEditMessage(msg, newText) {
  const data = encodeURIComponent(JSON.stringify({ sheet: MESSAGES_SHEET, from: msg.from, to: msg.to, oldText: msg.text, newText }));
  const r = await fetch(`${S.gasUrl}?action=edit_msg&data=${data}`);
  if (!r.ok) throw new Error('Edit failed');
  const json = await r.json();
  if (json.error) throw new Error(json.error);
  return json;
}
async function gasDeleteMessage(msg) {
  const data = encodeURIComponent(JSON.stringify({ sheet: MESSAGES_SHEET, from: msg.from, to: msg.to, text: msg.text }));
  const r = await fetch(`${S.gasUrl}?action=delete_msg&data=${data}`);
  if (!r.ok) throw new Error('Delete failed');
  const json = await r.json();
  if (json.error) throw new Error(json.error);
  return json;
}

function msgLpStart(e, idx) {
  clearTimeout(_msgLpTimer); _msgLpMoved = false;
  const touch = e.touches[0];
  _msgLpX = touch.clientX; _msgLpY = touch.clientY;
  const el = e.currentTarget;
  _msgLpTimer = setTimeout(() => {
    if (_msgLpMoved) return;
    if (navigator.vibrate) navigator.vibrate(50);
    const msg = window._sentMsgs[idx];
    if (msg) msgShowMenu(msg, el);
  }, 500);
}
function msgLpMove(e) {
  if (!_msgLpTimer) return;
  const t = e.touches[0];
  if (Math.abs(t.clientX - _msgLpX) > 8 || Math.abs(t.clientY - _msgLpY) > 8) {
    clearTimeout(_msgLpTimer); _msgLpTimer = null; _msgLpMoved = true;
  }
}
function msgLpEnd() { clearTimeout(_msgLpTimer); _msgLpTimer = null; }
function msgCtxMenu(e, idx) {
  e.preventDefault();
  const msg = window._sentMsgs[idx];
  if (msg) msgShowMenu(msg, e.currentTarget);
}

function msgShowMenu(msg, anchorEl) {
  msgHideMenu();
  const rect = anchorEl.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'msg-action-menu';
  const menuH = 90, spaceAbove = rect.top;
  el.style.top  = (spaceAbove >= menuH + 10 ? rect.top - menuH - 8 : rect.bottom + 8) + 'px';
  el.style.right = Math.max(8, window.innerWidth - rect.right) + 'px';
  el.innerHTML = `
    <button class="msg-menu-btn" onclick="msgStartEdit()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Edit
    </button>
    <div class="msg-menu-divider"></div>
    <button class="msg-menu-btn msg-menu-delete-btn" onclick="msgConfirmDelete()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      Delete
    </button>`;
  document.body.appendChild(el);
  _msgMenuEl = el; _msgMenuMsg = msg;
  requestAnimationFrame(() => el.classList.add('msg-action-in'));
  setTimeout(() => document.addEventListener('pointerdown', _msgMenuOutside, { once: true, capture: true }), 30);
}
function _msgMenuOutside(e) { if (!_msgMenuEl?.contains(e.target)) msgHideMenu(); }
function msgHideMenu() {
  if (_msgMenuEl) { _msgMenuEl.remove(); _msgMenuEl = null; }
  document.removeEventListener('pointerdown', _msgMenuOutside, { capture: true });
}

function msgStartEdit() {
  const msg = _msgMenuMsg; msgHideMenu();
  if (!msg) return;
  S.msgEditingKey = msgKey(msg); S.msgEditDraft = msg.text;
  const body = document.querySelector('.body'); const st = body?.scrollTop || 0;
  render();
  requestAnimationFrame(() => {
    if (body) body.scrollTop = st;
    const inp = document.getElementById('msg-edit-input');
    if (inp) { inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
  });
}
function msgCancelEdit() {
  S.msgEditingKey = null; S.msgEditDraft = '';
  const body = document.querySelector('.body'); const st = body?.scrollTop || 0;
  render(); requestAnimationFrame(() => { if (body) body.scrollTop = st; });
}
async function msgSaveEdit() {
  const newText = (S.msgEditDraft || '').trim();
  if (!newText || !S.msgEditingKey || S.msgSaving) return;
  const key = S.msgEditingKey;
  const msg = S.messages?.sent.find(m => msgKey(m) === key);
  if (!msg) return;
  S.msgSaving = true;
  S.messageSendError = '';
  const body = document.querySelector('.body'); const st = body?.scrollTop || 0;
  render(); requestAnimationFrame(() => { if (body) body.scrollTop = st; });
  try {
    await gasEditMessage(msg, newText);
    msg.text = newText; msg.edited = true;
    S.msgEditingKey = null; S.msgEditDraft = '';
  } catch(e) {
    S.messageSendError = 'Could not save edit — please try again.';
  }
  S.msgSaving = false;
  render(); requestAnimationFrame(() => { if (body) body.scrollTop = st; });
}

function msgConfirmDelete() {
  const msg = _msgMenuMsg; msgHideMenu(); if (!msg) return;
  const el = document.createElement('div');
  el.className = 'msg-confirm-overlay';
  el.innerHTML = `<div class="msg-confirm-box">
    <div class="msg-confirm-title">Delete Message</div>
    <div class="msg-confirm-text">Are you sure you want to delete this message?</div>
    <div class="msg-confirm-btns">
      <button class="msg-confirm-btn" onclick="msgHideConfirm()">Cancel</button>
      <button class="msg-confirm-btn msg-confirm-del" onclick="msgDoDelete()">Delete</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  _msgConfirmEl = el; _msgConfirmMsg = msg;
  requestAnimationFrame(() => el.classList.add('msg-confirm-in'));
}
function msgHideConfirm() {
  if (_msgConfirmEl) { _msgConfirmEl.remove(); _msgConfirmEl = null; }
  _msgConfirmMsg = null;
}
async function msgDoDelete() {
  const msg = _msgConfirmMsg; msgHideConfirm(); if (!msg || !S.messages) return;
  const key = msgKey(msg);
  S.msgDeletingKey = key;
  S.messageSendError = '';
  render();
  try {
    await gasDeleteMessage(msg);
    S.messages.sent = S.messages.sent.filter(m => msgKey(m) !== key);
  } catch(e) {
    S.messageSendError = 'Could not delete message — please try again.';
  }
  S.msgDeletingKey = null;
  render();
}

function msgUpdateSendBtn() {
  const btn = document.getElementById('msg-send-btn');
  if (!btn) return;
  const hasText = !!(S.messageDraft || '').trim();
  btn.disabled = !hasText;
}

function renderMessagesBody() {
  if (!S.messagesLoaded && !S.messagesLoading) loadMessages();

  // Snapshot unread state BEFORE marking as read so highlights show briefly
  const readSet = getReadMsgs(S.user);
  if (S.messagesLoaded && S.messages) {
    S.messages.received.forEach(m => markMsgRead(S.user, msgKey(m)));
    S.pendingUnreadCount = 0;
  }

  const HUSBAND_CLR = '#0A84FF';
  const WIFE_CLR    = '#FF375F';
  const myColor     = S.user === 'husband' ? HUSBAND_CLR : WIFE_CLR;
  const partnerName = S.user === 'husband' ? 'Wife' : 'Husband';
  const partnerColor = S.user === 'husband' ? WIFE_CLR : HUSBAND_CLR;
  const msgs = S.messages || { sent: [], received: [] };

  const inputBar = `<div class="msg-input-wrap">
    ${S.messageSendError ? `<div style="position:absolute;bottom:100%;left:0;right:0;padding:7px 16px;font-size:12px;color:var(--red);background:var(--bg);border-top:1px solid var(--border)">${S.messageSendError}</div>` : ''}
    <textarea id="msg-text-input" class="msg-text-input" rows="1"
      placeholder="Message ${partnerName}…"
      oninput="S.messageDraft=this.value;msgInputGrow(this);msgUpdateSendBtn()">${escapeHtml(S.messageDraft)}</textarea>
    <button id="msg-send-btn" class="msg-send-btn" onclick="sendDedicationMessage()"
      style="background:${myColor}"
      ${S.messageSending || !(S.messageDraft||'').trim() ? 'disabled' : ''}>
      ${S.messageSending
        ? `<div class="spinner" style="width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,.25);border-top-color:#fff"></div>`
        : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`}
    </button>
  </div>`;

  if (S.messagesLoading) {
    return `<div class="msg-chat-body"><div style="display:flex;align-items:center;justify-content:center;padding:80px 0;gap:10px">
      <div class="spinner"></div><span style="color:var(--muted);font-size:14px">Loading messages…</span>
    </div></div>${inputBar}`;
  }

  // Merge sent + received into one chronological timeline
  const allMsgs = [
    ...msgs.sent.map(m => ({ ...m, isSent: true })),
    ...msgs.received.map(m => ({ ...m, isSent: false }))
  ].sort((a, b) => {
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    return (a.time || '00:00').localeCompare(b.time || '00:00');
  });

  if (!allMsgs.length) {
    return `<div class="msg-chat-body"><div class="msg-empty-state">
      <div style="font-size:48px">💌</div>
      <div style="font-size:16px;font-weight:700;color:var(--text)">No messages yet</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.55;max-width:240px">Send your first message to your workout partner below</div>
    </div></div>${inputBar}`;
  }

  window._sentMsgs = [];
  let chatHTML = '';
  let lastDate = '';
  const total = allMsgs.length;
  allMsgs.forEach((m, idx) => {
    if (m.date !== lastDate) {
      chatHTML += `<div class="msg-day-sep"><span>${formatDaySep(m.date)}</span></div>`;
      lastDate = m.date;
    }
    const isLast = idx === total - 1;
    const animClass = isLast ? (m.isSent ? ' msg-anim-right' : ' msg-anim-left') : '';
    const timeLabel = (() => {
      if (!m.time) return '';
      const [h, min] = m.time.split(':').map(Number);
      if (isNaN(h) || isNaN(min)) return m.time;
      const ampm = h < 12 ? 'AM' : 'PM';
      const h12 = h % 12 || 12;
      return `${h12}:${String(min).padStart(2,'0')} ${ampm}`;
    })();

    if (m.isSent) {
      const sentIdx = window._sentMsgs.length;
      window._sentMsgs.push(m);
      const key = msgKey(m);
      const isEditing = S.msgEditingKey === key;
      const isDeleting = S.msgDeletingKey === key;
      if (isEditing) {
        chatHTML += `<div class="msg-bubble-wrap sent msg-edit-wrap">
          <div class="msg-edit-bubble" style="background:${myColor}">
            <textarea id="msg-edit-input" class="msg-edit-input" rows="3"
              oninput="S.msgEditDraft=this.value">${escapeHtml(S.msgEditDraft)}</textarea>
            <div class="msg-edit-btns">
              <button class="msg-edit-btn msg-edit-cancel" onclick="msgCancelEdit()" ${S.msgSaving ? 'disabled' : ''}>Cancel</button>
              <button class="msg-edit-btn msg-edit-save" onclick="msgSaveEdit()" ${S.msgSaving ? 'disabled' : ''}>
                ${S.msgSaving ? '<span style="opacity:.6">Saving…</span>' : 'Save'}
              </button>
            </div>
          </div>
        </div>`;
      } else {
        chatHTML += `<div class="msg-bubble-wrap sent${animClass}${isDeleting ? ' msg-deleting' : ''}"
          ${isDeleting ? '' : `ontouchstart="msgLpStart(event,${sentIdx})" ontouchmove="msgLpMove(event)" ontouchend="msgLpEnd()" oncontextmenu="msgCtxMenu(event,${sentIdx})"`}>
          <div class="msg-bubble sent" style="background:${myColor}">${escapeHtml(m.text)}</div>
          <div class="msg-time">${isDeleting ? '<span style="opacity:.5">Deleting…</span>' : (timeLabel || '') + (m.edited ? ' <span style="opacity:.55;font-size:10px">(edited)</span>' : '')}</div>
        </div>`;
      }
    } else {
      const key = msgKey(m);
      const isUnread = !readSet.has(key);
      const isDeleting = S.msgDeletingKey === key;
      const safeKey = escapeHtml(key);
      chatHTML += `<div class="msg-swipe-wrap swipe-row">
        <div class="swipe-delete-btn" onclick="deleteReceivedMsg('${safeKey}')">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </div>
        <div class="swipe-content" style="touch-action:pan-y"
             ontouchstart="swipeStart(event,this)"
             ontouchmove="swipeMove(event,this)"
             ontouchend="swipeEnd(event,this)">
          <div class="msg-bubble-wrap recv${animClass}${isDeleting ? ' msg-deleting' : ''}">
            <div class="msg-sender" style="color:${partnerColor}">${partnerName}</div>
            <div class="msg-bubble recv${isUnread ? ' unread' : ''}" style="background:${partnerColor}">${escapeHtml(m.text)}</div>
            <div class="msg-time">${isDeleting ? '<span style="opacity:.5">Deleting…</span>' : timeLabel || ''}</div>
          </div>
        </div>
      </div>`;
    }
  });

  return `<div class="msg-chat-body">${chatHTML}</div>${inputBar}`;
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- SWIPE-TO-DELETE (messages) ----
let _swEl = null, _swX0 = 0, _swY0 = 0, _swDx = 0, _swLocked = false;

function swipeStart(e, el) {
  _swEl = el; _swX0 = e.touches[0].clientX; _swY0 = e.touches[0].clientY;
  _swDx = 0; _swLocked = false;
  el.style.transition = 'none';
}
function swipeMove(e, el) {
  if (_swEl !== el) return;
  const dx = e.touches[0].clientX - _swX0;
  const dy = e.touches[0].clientY - _swY0;
  if (!_swLocked) {
    if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
    if (Math.abs(dy) > Math.abs(dx)) { _swEl = null; return; }
    _swLocked = true;
  }
  e.preventDefault();
  _swDx = Math.min(0, Math.max(dx, -72));
  el.style.transform = `translateX(${_swDx}px)`;
}
function swipeEnd(e, el) {
  if (_swEl !== el) return;
  el.style.transition = 'transform 0.2s ease';
  if (_swDx < -36) { el.style.transform = 'translateX(-72px)'; }
  else { el.style.transform = 'translateX(0)'; _swDx = 0; }
  _swEl = null;
}

function msgKey(m) {
  return `${m.date}|${String(m.from).toLowerCase()}|${String(m.text).slice(0, 60)}`;
}

// ---- READ RECEIPTS ----
function getReadMsgs(user) {
  try { return new Set(JSON.parse(localStorage.getItem('readMsgs_' + user) || '[]')); }
  catch(e) { return new Set(); }
}
function markMsgRead(user, key) {
  if (!user || !key) return;
  try {
    const s = getReadMsgs(user);
    if (s.has(key)) return;
    s.add(key);
    localStorage.setItem('readMsgs_' + user, JSON.stringify([...s]));
  } catch(e) {}
}
function getUnreadCount() {
  if (!S.user) return 0;
  if (S.messages) {
    const read = getReadMsgs(S.user);
    return S.messages.received.filter(m => !read.has(msgKey(m))).length;
  }
  return S.pendingUnreadCount || 0;
}

async function deleteReceivedMsg(key) {
  if (!S.messages) return;
  const msg = S.messages.received.find(m => msgKey(m) === key);
  if (!msg) return;
  S.msgDeletingKey = key;
  S.messageSendError = '';
  render();
  try {
    await gasDeleteMessage(msg);
    S.messages.received = S.messages.received.filter(m => msgKey(m) !== key);
    markMsgRead(S.user, key);
    try {
      const stored = JSON.parse(localStorage.getItem('deletedMsgs_' + S.user) || '[]');
      if (!stored.includes(key)) stored.push(key);
      localStorage.setItem('deletedMsgs_' + S.user, JSON.stringify(stored));
    } catch(e) {}
  } catch(e) {
    S.messageSendError = 'Could not delete message — please try again.';
  }
  S.msgDeletingKey = null;
  render();
}

function checkUnreadMessages(user) {
  gasReadAll(MESSAGES_SHEET).then(rows => {
    const read    = getReadMsgs(user);
    const deleted = new Set(JSON.parse(localStorage.getItem('deletedMsgs_' + user) || '[]'));
    let count = 0;
    rows.forEach(row => {
      const date = normDateStr(String(row[0] || ''));
      const text = String(row[4] || '').trim();
      const to   = String(row[3] || '').trim().toLowerCase();
      if (to !== user || !date || text.length < 2) return;
      const from = String(row[2] || '').trim().toLowerCase();
      const key  = `${date}|${from}|${text.slice(0, 60)}`;
      if (!read.has(key) && !deleted.has(key)) count++;
    });
    if (S.pendingUnreadCount !== count) {
      S.pendingUnreadCount = count;
      if (S.screen !== 'intro' && S.screen !== 'setup' && S.screen !== 'user') render();
    }
  }).catch(() => {});
}

// ---- TOGETHER RECORDS ----
async function loadTogetherRecords() {
  // Already computed by loadStreaks() when called from user-select screen
  if (S.togetherRecordsLoading || S.togetherRecordsLoaded) return;
  S.togetherRecordsLoading = true;
  try {
    const [husbandRows, wifeRows] = await Promise.all([
      gasRead(HUSBAND_LOG_SHEET),
      gasRead(WIFE_LOG_SHEET)
    ]);
    const husbandDates = new Set(husbandRows.map(r => normDateStr(r[0])).filter(Boolean));
    const wifeDates = new Set(wifeRows.map(r => normDateStr(r[0])).filter(Boolean));
    const husbandTotal = husbandDates.size;
    const wifeTotal = wifeDates.size;
    const combinedTotal = [...husbandDates].filter(d => wifeDates.has(d)).length;
    const currentStreak = calcCurrentCombinedStreak(husbandDates, wifeDates);
    const bestStreak = calcBestCombinedStreak(husbandDates, wifeDates);
    S.togetherRecords = { combinedTotal, husbandTotal, wifeTotal, currentStreak, bestStreak };
    S.togetherRecordsLoaded = true;
    const dateStr = localDateStr(new Date());
    gasWrite(TOGETHER_RECORDS_SHEET, [[dateStr, husbandTotal, wifeTotal, combinedTotal, currentStreak, bestStreak]]).catch(() => {});
  } catch(e) {}
  S.togetherRecordsLoading = false;
  render();
}

// ---- RECORDS TAB ----

// Scans CONJUGATE_EXERCISES for all trackable single-movement finishers.
// Excludes: interval exercises (Tabata), multi-step circuits (note contains '->').
function getTrackedFinisherMap(userKey) {
  const map = new Map();
  const userData = CONJUGATE_EXERCISES[userKey];
  if (!userData) return map;
  for (const [typeKey, phases] of Object.entries(userData)) {
    const workout = typeKey.charAt(0) + typeKey.slice(1).toLowerCase(); // 'Core', 'Arms', 'Bands'
    for (const days of Object.values(phases)) {
      for (const exercises of Object.values(days)) {
        for (const ex of exercises) {
          if (ex.block !== 'Finisher' || map.has(ex.name)) continue;
          const parsed = parseTarget(ex.target);
          if (parsed.unit === 'interval' || parsed.unit === 'complex') continue;
          if ((ex.note || '').includes('->') || (ex.target || '').includes('->')) continue;
          const unit = (parsed.unit === 'sec' || /plank|hold/i.test(ex.name) || /hold/i.test(ex.target)) ? 'sec' : 'reps';
          map.set(ex.name, { unit, workout });
        }
      }
    }
  }
  return map;
}

async function loadRecordsData() {
  if (S.recordsLoading || S.recordsLoaded) return;
  S.recordsLoading = true;
  render();
  try {
    const logSheet = S.user === 'husband' ? HUSBAND_LOG_SHEET : WIFE_LOG_SHEET;
    const logRows = await gasRead(logSheet);

    const finisherMap = getTrackedFinisherMap(S.user);

    // Legacy exercises with logged history that predate dynamic tracking
    const LEGACY = S.user === 'husband'
      ? [{ name: 'Max Plank Hold',       unit: 'sec',  workout: 'Core' },
         { name: 'Push-Up Burnout',       unit: 'reps', workout: 'Arms' },
         { name: 'Pike Push-Up Burnout',  unit: 'reps', workout: 'Arms' }]
      : [];
    for (const leg of LEGACY) {
      if (!finisherMap.has(leg.name)) finisherMap.set(leg.name, { unit: leg.unit, workout: leg.workout });
    }

    // Build stripped-name index for fuzzy matching (handles band color variants like "Purple Band", "Blue Band")
    const BAND_COLOR_SUFFIX = /\s+(?:Purple|Blue|Green|Tan|Red|Black|Yellow|Orange|Pink)\s+Band\b/gi;
    const strippedIndex = new Map(); // strippedName -> meta from finisherMap
    finisherMap.forEach((meta, name) => {
      const stripped = name.replace(BAND_COLOR_SUFFIX, '').trim();
      if (!strippedIndex.has(stripped)) strippedIndex.set(stripped, meta);
    });

    // Keywords that identify an unknown exercise as a finisher
    const FINISHER_PATTERN = /burnout|to\s+failure|max\s+(reps?|hold|plank|effort)|isometric\s+burnout/i;

    function resolveFinisherMeta(exName) {
      // 1. Exact match
      if (finisherMap.has(exName)) return finisherMap.get(exName);
      // 2. Strip band color suffix and try exact match
      const stripped = exName.replace(BAND_COLOR_SUFFIX, '').trim();
      if (finisherMap.has(stripped)) return finisherMap.get(stripped);
      // 3. Stripped name matches stripped finisher name
      if (strippedIndex.has(stripped)) return strippedIndex.get(stripped);
      // 4. Name contains a finisher keyword — dynamically classify
      if (FINISHER_PATTERN.test(exName)) {
        const isTime = /hold|isometric/i.test(exName);
        return { unit: isTime ? 'sec' : 'reps', workout: String(logRows.find(r => String(r[3]||'').trim() === exName)?.[2] || '') };
      }
      return null;
    }

    const bests = {};
    logRows.forEach(row => {
      const name    = String(row[3] || '').trim();
      const repsStr = String(row[5] || '').trim();
      if (!name || !repsStr) return;
      const meta = resolveFinisherMeta(name);
      if (!meta) return;
      const vals = repsStr.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v) && v > 0);
      if (!vals.length) return;
      const best = Math.max(...vals);
      if (!bests[name] || best > bests[name].value) {
        bests[name] = { value: best, unit: meta.unit, workout: meta.workout || '', date: normDateStr(String(row[0] || '')), notes: String(row[6] || '').trim() };
      }
    });
    // One-time correction: Shoulder Isometric Burnout was logged as 128 reps before unit was fixed to sec
    if (bests['Shoulder Isometric Burnout'] && bests['Shoulder Isometric Burnout'].unit !== 'sec') {
      bests['Shoulder Isometric Burnout'] = { value: 120, unit: 'sec', workout: bests['Shoulder Isometric Burnout'].workout, date: bests['Shoulder Isometric Burnout'].date };
    }
    S.allTimeRecords = bests;
    S.recordsLoaded = true;
  } catch(e) {}
  S.recordsLoading = false;
  render();
}

function togglePRNote(id) {
  const drop = document.getElementById(id);
  if (drop) drop.classList.toggle('open');
  const chev = document.getElementById(id + '-chev');
  if (chev) chev.classList.toggle('open');
}

function renderRecordsBody() {
  if (!S.recordsLoaded && !S.recordsLoading) loadRecordsData();
  if (!S.togetherRecordsLoaded && !S.togetherRecordsLoading) loadTogetherRecords();

  // Personal Records section
  let personalHTML;
  if (S.recordsLoading) {
    personalHTML = `<div class="uploading"><div class="spinner"></div>Loading…</div>`;
  } else {
    const entries = Object.entries(S.allTimeRecords).sort((a,b) => a[0].localeCompare(b[0]));
    if (!entries.length) {
      personalHTML = `<div style="color:var(--muted);text-align:center;padding:24px 0;font-size:14px">No finisher records logged yet.</div>`;
    } else {
      function prCard([name, r]) {
        let valDisplay;
        if (r.unit === 'sec') {
          const m = Math.floor(r.value / 60);
          const s = Math.round(r.value % 60);
          valDisplay = m > 0
            ? `${m}<span style="font-size:12px;color:var(--muted);font-weight:600">m</span> ${String(s).padStart(2,'0')}<span style="font-size:12px;color:var(--muted);font-weight:600">s</span>`
            : `${s}<span style="font-size:12px;color:var(--muted);font-weight:600">s</span>`;
        } else {
          valDisplay = `${r.value} <span style="font-size:12px;color:var(--muted);font-weight:600">${r.unit}</span>`;
        }
        const subLine = [r.workout, r.date ? badgeDateLabel(r.date) : ''].filter(Boolean).join(' · ');
        const hasNotes = !!(r.notes);
        const noteId = 'pr-note-' + name.replace(/[^a-zA-Z0-9]/g, '_');
        const chevron = hasNotes ? `<span class="pr-chevron" id="${noteId}-chev">▾</span>` : '';
        return `<div class="pr-record-card${hasNotes ? ' tappable' : ''}" ${hasNotes ? `onclick="togglePRNote('${noteId}')"` : ''}>
          <div class="pr-record-top">
            <div style="flex:1;min-width:0;overflow:hidden">
              <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</div>
              ${subLine ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">${subLine}</div>` : ''}
            </div>
            <div style="display:flex;align-items:center;flex-shrink:0">
              <div style="font-size:18px;font-weight:800;color:var(--accent)">${valDisplay}</div>
              ${chevron}
            </div>
          </div>
          ${hasNotes ? `<div class="pr-note-drop" id="${noteId}"><div class="pr-note-inner">"${r.notes}"</div></div>` : ''}
        </div>`;
      }
      const timed = entries.filter(([,r]) => r.unit === 'sec');
      const reps  = entries.filter(([,r]) => r.unit !== 'sec');
      const subHead = label => `<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px">${label}</div>`;
      personalHTML =
        (timed.length ? subHead('Timed Holds') + timed.map(prCard).join('') : '') +
        (reps.length  ? subHead('Max Reps')    + reps.map(prCard).join('')  : '');
    }
  }

  // Together Records section
  let togetherHTML;
  if (S.togetherRecordsLoading) {
    togetherHTML = `<div class="uploading"><div class="spinner"></div>Loading…</div>`;
  } else if (!S.togetherRecords) {
    togetherHTML = `<div style="color:var(--muted);text-align:center;padding:24px 0;font-size:14px">No together records yet.</div>`;
  } else {
    const tr = S.togetherRecords;
    const streakColor = tr.currentStreak > 0 ? 'var(--accent)' : 'var(--muted)';
    togetherHTML = `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px">
        <div>
          <div style="font-size:14px;font-weight:600">Combined Workouts</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">Days you both logged a workout</div>
        </div>
        <div style="font-size:22px;font-weight:800;color:var(--accent);flex-shrink:0">${tr.combinedTotal} <span style="font-size:12px;color:var(--muted);font-weight:600">total</span></div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px">
        <div style="font-size:14px;font-weight:600;margin-bottom:10px">Combined Streak</div>
        <div style="display:flex;gap:10px">
          <div style="flex:1;background:var(--surface2);border-radius:8px;padding:10px 12px;text-align:center">
            <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">Current</div>
            <div style="font-size:26px;font-weight:800;color:${streakColor}">${tr.currentStreak}</div>
            <div style="font-size:11px;color:var(--muted)">${tr.currentStreak === 1 ? 'day' : 'days'}</div>
          </div>
          <div style="flex:1;background:var(--surface2);border-radius:8px;padding:10px 12px;text-align:center">
            <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">All-Time Best</div>
            <div style="font-size:26px;font-weight:800;color:var(--yellow)">${tr.bestStreak}</div>
            <div style="font-size:11px;color:var(--muted)">${tr.bestStreak === 1 ? 'day' : 'days'}</div>
          </div>
        </div>
      </div>`;
  }

  return `
  <div style="padding:20px;display:flex;flex-direction:column;gap:24px">
    <div>
      <div style="font-size:18px;font-weight:800;margin-bottom:12px">Personal Records</div>
      <div style="display:flex;flex-direction:column;gap:8px">${personalHTML}</div>
    </div>
    <div>
      <div style="font-size:18px;font-weight:800;margin-bottom:12px">Together Records 👨‍❤️‍👩</div>
      <div style="display:flex;flex-direction:column;gap:8px">${togetherHTML}</div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════
// INTRO VIDEO
// ═══════════════════════════════════════════════
function renderIntro() {
  _introSkipped = false;
  app.innerHTML = `
  <div class="intro-screen" id="intro-screen" onclick="skipIntro()">
    <video id="intro-video" src="Together App Animation.mp4"
      autoplay muted playsinline webkit-playsinline preload="auto">
    </video>
  </div>`;
  const vid = document.getElementById('intro-video');
  vid.playbackRate = 1.25;
  vid.addEventListener('ended', skipIntro);
  // If autoplay is blocked by the browser, skip straight through
  vid.play().catch(() => skipIntro());
  // Pre-fetch streak/XP data during the video so user cards are ready immediately
  if (S.gasUrl && S.streaks.husband === null && !S.streaksLoading) loadStreaks();
}

function skipIntro() {
  if (_introSkipped) return;
  _introSkipped = true;
  const el = document.getElementById('intro-screen');
  const proceed = () => {
    if (S.gasUrl) { _userCardAnim = true; S.screen = 'user'; }
    else S.screen = 'setup';
    render();
  };
  if (el) {
    el.classList.add('fading');
    setTimeout(proceed, 380);
  } else {
    proceed();
  }
}

// BOOT
// ═══════════════════════════════════════════════
window.addEventListener('load', () => {
  applyTheme(localStorage.getItem('theme') || 'dark');
  S.screen = 'intro';
  render();
});
